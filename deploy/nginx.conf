# 文件内容强制下载并限制主动内容；根页面和内置资源保留标准文件管理界面。
map $uri $cad_attachment {
    default attachment;
    ~^/cad-files/(admin|user)/$ "";
    ~^/cad-files/(admin|user)/__dufs_v0\.46\.0__/ "";
}
map $cad_attachment $cad_sandbox {
    default "sandbox; default-src 'none'";
    "" "";
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.xuqian.io;
    return 301 https://dev.xuqian.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.xuqian.io;

    ssl_certificate /etc/ssl/librechat-dev/current/dev.xuqian.io.pem;
    ssl_certificate_key /etc/ssl/librechat-dev/current/dev.xuqian.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 25m;

    include /etc/nginx/cloudflare-realip.conf;

    # 默认账户验证前阻止所有公开认证入口，避免抢占首个管理员角色。
    if (-f /etc/nginx/librechat-dev.provisioning) {
        return 503;
    }

    # 单个文件的短期签名链接不记录查询参数，也不向浏览器或代理缓存文件。
    location ^~ /cad-downloads/admin/ {
        proxy_pass http://127.0.0.1:5003/download/;
        proxy_set_header Host $host;
        access_log off;
        proxy_buffering off;
    }

    location ^~ /cad-downloads/user/ {
        proxy_pass http://127.0.0.1:5004/download/;
        proxy_set_header Host $host;
        access_log off;
        proxy_buffering off;
    }

    location /cad-files/admin/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition $cad_attachment always;
        add_header Content-Security-Policy $cad_sandbox always;
        add_header X-Content-Type-Options nosniff always;
        proxy_buffering off;
    }

    location /cad-files/user/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition $cad_attachment always;
        add_header Content-Security-Policy $cad_sandbox always;
        add_header X-Content-Type-Options nosniff always;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $librechat_connection;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
