server {
    listen 80;
    listen [::]:80;
    server_name dev.xuqian.io;
    return 301 https://dev.xuqian.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.xuqian.io;

    ssl_certificate /etc/ssl/librechat-dev/current/dev.xuqian.io.pem;
    ssl_certificate_key /etc/ssl/librechat-dev/current/dev.xuqian.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 25m;

    include /etc/nginx/cloudflare-realip.conf;

    location / {
        # 默认账户验证前阻止所有公开认证入口，避免抢占首个管理员角色。
        if (-f /etc/nginx/librechat-dev.provisioning) {
            return 503;
        }
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $librechat_connection;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
