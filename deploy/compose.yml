name: librechat-dev

services:
  api:
    image: ${LIBRECHAT_IMAGE:?Set LIBRECHAT_IMAGE in image.env}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-3080}:3080'
    env_file: .env
    environment:
      # 后端启动配置决定浏览器标题与页脚，不能只修改前端 HTML 或环境变量示例。
      APP_TITLE: 庄严宝刹 AI 设计助手
      CUSTOM_FOOTER: 庄严宝刹 AI 设计助手 · 仅供内部概念设计参考
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: production
      ENDPOINTS: agents,custom,google
      GOOGLE_MODELS: gemini-4-argon
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-nano-banana-2.1}
      STUDIO_MCP_URL: http://studio:8000/mcp
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_API_URL: http://rag_api:8000
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
      rag_api:
        condition: service_started
      studio:
        condition: service_healthy
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - images:/app/client/public/images
      - uploads:/app/uploads
      - logs:/app/api/logs
      - appdata:/app/data
    healthcheck:
      # 文件服务必须完成数据库初始化，部署才能被标记为健康。
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all(['http://127.0.0.1:3080/health','http://rag_api:8000/openapi.json'].map(url=>fetch(url))).then(results=>process.exit(results.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  # 庄严宝刹概念设计 MCP 服务容器
  studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE in image.env}
    user: '10001:10001'
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    environment:
      STUDIO_SETTINGS_FILE: /run/secrets/studio.json
      # auto在无AVX主机限制PyTorch与oneDNN为安全CPU内核；safe强制限制，native保留原生调度。
      STUDIO_SEGMENT_CPU_CAPABILITY: ${STUDIO_SEGMENT_CPU_CAPABILITY:-auto}
      # 子进程预热与单次分割的等待上限（秒）；超时仅停用分割，不退出工作台。
      STUDIO_SEGMENT_WORKER_TIMEOUT_SECONDS: ${STUDIO_SEGMENT_WORKER_TIMEOUT_SECONDS:-90}
    volumes:
      - ./studio.json:/run/secrets/studio.json:ro
      - images:/librechat/images:ro
      - studio-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    volumes:
      - search:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
    volumes:
      - vectors:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 10s
      timeout: 5s
      retries: 12

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD}
      RAG_PORT: 8000
    env_file: .env
    depends_on:
      vectordb:
        condition: service_healthy

volumes:
  mongodb:
  search:
  vectors:
  images:
  uploads:
  logs:
  appdata:
  studio-data:

# 为默认Compose网络开启IPv6，确保studio容器可通过IPv6连接火山方舟等双栈上游服务
networks:
  default:
    enable_ipv6: true
