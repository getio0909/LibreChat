name: librechat-dev

services:
  api:
    image: ${LIBRECHAT_IMAGE:?Set LIBRECHAT_IMAGE in image.env}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-3080}:3080'
    env_file: .env
    environment:
      # 后端启动配置决定浏览器标题，不能只修改前端 HTML 或环境变量示例。
      APP_TITLE: 庄严宝刹 AI 设计助手
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: production
      ENDPOINTS: custom
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_API_URL: http://rag_api:8000
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
      rag_api:
        condition: service_started
      freecad-admin:
        condition: service_healthy
      freecad-user:
        condition: service_healthy
      blender-admin:
        condition: service_healthy
      blender-user:
        condition: service_healthy
      design-admin:
        condition: service_healthy
      design-user:
        condition: service_healthy
    networks: [default, cad-admin, cad-user]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - images:/app/client/public/images
      - uploads:/app/uploads
      - logs:/app/api/logs
      - appdata:/app/data
    healthcheck:
      # 文件服务必须完成数据库初始化，部署才能被标记为健康。
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all(['http://127.0.0.1:3080/health','http://rag_api:8000/openapi.json'].map(url=>fetch(url))).then(results=>process.exit(results.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    volumes:
      - search:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
    volumes:
      - vectors:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 10s
      timeout: 5s
      retries: 12

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD}
      RAG_PORT: 8000
    env_file: .env
    depends_on:
      vectordb:
        condition: service_healthy

  workspace-init:
    image: ${DESIGN_IMAGE:?Set DESIGN_IMAGE in image.env}
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    # 沿用 Blender 镜像的非 root 用户，所有 CAD 写入方使用同一 UID。
    entrypoint:
      - node
      - -e
      - "const fs=require('node:fs'); for(const dir of ['/work/admin','/work/user']) { fs.chownSync(dir,10001,10001); fs.chmodSync(dir,0o700); }"
    volumes: [cad-admin:/work/admin, cad-user:/work/user]

  freecad-admin: &freecad
    image: ${FREECAD_IMAGE:?Set FREECAD_IMAGE in image.env}
    user: '10001:10001'
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      cad-admin:
        aliases: ['freecad-${CAD_ADMIN_USER_ID:-admin}']
    volumes:
      - cad-admin:/tmp/cad
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  freecad-user:
    <<: *freecad
    networks:
      cad-user:
        aliases: ['freecad-${CAD_USER_USER_ID:-user}']
    volumes: [cad-user:/tmp/cad]

  blender-admin: &blender
    image: ghcr.io/hotspoons/blender-agent@sha256:23455350cdfa23be743a999da50e68786ff3edd0415e219cba1fab435ee25c44
    user: '10001:10001'
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BLENDER_AGENT_MCP_PORT: 10101
      BLENDER_MCP_MEDIA_DIR: /tmp/cad
    command: [--spawn-blender]
    networks:
      cad-admin:
        aliases: ['blender-${CAD_ADMIN_USER_ID:-admin}']
    volumes:
      - cad-admin:/tmp/cad
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/10101']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  blender-user:
    <<: *blender
    networks:
      cad-user:
        aliases: ['blender-${CAD_USER_USER_ID:-user}']
    volumes: [cad-user:/tmp/cad]

  design-admin: &design
    image: ${DESIGN_IMAGE:?Set DESIGN_IMAGE in image.env}
    user: '10001:10001'
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      cad-admin:
        aliases: ['design-${CAD_ADMIN_USER_ID:-admin}']
      design-admin:
    volumes:
      - ./design-admin.json:/run/secrets/design.json:ro
      - cad-admin:/tmp/cad
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  design-user:
    <<: *design
    networks:
      cad-user:
        aliases: ['design-${CAD_USER_USER_ID:-user}']
      design-user:
    volumes:
      - ./design-user.json:/run/secrets/design.json:ro
      - cad-user:/tmp/cad

  files-admin: &files
    image: sigoden/dufs@sha256:8dd3b750015734703e64b55641fb7d2254c112e0ff3967074766177dc15dc982
    user: '10001:10001'
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [--config, /run/secrets/files.yaml]
    networks: [cad-admin, design-admin]
    ports: ['127.0.0.1:5001:5000']
    volumes:
      - ./files-admin.yaml:/run/secrets/files.yaml:ro
      - cad-admin:/data
    mem_limit: 128m

  files-user:
    <<: *files
    networks: [cad-user, design-user]
    ports: ['127.0.0.1:5002:5000']
    volumes:
      - ./files-user.yaml:/run/secrets/files.yaml:ro
      - cad-user:/data

networks:
  cad-admin:
    internal: true
  cad-user:
    internal: true
  design-admin:
  design-user:

volumes:
  mongodb:
  search:
  vectors:
  images:
  uploads:
  logs:
  appdata:
  cad-admin:
  cad-user:
