prompt_zh: 传统佛教寺庙大雄宝殿主殿佛像陈设场景，中轴对称广角构图，正面通长深红色木雕束腰须弥座佛坛，中央供奉三尊金身三世佛坐像与两尊弟子立像，三尊主佛背后是三块圆拱形工笔重彩佛国净土壁画背板，两侧配有黑底金字楹联，外侧左右两个发光佛龛分别供奉骑青狮的文殊菩萨与骑白象的普贤菩萨，佛坛前居中设木雕供桌与三个方形蒲团，左右两侧墙面镶嵌巨幅框装重彩佛教经变壁画，高光灰褐大理石地面，8K建筑渲染
