prompt_zh: 唐宋风格现代多层佛教寺院建筑“地藏殿”外立面局部效果图，仰视角度，四层重檐歇山顶楼阁结构，外墙采用米白色条石干挂砌筑，每层整齐开设深褐色中式木格窗，层间挑出青灰瓦飞檐翘角并饰有成排深色木斗拱，翼角悬挂金色风铃，顶层人字形山墙饰有金色卷草悬鱼浮雕，底层为青石雕花门廊并挂有“地藏殿
  地宫出入口”金字标牌，右侧前景盛开粉红色花树，傍晚霞光云天，8K建筑渲染。
