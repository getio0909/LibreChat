ai_design_usage: 适用场景：佛教壁画与雕塑博物馆长廊反向视角设计 / 米黄石材折面洗墙灯带基座参考 / 中式圆形月洞门展厅尽端框景生成；推荐搭配：米黄莱姆石斜面洗墙基座 + 双层内嵌高显指壁画灯箱 + 浅胡桃木全玻独立展柜 +
  深灰哑光青石地砖 + 圆形月洞门端景
prompt_zh: 现代新中式佛教壁画与石材造像博物馆展厅长廊，单点透视纵深构图，左侧整面墙为上下两层嵌入式长卷佛教经变壁画与彩塑灯箱展柜，下方设有米黄色大理石斜面发光基座与黑色石材踢脚；展厅中央排列一列原木底座透明玻璃罩小型金铜佛像展柜；右侧靠墙排列多座独立玻璃展柜，展示白玉与翠玉观音雕像；前景右侧设中式竖条木格栅屏风与点燃蜡烛的古典铜烛台，走廊尽端为一道雅致的圆形月洞门框景，深灰黑青石板地面，三层跌级暖光吊顶，静谧典雅，高清效果图。
