prompt_zh: 现代新中式佛教禅意庭院景观设计局部场景，前景右侧为清澈蔚蓝的现代极简几何静水池，左侧伫立一座传统白麻花岗岩雕刻的四角攒尖宝珠顶唐式石灯笼，一道现代灰白色石材矮横栏分隔前中景；中景翠绿草坪上点缀天然黑山石与修剪平整的灌木，一株造型苍劲优美的多层云片状罗汉松舒展枝叶；背景为高大现代的竖向原木色格栅与玻璃幕墙建筑立面，阳光明媚，清新宁静的东方禅意园林效果图。
