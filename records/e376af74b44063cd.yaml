prompt_zh: 中国传统与新唐风结合的寺院大雄宝殿建筑外观及前广场全景效果图，严格中轴对称构图，高大的白色汉白玉须弥座月台之上矗立恢弘的重檐歇山顶佛殿，青灰瓦屋面配金色鸱尾，重檐正中悬挂“大雄寶殿”黑底金字牌匾，八根朱红色廊柱敞开，殿内清晰可见三尊巨大的金身坐佛；前方为宽阔的花岗岩礼佛大道与雕龙御道台阶，两侧对称排列唐式石灯笼、石雕护法与苍松繁花，右后方远景耸立一座多层木塔，庄严神圣，8K建筑表现图
