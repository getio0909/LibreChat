prompt_zh: 大型佛教寺庙室内金色佛塔大殿，中轴对称广角仰视构图，前景为洁白的汉白玉三路九级石材台阶与卷云雕花栏杆，中央汉白玉丹陛御道雕刻圆形回纹框麒麟瑞兽浮雕，御道顶端盛开一朵橙红色发光琉璃莲花灯，中景八角形红棕色石雕须弥座高台上矗立一座巨大的藏式铜鎏金尊胜舍利宝塔，塔座雕刻雪山狮子与八吉祥浮雕，覆钵塔身悬挂金色璎珞，塔刹直通顶部八角发光藻井中心的蓝色星空天池，藻井悬挂月牙形白玉吊灯，大殿采用传统斜坡露明深色木椽屋顶，四周环绕发光千佛回廊，庄严神圣，8K超高清渲染
