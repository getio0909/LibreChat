prompt_zh: 广角斜向全景拍摄新中式高端石材艺术展厅，核心为一面9米长的“天然美石·佛國畫卷”巨幅天然奢石背景墙，由四块大幅“佛国画卷”（敦煌金大理石系列）镜像对称拼接而成，天然金黄色、琥珀色与深紫黑色纹理在左右两侧自然凝结成两座对称的佛塔奇观，石材右侧上方投射着八列白色竖排中文禅诗发光字体，四周镶嵌100mm宽实木莲瓣雕花边框，底部为900mm高深胡桃木中式回纹护墙板，顶部米白色墙面有黑色立体书法大字与密集的黑色轨道射灯、长臂洗墙灯，地面满铺灰蓝色金纹大理石，前景左侧有现代白色圆形洽谈桌椅，8K商业空间实景摄影。
