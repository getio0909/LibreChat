prompt_zh: 天然玉石敦煌金高浮雕佛教须弥座长廊透视特写，浅景深微距摄影，金黄色与琥珀棕交织的天然玉石材质，高光水磨抛光；须弥座严格遵循传统五层结构：顶层雕刻卷草如意纹并安装纯白汉白玉栏杆，第二层为饱满的覆莲瓣，中间束腰部位雕刻回纹拐子框与繁复立体的宝瓶缠枝牡丹莲花高浮雕，下层为浑圆肥厚的仰覆莲瓣，底层圭角雕刻回字几何纹，底部衔接黑白金棋盘格大理石地面，刀工精湛立体，光影质感温润尊贵，8K石雕艺术摄影。
