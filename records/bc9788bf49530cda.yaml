ai_design_usage: 适用场景：现代大型禅修大殿/佛教大讲堂空间设计 / 层叠莲花瓣内发光背景佛龛参考 / 大跨度发光格栅吊顶与蒲团矩阵生成；推荐搭配：浅灰云纹大理石地面 + 白色GRG/汉白玉层叠莲花发光佛龛 + 24K鎏金铜浮雕柱套
  + 明黄色圆形禅修蒲团 + 4000K自然暖白线性发光天幕
prompt_zh: 现代大跨度佛教寺院禅修大殿与讲堂内部全景，单点透视严格中轴对称构图，正前方远端为一座巨大的多层盛开白玉莲花瓣形内发光佛龛，内部供奉纯白汉白玉释迦牟尼坐佛与实木供台；浅灰色云纹大理石地面中央留出宽阔通道，左右两侧整齐排列成百上千个明黄色圆形印莲花纹禅修蒲团；大殿两侧对称矗立四根粗壮圆柱，柱底包嵌华丽的鎏金浮雕铜柱套与青石莲花柱础；顶部为现代感极强的斜向折板式白色发光条形天幕吊顶，空间开阔澄明，神圣庄严，8K建筑渲染图。
