prompt_zh: 挑高两层的宏伟千手观音殿室内空间设计，斜向广角仰视构图，中央供奉一尊巨大的金身千手千眼观音立像，背后是放射状金色背光，底座层叠围绕上百尊发光小金佛，右侧高墙上镶嵌红底描金“摩尼部增益法如意珠手印”等四十二手眼浮雕壁画与内嵌发光千佛龛，粗壮的米色巨柱配鎏金莲花柱础与金箍，左侧为二层回廊与满墙万佛龛，顶部为发光方格藻井与圆形蓝色星空穹顶，悬挂橘黄色莲花灯，深灰黑色石砖地面摆放两排黄色拜垫，金碧辉煌，8K效果图
