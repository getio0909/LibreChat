ai_design_usage: 现代寺院地藏殿/功德堂核心佛龛设计、叠级暗藏灯带莲瓣形背景墙造型参考
prompt_zh: 现代中式地藏殿室内供奉空间设计，竖幅中轴对称构图，正中央供奉一尊庄严的铜鎏金地藏王菩萨结跏趺坐像，头戴五佛宝冠，右手持九环锡杖，左手托摩尼宝珠，下承多层鎏金莲花座；背后是极具设计感的多层重叠绽放的巨型发光莲花瓣造型背景墙，层间暗藏柔和暖金色灯带；前方设深色红木雕花供桌，摆放铜香炉、烛台与水果供品，两侧墙面内嵌发光万佛小龛，神圣慈悲，8K室内设计渲染图
