prompt_zh: 传统佛教寺庙大殿内部侧廊展览空间，斜向透视构图，深红棕色实木地板，画面中央矗立一根粗壮的红木大圆柱，柱脚包镶精美的鎏金仰覆莲瓣束腰铜箍并立于青石双层莲花柱础之上，左侧为高耸的红木精雕大佛龛侧壁与镶嵌鎏金荷花浮雕的木雕护栏，右侧墙面下部为浅灰白色大理石雕花须弥座台基，上方内嵌整面暗红色发光小拱龛千佛墙（正中设一尊较大金佛），顶部为传统木构方格藻井，古典庄严，建筑室内效果图
