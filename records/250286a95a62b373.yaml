prompt_zh: 传统佛教寺庙大殿正面中轴对称全景，深红棕色高光实木地板，前景左右耸立两根带鎏金莲瓣束腰铜箍与青石多层莲花柱础的红木大圆柱，正中央为一座极其宏伟的五开间重檐歇山顶红木透雕天宫楼阁式大佛龛，飞檐斗拱层层挑出，贴金龙凤卷草雕花繁复华丽，五个佛龛内均饰有贴金毗卢帽花罩并供奉佛像，佛龛前设镶嵌鎏金荷花浮雕的通长木护栏，前方一字排开五张红木雕花供桌与五对十个米黄色方形拜垫，左右两侧墙面内嵌暗红色发光千佛墙，8K超清建筑效果图
