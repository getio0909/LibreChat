prompt_zh: 浙江东阳卢宅肃雍堂宏伟的明代传统厅堂室内空间，严格中轴对称广角构图，前景正中阶沿上摆放一张古朴的雕花翘头三弯腿石质香案，中景两根粗壮的黑色圆柱高耸入顶，上方彩绘冬瓜大梁之间错落悬挂着“风纪世家”、“科第世家”、“翰林”等多块历代古木金字牌匾与六角红纱宫灯；大堂正中央悬挂一盏高达数米的巨型非遗刺绣串珠九狮球华盖大堂灯，庄重威严，历史古建摄影。
