prompt_zh: 超高清现代禅意木质茶室与会所室内设计案例，横幅广角透视，右侧前景矗立一根粗壮的天然原木大圆柱，底部承托精美的白色汉白玉石雕鼓形柱础，柱旁摆放一张厚重的老榆木长条茶桌与黑色皮垫中式禅椅，桌上布置茶席与红叶盆景；画面左侧地面并排放置两个米色方形打坐蒲团，正后方原木护墙板上镶嵌四幅竖向长条形内发光金箔水墨山水屏风，左侧为通高竖向木格栅移门，浅米灰哑光石材地面，原木平顶嵌几何线性灯槽，雅致禅意，8K室内效果图
