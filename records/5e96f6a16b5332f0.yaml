ai_design_usage: 适用场景：佛教文物博物馆/寺院珍宝馆长廊空间设计 / 独立佛像展柜与双层壁画灯箱墙立面参考 / 新中式展厅入口格栅屏风与烛台框景设计；推荐搭配：浅胡桃木饰面展柜 + 超白低反射夹胶玻璃 + 爵士白/米白石材斜面壁画托台
  + 深灰哑光青石地砖 + 3000K高显指（Ra≥95）博物馆重点射灯
prompt_zh: 现代新中式佛教文物博物馆展陈长廊内部场景，单点透视纵深构图，前景两侧为中式竖条木格栅屏风与古典红烛立柱，右侧墙面局部镶嵌灰色海浪纹浮雕石板与圆形鎏金瑞兽圆盘；展厅左侧靠墙排列原木底座独立展柜，陈列金铜佛像、白玉观音与彩绘菩萨，上方设独立方形射灯罩，背景为发光障子纸光幕；中央中轴线排列全透明玻璃罩小型佛像展柜；右侧整面墙为上下两层嵌入式佛教壁画灯箱展柜；顶部为三层跌级暖光灯带吊顶，地面铺设深灰黑色青石板，静谧高雅，高清室内效果图。
