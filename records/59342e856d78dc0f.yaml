prompt_zh: 纯白背景家具正面立面图，一座华美庄严的藏式双层阶梯顶双门木雕彩绘供柜，深酱紫红色实木柜体配璀璨真金贴金边框，顶部双层阶梯束腰高浮雕金色八吉祥与五欲妙供图案，柜体外框饰金色回纹与立体莲珠纹，上方双抽屉，下方左门海棠开光内精雕彩色和气四瑞图（白象、猕猴、兔子、飞鸟），右门开光内精雕六长寿图（寿星老人、仙鹿、仙鹤、松树），8K超清产品图。
