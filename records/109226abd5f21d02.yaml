summary_zh: 本图为一座气势磅礴的汉藏融合（显密双修）大雄宝殿正面主佛坛陈设全景。空间将汉传佛教经典的“三世佛 + 二弟子”五尊造像体系与藏传佛教无上瑜伽部本尊“大威德金刚（或时轮金刚）双身忿怒尊”及藏式法座、经堂坐垫融为一体，呈现出极尽庄严华美、显密圆融的宗教殿堂气象。
  全殿主佛坛通体采用高纯度24K贴金木雕/铜雕工艺，散发出耀眼夺目的赤金光泽；主尊正前方的密宗护法本尊采用藏传唐卡式矿物重彩（深邃宝蓝身色、五骷髅冠、多臂持法器、下踏莲台）塑造；法座与前排四列经箱坐垫采用纯正的藏式朱红/大红漆艺，绘制金彩八吉祥与雪狮团花图案…
