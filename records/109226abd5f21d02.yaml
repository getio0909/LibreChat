ai_design_usage: 适用场景：藏传/汉藏融合寺院主佛坛正面立面设计 / 贴金盘龙柱三开间大佛龛与大背光参考 / 显密双修佛殿供具与法会坐垫陈设生成；推荐搭配：全贴金木雕盘龙柱三开间佛龛 + 锻铜贴金三世佛坐像 + 藏式重彩密宗本尊造像
  + 朱红描金藏式法座与经垫 + 深色镜面大理石地面
prompt_zh: 金碧辉煌的汉藏融合佛教大殿正面主佛坛陈设全景，严格中轴对称构图，后方高大贴金雕花须弥座上矗立四根立体贴金盘龙巨柱构成的三开间大佛龛，三间内并列供奉三尊大型金身结跏趺坐佛，每尊背后有繁复镂空的金色大舟形火焰背光，中央主佛两侧侍立阿难与迦叶金身立像；主尊正前方红色藏式雕花高法座上供奉一尊蓝身多臂忿怒尊（大威德金刚）彩绘雕像；台沿摆放一排藏式八供，台下木地板与藏毯上对称排列四列红色吉祥图案法会坐垫箱，前景为高光深色大理石地面，富丽堂皇，8K超高清效果图。
