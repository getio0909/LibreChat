prompt_zh: 博物馆级印度莫卧儿风格白色大理石透雕花窗（Jali）构件写实，灰色纯净背景，竖向长方形外框内嵌尖拱形窗框，拱肩两侧各有一朵高浮雕八瓣莲花，窗心由极其精密的八角形、菱形与十字星几何网格镂空透雕而成，大理石线条表面带有立体的斜削倒角，呈现温暖的象牙白包浆与淡淡的天然灰纹理，棚拍柔和侧光，超高清文物摄影。
