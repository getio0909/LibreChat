prompt_zh: 新中式佛教共修禅堂室内全景设计，严谨的中轴对称广角构图，左右两侧整面高墙为浅米灰色背景配整齐排列的立体白色发光汉字《大悲咒》全文，正前方青石雕花台基上并列两张中式实木雕花供桌，后方主背景墙镶嵌巨幅重彩佛陀说法图壁画，四周饰有暖光木格栅边框，顶部为传统井字形原木梁架配筒灯，深灰褐色石材地面上整齐阵列三十五个明黄色绣莲花圆形打坐蒲团，庄严明亮，8K超高清室内渲染。
