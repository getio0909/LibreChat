prompt_zh: 奢华庄严的佛教寺院大殿内部广角对称场景，前景左右对称矗立两根粗壮的米白色大理石方柱，下部为深灰黑色高浮雕莲花须弥柱础；大殿地面铺设光洁如镜的深咖色带白纹高光大理石，完美倒映整个大殿；中央为一座洁白的汉白玉雕花栏杆围绕的须弥座坛城，前端有汉白玉台阶，两侧伫立金色护法神像，坛城中央金色高台上供奉金身坐佛与蓝金大背光；正上方八角形金碧藻井中心垂挂一座巨大的多层贴金华盖宝盖，四周墙面满布暖黄色发光的方格万佛墙，气势恢宏，高清建筑渲染。
