prompt_zh: 新中式别墅家宅佛堂与茶禅空间室内设计，抬高的浅灰水磨石台基上摆放前后高低两张深胡桃木翘头供桌，背景墙为对称弧形内凹造型并暗藏暖光灯带，顶部悬挑木托架供奉铜佛与金色莲花背光，两侧对称瓶插粉荷，上方为弧形木条轩顶与中式云头门罩，前景蔺草地席上摆放深木色矮茶几、黑陶茶具、枯荷花瓶与编织蒲团，柔和暖调光影，建筑室内摄影质感，8K超高清
