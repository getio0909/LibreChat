prompt_zh: 传统中式红木佛堂室内供桌与佛像陈设场景，正中央红木雕花佛龛内设海棠形发光金色《般若波罗蜜多心经》浮雕背板，两侧刻有“三宝常护念、六时恒吉祥”金色对联，前方并列供奉三尊带金色镂空火焰背光的铜鎏金三世佛坐像，佛前居中摆放一张宽大的红木束腰雕花供桌，陈列香炉红烛与鲜果，桌前地垫上排列三个黄底红边方形蒲团，两侧立红木落地宫灯，左右白墙悬挂框装佛教壁画，暖棕色方格石材地面，红木方格藻井吊顶，8K效果图
