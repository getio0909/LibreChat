ai_design_usage: 适用场景：现代寺院功德堂/万佛堂立面护墙设计 / 爵士白大理石浮雕画框与深木格千佛龛结合参考 / 大小嵌套式万佛墙模块生成；推荐搭配：爵士白/鱼肚白大理石矩形线框护墙裙 + 汉白玉浮雕卷草外框 + 深胡桃木矩阵佛龛
  + 金身红莲座坐佛 + 深色木纹砖/木地板
prompt_zh: 现代佛教寺院石质与木质结合的千佛墙展览设计场景，竖幅斜视构图，墙面下部为一米高的爵士白天然云纹大理石护墙裙，带有精致的矩形凹凸线框；上部外围以雕刻连续卷草浮雕纹的白色大理石宽边框包边，内部镶嵌整面深胡桃木色方格矩阵千佛龛，每个小木龛内供奉一尊坐在红橙渐变莲花座上的金身小坐佛并带暖光照明；左侧中部跨四格嵌设一个中型镂空雕花木框主佛龛，内供一尊较大尺寸的通体鎏金坐佛，深褐色木地板，现代典雅与传统庄严完美结合，高清室内效果图。
