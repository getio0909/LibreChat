prompt_zh: 佛教殿堂顶部圆形星空穹顶与八角斗拱藻井装饰设计仰视特写，由下至上分为四层结构：最下层为八角形雕花木梁与密集排列的传统木作斗拱，后衬暖黄发光竖条格栅；第二层为环绕穹顶一周的八个大型菩提叶尖拱形内凹暖光壁龛；第三层为双圈高浮雕仰莲花瓣圆环；最中心顶部为深邃的宝蓝色圆形夜空天幕，上面闪烁着数十颗璀璨的白色光纤星光点，温暖的金色木石结构与深邃的蓝色星空形成强烈对比，庄严神秘，8K超高清细节。
