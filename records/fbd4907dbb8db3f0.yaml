summary_zh: 本图为敦煌金须弥座台面前沿安装的天然汉白玉微缩仿古护栏（栏杆）与敦煌金上枭卷草浮雕交接处的微距结构特写。在室内佛堂或展厅佛台中，微缩石栏杆既起到界定神圣佛龛领域（“栏楯”庄严）的宗教象征作用，又极大丰富了台基的天际线层次。
