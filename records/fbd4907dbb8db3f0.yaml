prompt_zh: 佛教须弥座佛台前沿的天然汉白玉微缩栏杆微距特写，浅景深摄影，洁白温润的汉白玉栏杆由方形盝顶望柱、上下横梁与镂空双海棠如意孔栏板组成，石质细腻如脂；栏杆稳固安装在天然玉石敦煌金高浮雕基座的压顶石上，下方基座呈现出金黄与琥珀棕交织的天然网格石纹，并雕刻着立体的卷草如意浮雕，一白一金冷暖石材碰撞对比强烈，工艺精湛，背景柔和虚化，8K产品微距摄影。
