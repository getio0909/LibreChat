ai_design_usage: 适用场景：现代佛教艺术展厅广角空间布局参考 / 素白石材万佛墙与一佛二弟子主坛组合设计 / 现代简化八角垂莲藻井生成；推荐搭配：暖白汉白玉CNC雕刻千佛墙 + 泥金彩绘一佛二弟子造像 + 白色新中式八角垂莲藻井
  + 灰绿云纹大理石高光拼花地面
prompt_zh: 新中式素雅白石佛教展厅广角室内全景，右侧主佛坛石雕台基上供奉泥金彩绘释迦牟尼坐佛（配金色火焰背光）与阿难、迦叶二弟子立像，背景为浅浮雕水墨群山与两侧发光经文格栅；正面转角墙面设壶门形大佛龛供奉坐佛；左侧整面长墙为暖白大理石雕刻的矩阵式背光万佛小龛，中部嵌入三个大拱龛供奉三尊白玉立佛；顶部为白色新中式八角形垂莲柱格栅藻井，地面铺设高光灰绿色大理石几何拼花，光影柔和圣洁，现代禅意建筑效果图。
