prompt_zh: 泰国曼谷云石寺（大理石寺）大雄宝殿室内宏伟场景，中轴对称构图，正中央高耸的贴金佛坛上供奉一尊通体耀眼鎏金的泰式成功佛（钦那拉佛），身后环绕华丽的镂空火焰状金色背光，后方背景墙为深邃的皇家宝蓝色并带有柔和光晕；大殿两侧高墙满绘金色泰式传统菱形纹样，配红底描金的高挑尖拱窗与大理石护墙裙，地面铺设鲜艳红地毯，展示了东南亚皇家佛寺的金碧辉煌与神圣氛围。
