ai_design_usage: 适用场景：传统寺院大殿室内台基高差与汉白玉丹陛踏步设计 / 露明斜坡木椽屋顶与井字平棊吊顶过渡参考 / 佛殿内部空间透视构图；推荐搭配：汉白玉浮雕丹陛御道踏步与抱鼓石栏杆 + 深红木方柱配透光云石壁灯 + 橙黄琉璃莲花供灯
  + 露明木椽斜屋顶配暖光洗墙灯带
prompt_zh: 中国传统佛教文化主题殿堂内部空间，对角线仰视构图，右下角为洁白的汉白玉三级踏步台阶，中央镶嵌浅浮雕团花纹丹陛御道斜坡，两侧配祥云抱鼓石栏板，台基上陈列两座橙黄色发光的盛开莲花供灯，远端背景可见大幅佛教彩绘壁画；画面中景矗立一根高大的深红木方柱，下承青白石覆莲须弥柱础，柱身挂载竖长条暖光云石壁灯；顶部展现斜坡密排木椽屋顶与井字形白色平棊吊顶，暗藏暖色灯带与射灯，庄重古雅，高清建筑室内效果图。
