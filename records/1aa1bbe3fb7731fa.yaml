summary_zh: 本图为大型传统寺院佛殿或佛教文化主题展馆内部主殿台基与外侧回廊交界处的空间场景（与第 01 张同属一座大型殿堂，本图视角转向主佛坛前端的汉白玉丹陛台阶）。空间通过高差台基、巨柱阵列与折坡屋顶，营造出拾级而上、步入佛国的庄严空间序曲。
  空间以深棕红木结构、洁白汉白玉礼制台基、青白石柱础与灰褐青石地砖构成古朴厚重的材质体系。右侧主坛台基采用整料汉白玉砌筑三级踏步，正中斜坡镶嵌浅浮雕卷草宝相团花丹陛御道石，两侧护以云纹抱鼓石与莲花望柱栏板；台基上安放两座橙黄色透光琉璃盛开莲花座灯；主柱采用深红木包柱，底部为青白石多层…
