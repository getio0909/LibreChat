ai_design_usage: 适用场景：传统金碧辉煌佛殿室内全景设计 / 重彩佛教壁画与背光万佛龛墙面组合参考 / 八角贴金藻井与拜垫阵列空间生成；推荐搭配：深色红木雕花护墙须弥座 + 工笔重彩描金壁画 + 贴金方形莲花平棊天花 + 深灰哑光青石地砖
  + 米黄红边礼拜方垫
prompt_zh: 金碧辉煌的中国传统佛教寺院大殿内部礼拜空间，广角透视，地面铺设深灰色青石砖，整齐排列多排米黄色带红边的方形拜垫蒲团；四周墙面下部为深红木雕花贴金莲瓣须弥座，中部镶嵌大幅重彩描金观音与诸菩萨群像壁画，壁画两侧为暖黄发光的方格千佛龛（内供白玉坐佛）及火焰宝珠形黄色透光圆窗；墙顶一圈立体彩塑飞天瑞兽与贴金斗拱，天花中央为八角形贴金盘龙藻井，两侧为金色方形莲花平棊发光格栅吊顶，庄严华丽，超高清建筑效果图。
