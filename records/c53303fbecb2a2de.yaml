summary_zh: 本图为陈设于传统佛教殿堂佛坛两侧或回廊通道旁的单体“六角亭阁式立柱落地宫灯（供灯/长明灯）”写实特写。器型仿造中国传统六角攒尖顶亭阁古建筑，兼具殿堂辅助照明与宗教“燃灯供佛、破除愚痴”的礼仪陈设功能。 宫灯主体采用暖红棕色（紫檀色/红砂岩色）致密石材或名贵硬木精雕而成，表面呈温润的半哑光质感；上部灯室六面镶嵌金色菱形斜方格镂空花窗与半透明暖黄仿羊皮灯罩，内部点亮2700K暖黄光源，光影透过格栅柔和溢出。
