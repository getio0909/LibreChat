ai_design_usage: 适用场景：传统佛殿佛坛两侧落地宫灯单品植入 / 中式六角亭阁式石灯笼/木宫灯三维建模与生图参考 / 佛教陈设器具局部替换(Inpainting)；推荐搭配：红砂岩/紫檀木精雕灯体 + 黄铜鎏金菱形花格窗棂 +
  仿羊皮透光云石灯片 + 2400K暖烛光LED光源
prompt_zh: 中国传统佛教寺院室内立柱式六角亭阁造型落地装饰宫灯单品特写，暖红棕色木石雕刻材质，三段式结构：底部为稳重的六角形覆斗状斜坡台基与仰覆莲花束腰座；中部为挺拔的圆柱形灯杆；上部为六角攒尖顶古建亭式灯笼，屋顶冠有莲花摩尼宝珠顶刹，六个翘起檐角下悬挂流苏小铃铛，六面灯窗镶嵌精细的金色菱形花格镂空窗棂，内部透出温暖柔和的黄色灯光，造型古朴典雅，高清产品写实渲染。
