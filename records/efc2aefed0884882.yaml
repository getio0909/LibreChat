prompt_zh: 极具意境的佛教药师殿室内佛像展示场景，正中央供奉一尊通体深宝蓝色的半透明琉璃药师佛坐像与蓝色琉璃莲花座，左右两侧对称站立两尊琥珀金色日光遍照与月光遍照菩萨立像，背后是一整面宽阔的巨幅发光金色云海仙山与飞鹤背景壁画，前景矗立深棕色实木大圆柱配青石雕花鼓形柱础，中央摆放木雕供桌与两排共十二个米黄色方形蒲团，高光深棕色大理石地面清晰倒映出蓝色药师佛身影，8K超清渲染
