prompt_zh: 高端中式佛堂室内石材装修设计效果图，地面满铺高光镜面翠绿色奢石大理石大板，倒映清晰，正前方红木佛龛内供奉三尊金身坐佛，背后是海棠形发光金色《般若波罗蜜多心经》浮雕背景墙，两侧刻有“三宝常护念、六时恒吉祥”金色对联，前方并列三张中式雕花供桌与三个黄色圆蒲团，两侧立落地圆宫灯，右侧白墙悬挂巨幅重彩佛教说法图壁画，左侧设红木屏风，顶部红木方格藻井吊顶，富丽庄严，8K建筑渲染
