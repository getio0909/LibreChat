ai_design_usage: 适用场景：现代新中式三世佛佛堂正面立面设计 / 汉白玉佛像与米黄莱姆石须弥座搭配参考 / 现代金属网格艺术吊顶与传统石雕融合设计；推荐搭配：汉白玉三世佛坐像 + 葡萄牙米黄莱姆石浮雕须弥座与壁龛 + 灰白石雕海浪纹背景板
  + 拉丝黄铜立体网格艺术吊顶 + 深紫褐暗纹石材地面
prompt_zh: 现代新中式三世佛展厅正面场景，严格对称构图，中央长条形米黄色石材雕花须弥座上并列供奉三尊洁白的汉白玉结跏趺坐佛像（释迦牟尼佛、药师佛、阿弥陀佛），每尊佛像背后为带回纹边框的圆拱形暖白发光壁龛；两侧对称矗立米黄色石材方柱，黑色柱础向上投射洗墙灯光，柱旁镶嵌灰色海浪纹浮雕石板与圆形鎏金瑞兽铜盘；天花为原木发光格栅，并悬挂两组极具现代艺术感的多层立体交错金色金属网格吊饰，深紫褐色哑光石材地面，禅意高雅，8K超高清室内设计效果图。
