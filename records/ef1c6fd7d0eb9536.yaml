prompt_zh: 传统佛教寺庙大雄宝殿正面中轴对称全景，深灰黑色高光石砖地面，前景正中设红木雕花大供桌与三个米黄色方形拜垫，后方高大的深棕色木雕须弥座主坛上并列供奉三尊巨型铜鎏金三世佛坐像（配镂空火焰大背光）及阿难迦叶两尊弟子立像，主坛左右两侧跨间内对称供奉骑青狮的文殊菩萨与骑白象的普贤菩萨金像，两侧矗立包镶鎏金云纹铜箍的深色实木圆柱，东西两壁镶嵌传统重彩佛教壁画，顶部为九宫格木藻井天花，正中央镶嵌一座圆形蓝底金星贴金斗拱大藻井，恢弘庄严，8K建筑渲染
