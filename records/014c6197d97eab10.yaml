prompt_zh: 大型佛教文化景区中轴线建筑群全景规划效果图，宏伟对称构图，远景翠绿山巅矗立一尊巨型露天金身释迦牟尼佛坐像，大佛前方为巨型米白色石材阶梯金字塔式地宫建筑，地宫顶部中央设白色覆钵式佛塔、四角立小型方塔，底部为三拱门殿堂与金色万佛长廊，前景为宽阔的花岗岩拼花朝圣广场，两侧对称耸立三层唐风重檐楼阁与大型石雕四大天王护法像，蓝天白云，气势磅礴，8K建筑景观渲染。
