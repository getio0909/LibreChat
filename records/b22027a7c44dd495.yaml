prompt_zh: 庄严的佛教寺庙主殿四方佛陈设场景，中轴对称构图，前景上方为传统实木梁架与雕花雀替门罩，内部设一座通长的米黄色石雕束腰仰覆莲须弥座佛坛，并列供奉四尊金身坐佛，背后是漫天暖红金色祥云高浮雕背景墙，正中央镶嵌一圈洁白的汉白玉圆环与金色浮雕圆盘，佛坛左右两侧折面墙绘有绚丽的彩绘飞天菩萨壁画，佛坛前摆放两张木雕供桌与三盏白石底座鎏金镂空圆柱形落地灯，高光灰褐大理石地面配圆形拼花，8K建筑渲染
