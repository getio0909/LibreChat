ai_design_usage: 藏传佛教密坛/精舍华丽转角佛龛定制参考、贴金重彩木雕纹样与藏式供器陈设细节
prompt_zh: 藏传佛教华丽重檐贴金彩绘转角佛龛与多层供桌陈设细节特写，竖幅构图，佛龛采用繁复精湛的金漆木雕工艺，色彩以辉煌金、朱砂红与宝蓝色为主，上部为重檐金顶与雕花盘龙柱佛龛，内供奉多尊铜鎏金密宗佛像；中部三层阶梯供台上铺黄色织锦，密集陈列纯金酥油灯、曼扎盘、八吉祥法器与七政宝供具；下部为精雕瑞兽莲花纹彩绘须弥座底柜，极尽庄严华贵，8K宗教艺术写实摄影
