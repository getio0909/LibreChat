prompt_zh: 传统佛教寺庙大殿内部陈设右前斜向透视场景，深红棕色高光实木地板，前景右侧矗立一根粗壮的红木大圆柱，清晰展示柱脚包镶的精美鎏金仰覆莲瓣束腰铜箍与下方的青石八角双层莲花柱础，中景横亘着宏伟的五开间重檐红木透雕天宫楼阁式大佛龛，飞檐斗拱贴金雕花，龛前设镶嵌鎏金荷花浮雕的木雕护栏，整齐排列五张红木雕花供桌（陈列香炉、红烛与供果）及五对米黄色方形拜垫，左右两侧远端墙面内嵌暗红色发光千佛墙，顶部为传统方格木藻井，8K建筑效果图
