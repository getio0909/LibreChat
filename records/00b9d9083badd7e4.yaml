prompt_zh: 展厅正面全景实景摄影，一套殿堂级全配置藏传佛教高僧大法座与经案装置，金棕色实木重彩描金雕刻，后方高耸背光顶雕朱红金翅大鹏鸟并披挂橙黄花环，两侧精雕天女、摩羯鱼、骑马护法与雪狮，背光中心嵌大型彩色莲花曼陀罗圆盘，中部经案雕刻双鹿法轮，下部须弥座深浮雕两尊立体白雪狮与十字金刚杵，左侧配双宝马浮雕高脚侍从台，右侧配四级实木登座台阶，顶部轨道射灯聚焦，8K超高清。
