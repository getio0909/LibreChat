summary_zh: 展厅正面全景实拍的一套寺院大殿级全配置藏传佛教高僧大法座装置（Full-Scale Monastic Dharma Throne Ensemble with Side Pulpit and Stairs）。相比第 26
  项，本套装置不仅尺幅更高、雕工更立体饱满，而且完整包含了中央主法座与经案、左侧高脚侍从经台（配S形双龙戏莲腿）、右侧四级实木登座扶手木梯，是极其难得的完整法台工程实物范本。
