prompt_zh: 新中式大型佛教禅修讲堂与后殿功德堂二进式复合空间全景设计，深远的中轴对称一点透视构图，前景两侧耸立粗壮的暖色原木大圆柱，底部包镶鎏金回纹铜圈并立于浅灰汉白玉覆盆柱础上，顶部为极具韵律感的三跨弧形拱顶木条格栅天花配传统斗拱，左右两翼高墙镶嵌巨幅发光水墨罗汉与山水国画，深灰黑色青石板地面中央整齐排列多排新中式实木抄经长矮桌与白色方形坐垫，远端后殿正中悬挂巨幅暖金色佛教壁画，两侧对称排布通高发光木质祈福牌位架，禅意庄严，8K超高清渲染。
