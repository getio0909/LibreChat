prompt_zh: 8k超高清大型佛教文化旅游景区与森林寺院建筑群鸟瞰规划效果图，高空中轴对称视角，前景清澈湖泊中央是一座由白玉石桥连接的巨型纯白汉白玉八瓣盛开莲花岛，岛心耸立一座金光闪耀的金色莲花佛像坛城，跨过滨水林荫大道与停车场，中景是气势恢宏的多进院落式传统灰瓦木构寺院建筑群，包含弧形回廊广场、山门、钟鼓楼、重檐大雄宝殿，右上方耸立一座七层八角古塔，后方山林间分布着整齐的塔林，四周青山绿水环绕，大师级规划渲染。
