prompt_zh: 恢弘的佛教寺庙万佛护法大殿正面中轴对称全景，深青灰色仿古青石板地面，中轴线上方悬挂两盏巨型双层红金圆形宫灯阵列吊灯，远端正中主坛供奉铜鎏金释迦牟尼坐佛，背后是极其夺目的双圈圆形金色太阳放射状万丈佛光背板，两侧分立胁侍菩萨与发光重彩佛教壁画，大殿左右两壁通顶满布红底发光小格万佛墙，两壁下方均筑有洁白的汉白玉精雕束腰须弥座长台基，每侧各嵌入五个金色火焰大龛，对称供奉十尊威武高大的铜鎏金护法天王金刚立像，顶部为弧形木椽轩顶与多层贴金斗拱，8K超清渲染
