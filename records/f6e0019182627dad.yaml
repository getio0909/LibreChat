prompt_zh: 传统东亚日式佛教寺院大雄宝殿室内场景，超宽画幅电影感中轴对称构图，幽暗深邃的大殿内耸立四根高光黑漆巨型木柱，正中央高台鎏金须弥座上供奉一尊巨大的纯金坐佛，背后为繁复精美的舟形金色雕花大背光，佛像上方悬挑日式唐破风弧形木质天盖，两侧垂挂华丽的金色镂空金属幢幡，佛坛前方左右对称矗立两座灰白色大理石雕刻的传统石灯笼，地面铺设榻榻米与中央暗红地毯并反射璀璨金光，戏剧性聚光照明，8K史诗级建筑摄影
