prompt_zh: “莊嚴寶刹”新中式佛教石材展位正面中轴对称3D渲染效果图，纯灰渐变背景，建筑采用传统大殿三段式飞檐挑顶结构：中央为三层阶梯抬升的深木色井字梁嵌金色莲花透光石藻井，顶部冠以“莊嚴寶刹”书法立体字与红印；左右两翼对称延伸弧形白色格栅卷棚轩顶，两端立柱悬挂仿古六角宫灯；内部后墙为暖黄色透光玉石方格拼花墙，两侧内墙为三层蓝色背光千佛陈列灯箱；外围由U型敦煌金石雕须弥座与汉白玉栏杆半围合，正中设置大型石雕莲花供坛与贴金彩绘伽蓝菩萨坐像，地面铺设黑白金几何棋盘格大理石，一点透视构图，3D
  Max V-Ray超写实渲染，8K分辨率。
