prompt_zh: 传统佛教寺庙孔雀明王殿室内完整全景，正面中轴对称纵深构图，高光暖红棕色几何拼花实木地板，前景与中景对称耸立多对粗壮的深色方形木柱，柱身正面镶嵌古铜鎏金盘龙浮雕长板，下承高大的汉白玉精雕方形莲花须弥座柱础，中轴远端为金碧辉煌的唐破风贴金斗拱佛龛，供奉骑孔雀的四臂孔雀明王彩绘金像，龛前设红木供桌与三个彩绘圆蒲团，两侧窗下对称陈设红木条案与汉白玉圆璧摆件，顶部中央天花绘有白底敦煌飞天散花彩绘壁画，两侧为弧形竹木格栅吊顶与雕龙梁架，8K建筑渲染
