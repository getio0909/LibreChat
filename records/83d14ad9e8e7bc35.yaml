prompt_zh: 传统佛教寺庙大雄宝殿佛像陈列场景，左前斜向广角透视，深棕色木雕须弥座主坛上并列供奉三尊巨型铜鎏金三世佛坐像（带镂空火焰背光）与两尊弟子立像，佛像背后竖立一道高大洁白的鱼肚白天然大理石背景屏风墙，将金色佛像衬托得格外醒目，佛坛前并列摆放三张红木雕花供桌与三对米黄色方形拜垫，左侧可见骑白象的普贤菩萨金像与后方发光千佛墙，四周立有包镶鎏金云纹铜箍的深色木柱，顶部为九宫格木藻井与中央圆形蓝底金星斗拱大藻井，8K建筑渲染
