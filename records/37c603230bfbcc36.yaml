prompt_zh: 展厅实景摄影，一套庄严精美的藏传佛教木雕彩绘高僧讲经法座与供桌组合，温暖红棕色核桃实木打造，后方高耸弧形背光精雕六拏具（顶部摩尼宝、中央金翅大鹏鸟咬蛇、两侧龙女与摩羯鱼），前方长方形经桌正面高浮雕双青龙拱护粉色盛开莲花，上沿饰彩色莲瓣与金色金刚杵，下方须弥座束腰雕刻两尊护法力士托举座台与中央十字金刚杵，左侧配弧形满雕卷草花鸟扶手屏，8K超高清细节。
