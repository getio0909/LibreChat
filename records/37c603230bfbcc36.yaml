summary_zh: 展厅实景拍摄的一套标准藏传佛教高僧/活佛讲经说法全套木雕彩绘法座、经桌与须弥座踏跺组合（Tibetan Buddhist Dharma Throne & Sutra Reading Desk Set）。整套装置由后方高耸的六拏具背光宝座、中部双龙护莲长方经桌（供桌）、下部力士金刚杵须弥座基台以及左侧弧形斜坡卷草雕花护栏（踏步扶手）四部分组成。
