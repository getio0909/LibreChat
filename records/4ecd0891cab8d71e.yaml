prompt_zh: 现代佛教寺院室内艺术长廊设计，竖幅一点透视对称构图，顶部为传统人字形露明实木梁架坡屋顶，木梁之间内嵌温暖柔和的白色发光软膜天棚，左右两侧墙面以实木立柱分格，对称镶嵌精美的中国传统工笔重彩佛教菩萨壁画，地面铺设哑光青灰色石板砖，走廊尽头为一扇极简浅木色双开禅门，光影静谧神圣，8K室内建筑渲染
