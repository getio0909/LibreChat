prompt_zh: 现代极简清水混凝土大佛殿近景仰拍构图，顶部黑色弧形混凝土拱梁框景下，一尊巨大的灰白色花岗岩石雕坐佛端坐于深灰色石雕莲花宝座之上，头部隐于上方露天光洞的强烈天光之中，宽厚胸膛与流畅衣褶泛着神圣高光，莲座前方黑色石质供台两侧对称插满鲜艳的红黄双色花束，下方为十级深灰花岗岩台阶，前景光滑混凝土地面上摆放一张天然金色干草编织并撒满白色花瓣的禅意艺术地席，冷峻工业材质与温暖自然植物对比，8K建筑摄影
