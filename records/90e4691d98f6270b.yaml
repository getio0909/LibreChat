prompt_zh: 超高清现代简约新中式禅意卧室与茶室一体化室内设计，横幅正面广角构图，左侧会客茶区正对一面素白墙，墙上悬挂大幅圆形水墨远山意境挂画，下方设中式条案、实木罗汉床沙发、方形实木茶几与禅椅，茶几上摆放白瓷茶具与禅意插花；最左侧为半通透竖向木格栅推拉门；右侧睡眠区摆放胡桃木框架大床与床尾凳，床头对称布置木格栅与暖光台灯；浅灰色哑光石材地砖，无主灯暗藏暖光灯带吊顶，宁静空灵，8K室内效果图
