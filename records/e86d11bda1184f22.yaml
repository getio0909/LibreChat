prompt_zh: 传统佛教寺庙大殿内部五开间重檐木雕大佛龛左前斜视近景，深红棕色高光实木地板，画面左侧至中央为高耸宏伟的五开间重檐红木透雕天宫楼阁式大佛龛，飞檐斗拱层层挑出，饰有精湛的贴金双龙戏珠额枋、毗卢帽花罩与镶嵌鎏金荷花浮雕的木雕护栏，龛前并列摆放五张红木雕花供桌与五对米色方形拜垫，画面右侧矗立两根粗壮的红木大圆柱（柱脚包镶鎏金仰覆莲瓣束腰铜箍并立于青石双层莲花柱础之上），远端右侧墙面内嵌暗红色发光千佛墙，顶部为传统方格木藻井，8K建筑渲染
