ai_design_usage: 佛像主尊与汉译南传《吉祥经》书法浮雕背景墙一体化设计、铜鎏金造像法相与背光雕刻参考
prompt_zh: 铜鎏金释迦牟尼佛禅定坐像与《吉祥经》浮雕背景墙正面特写，高分竖幅中轴对称构图，主尊释迦牟尼佛螺发肉髻，面容慈悲安详，身披通肩袈裟，双手结禅定印，端坐于多层鎏金莲花宝座上，身后矗立精美的舟形双层镂空火焰卷草纹黄金大背光；后方暖赭红色背景墙上整齐排列竖向繁体金色高浮雕《吉祥经》汉字经文（清晰可见“住适宜处、往昔有德行、置身于正道、是为最吉祥”等金字）；前景正中摆放铜鎏金香炉，两侧点缀盛开的粉白荷花与翠绿荷叶，金碧辉煌，庄严吉祥，8K超清写实摄影
