summary_zh: 铜鎏金释迦牟尼禅定坐像配双层镂空火焰纹大背光，背衬竖排繁体金色高浮雕汉译《吉祥经》全文赭红背景墙，前景陈设铜鎏金香炉与盛开粉白荷花。
