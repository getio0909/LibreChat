prompt_zh: 正向严格对称的药师佛主题展览大殿室内设计，视觉中心是一座由蓝色发光灯带勾勒的巨型佛龛，内供奉一尊晶莹剔透的宝蓝色古法琉璃药师佛坐像，下方为石雕莲花宝座，佛龛前设有深色木雕护栏与供桌，桌上摆放五盏散发温暖黄光的莲花供灯，左右两侧对称分布着护法天王立像龛与密布的幽蓝色发光万佛格，深灰石材地面，神秘庄严，8k渲染图。
