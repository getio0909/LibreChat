prompt_zh: 新中式佛教书画艺术展厅入口大门内立面设计，严谨的中轴对称单点透视构图，正中央为三开间六扇暖色原木大门，上半部为细密竖向木格栅透光窗，腰部镶嵌六个方形黄铜拉手，大门两侧对称矗立粗壮的原木大圆柱，柱脚包镶鎏金回纹铜套并立于浅灰汉白玉覆盆柱础上，左右两翼展墙内嵌四幅发光宣纸灯箱展示传统水墨山水画与高僧人物画，顶部为传统木斗拱与弧形木条格栅吊顶，地面满铺深灰黑色仿古青石方砖，两侧对称摆放新中式实木长凳，古朴典雅，8K渲染。
