prompt_zh: 传统佛教寺庙大雄宝殿室内左前斜向广角场景，地面满铺深灰黑色高光镜面石材地砖，前景耸立粗壮的原木色大圆柱（柱脚包镶鎏金莲瓣铜箍并承以汉白玉多层柱础），正前方深色木雕须弥座长坛上并列供奉五尊巨型铜鎏金佛菩萨像（三世佛与文殊普贤，带镂空金背光），每尊造像背后均设有一扇洁白的石材雕花海棠框发光背景板，佛坛前设木雕供桌与拜垫，右侧墙面为通长的木雕壁龛长廊供奉铜鎏金十八罗汉坐像，顶部为九宫格发光木天花与中央八角重檐贴金斗拱大藻井，8K建筑渲染
