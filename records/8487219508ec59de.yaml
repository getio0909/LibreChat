prompt_zh: 现代极简禅意佛教寺庙室内万佛与佛像展示空间，正面中轴对称广角全景，高光暖灰褐色大理石地面倒影清晰，空间顶部为一座宏伟的八角形白色叠涩斗拱格栅发光穹顶藻井，藻井正中心镶嵌一朵巨大的双层立体白色莲花浮雕透光天窗，正前方浅色墙面开启三座白色石材雕花拱形大佛龛：中央主龛供奉铜鎏金一佛二菩萨像（配金色火焰背光），左右两龛各供奉一尊金身坐佛并衬以淡雅的青绿山水云海背景壁画，左右两侧斜墙满铺纯白色极简方格发光万佛墙，空灵圣洁，现代建筑美学，8K渲染
