prompt_zh: 大型佛教八角观音宝殿室内竖幅正面全景效果图，中轴对称构图，高大的米黄色大理石八角须弥座与双层石雕仰覆莲花宝座之上，端坐一尊洁白无瑕的巨型汉白玉观音菩萨石雕像，头戴精美宝冠，神态慈悲庄严；佛坛正前方设深色红木雕花供桌，摆放铜香炉、烛台与水果供品；背景四周高墙为通顶发光的金色万佛墙小佛龛，顶部悬覆一座宏伟的八角形千瓣金莲花发光穹顶藻井，高光浅米色大理石地面，神圣崇高，8K竖构图建筑渲染
