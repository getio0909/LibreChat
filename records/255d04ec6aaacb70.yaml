  + 莲花几何图腾生态景观步道
prompt_zh: 超大型山地佛教文化旅游园区总体规划高空鸟瞰效果图，云雾缭绕的翠绿群山与湖泊之间，沿山势中轴线依次布局：前区为传统中式青瓦寺院山门与大殿院落；中区为宏伟的米黄色石材阶梯金字塔形金刚宝座塔大殿；山腰平台耸立一尊巨型露天金身结跏趺坐大佛，大佛下方山体开凿弧形摩崖石窟造像壁、阿育王柱与八瓣莲花喷泉广场；后方山坡顺势建造扇形梯田剧场与巨大的五叶莲花瓣形生态佛教塔林陵园（节点处矗立六座金顶白塔）；右侧湖心有一座纯白石材建造的水上圆形多塔坛城岛，白鸽飞翔，气势恢宏，8K超高清建筑规划渲染。
