prompt_zh: 传统佛教寺庙大雄宝殿室内斜向广角场景，前景为宽阔的深灰黑色高光石材地砖地面，右侧高大的深棕色木雕须弥座佛坛上并列供奉三尊巨型铜鎏金三世佛坐像（带镂空火焰纹大背光）及两尊胁侍弟子金像，佛坛前设红木供桌与黄色拜垫，四周矗立包镶鎏金云纹铜箍的深色实木大圆柱，远端墙面镶嵌彩色佛教壁画，顶部为壮观的木构九宫格藻井天花，正中央设一座圆形蓝底金星贴金斗拱大藻井，庄严肃穆，建筑渲染效果图
