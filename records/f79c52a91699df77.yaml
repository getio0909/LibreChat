prompt_zh: 新中式佛教艺术展厅墙面特写，天然“佛国画卷”敦煌金奢石大理石背景墙，镜像对称对纹拼接，石材天然纹理在中央接缝处自然形成一座庄严的深紫色佛塔剪影，周围环绕璀璨的琥珀金、古铜金与流云白矿物脉络，高光抛光镜面质感，四周镶嵌精细雕刻的莲花瓣实木边框，底部为深胡桃木中式回纹护墙板，顶部米白色墙面安装黑色立体书法字“佛國畫卷”，博物馆级洗墙射灯照明，8K超高清建筑室内实景摄影。
