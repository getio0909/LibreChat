prompt_zh: 传统中式木构佛教大殿内部空间设计，正中汉白玉雕花须弥座台基上设木雕佛龛，供奉一佛二弟子金像，主尊背后是一轮巨大的金色圆形放射状法轮透光浮雕背光，前方摆放深色实木供桌、两个黄色圆蒲团与落地木宫灯，左右两侧为通顶木作发光万佛墙，万佛墙前对称挑出四个汉白玉束腰雕花须弥座平台，上面站立四尊威武的木雕四大天王护法像，顶部为弧形木格栅拱顶并悬挂大型环形中式宫灯，深灰色青石板地面，8K建筑渲染
