prompt_zh: 中国传统佛教石材浅浮雕神话瑞兽纹样局部特写，圆形团花构图，米灰白色大理石基底，左侧雕刻一尊身姿矫健、回首咆哮的青蓝灰色瑞兽（狻猊或麒麟），怒目圆睁、鬃毛飞扬、四爪有力；瑞兽四周环绕放射状翻涌的波涛水浪纹与朵朵饱满的如意祥云纹，最外缘饰有一圈精细的白色仰莲花瓣边框，阴刻线条流畅苍劲，浅浮雕层次细腻，传统古建石雕工艺细节，高清写实。
