prompt_zh: 中国传统佛教寺院石材雕刻工艺细节微距摄影，一块镶嵌在海棠形开光边框内的深青黑色青石浮雕构件，上半部分以精湛的多层高浮雕工艺雕刻出立体饱满、盘旋升腾的如意祥云纹，下半部分雕刻出线条细密、波涛翻滚的海水江崖纹，石材表面质感温润古朴，刀法苍劲清晰，一束温暖的金色夕阳斜射在青石板上，投下古建筑飞檐翘角的斜向阴影，光影质感极佳，微距特写。
