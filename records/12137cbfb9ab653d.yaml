prompt_zh: 奢华中式木作佛教艺术室内展览与供奉空间，右侧礼佛区由两根雕刻深浮雕缠枝花卉纹的方形实木大柱框定，柱下承白石柱础，内部设一座金顶重檐木雕大佛龛，供奉彩绘背光菩萨坐像，前设三个圆形蒲团，左侧木墙中央嵌有外方内圆的背光木雕壁饰，中心陈列一枚洁白温润的白玉璧摆件，下方摆放中式卷书式条案，两侧对称立两盏高挑的鎏金镂空圆柱形落地灯，几何拼花实木地板，弧形木梁吊顶，8K室内效果图
