prompt_zh: 大型佛教寺庙双层挑空大殿建筑剖面透视全景图，黑色背景衬托室内立体结构，正中央多层青绿彩绘石雕莲花须弥座上供奉一尊跨两层通高的巨型古铜鎏金释迦牟尼佛坐像（带镂空火焰大背光），两侧分立胁侍菩萨立像，一层深灰黑色镜面石材地面，底层左右两侧剖面可见室内楼梯与白色发光千佛龛小室，二层为挑空木结构回廊与木雕栏杆，二层两侧高墙悬挂巨幅中国传统青绿重彩佛教经变图壁画，顶部为挑高坡屋顶密集露明木椽与斗拱结构，宏伟史诗感，8K超高清建筑渲染
