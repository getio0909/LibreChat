prompt_zh: 室内建筑竖幅一点透视摄影，一条极具现代禅意与藏传美学融合的室内走廊，尽头是一扇华丽的藏式朱红色装饰木门，门扇上方正中镶嵌圆形金色宝瓶八吉祥浮雕徽章，门扇下方三分之一处高浮雕五彩祥云、金色须弥山峰与翠绿海水江崖纹，门头上方挑出藏式彩绘方椽斗拱檐口，走廊两侧为浅暖色实木护墙板，竖向镶嵌隐藏式暖光线性灯带，并对称悬挂两盏精致的紫铜藏式壁灯，深色木地板铺设棕色地毯，光影静谧神圣，8K超高清。
