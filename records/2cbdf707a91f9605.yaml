prompt_zh: 富有石窟艺术美感的佛教主题石材展览空间设计，正中央是一面采用青灰色自然面粗犷毛石砌筑的高大背景墙，墙面上呈山形阶梯状错落开凿出数十个白色内壁的发光拱形石窟佛龛，内部供奉大小不一的金色坐佛，主墙两侧对称竖立米白色石雕圆柱灯柱，高光浅灰色纹理大理石地面正中镶嵌一幅精致的黑白灰圆形莲花曼荼罗水刀拼花，左侧门洞内可见一面米黄色透光石材镌刻的竖排佛经书法墙，右侧透出金色万佛格，8k效果图。
