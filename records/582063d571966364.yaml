summary_zh: 本图展示了2025年秋季佛事展“庄严宝刹（Alitan Stone）”展位核心殿堂区的低角度仰视实景。空间采用现代新中式殿堂化展陈手法，将传统大雄宝殿的“藻井、背光墙、须弥坛、护栏、拜垫/禅椅”转化为模块化全石材装配空间，营造出恢弘崇高、金碧辉煌的礼佛与商业洽谈双重气场。
