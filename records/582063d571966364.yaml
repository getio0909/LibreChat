prompt_zh: 庄严宝刹佛教主题奢石展厅内景，低角度竖幅仰拍，顶部为阶梯式深胡桃木井字格栅藻井天花，内嵌背光天然金镶玉透光云石板并饰有金色宝相莲花团花纹，门头悬挂“莊嚴寶刹”冰蓝色立体发光字；高挑背景墙采用暖金琥珀纹金镶玉大理石大板竖向黑钛分缝拼接，墙前敦煌金浮雕须弥座与汉白玉微缩栏杆上供奉三尊青绿镂空背光彩绘佛菩萨立像；前景中央为厚重饱满的双层莲花瓣玉石雕刻供坛，供奉金甲黄袍伽蓝菩萨坐像与鲜花果品，地面为金镶玉与黑色大理石几何棋盘格高光拼花，左下角摆放新中式实木圈椅，光影庄严神圣，8K建筑摄影实景质感。
