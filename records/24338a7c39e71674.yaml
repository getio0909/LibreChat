prompt_zh: 室内软装端景竖幅摄影，一组精美的藏式木雕双门供柜与大型双龙耳木雕花器组合，下方为温暖琥珀色核桃木双抽双门供柜，两侧为金漆叠涩立柱，两扇柜门高浮雕对称蹲坐于莲台之上的白身绿鬃藏式瑞狮与彩色祥云，柜顶正中摆放一座金色双龙耳斗式木雕大花器，斗腹雕双狮护法轮，花器内插满盛开的粉色与白色玫瑰花束，背景为深胡桃木雕花护墙板，8K超清实拍。
