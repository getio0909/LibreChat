prompt_zh: 传统中式木构寺院大殿室内侧向透视空间，高大的栗棕色实木圆柱挺拔耸立，柱脚包裹一圈精美的鎏金立体莲花瓣铜箍，下承青石莲瓣鼓形柱础，柱间上方连接雕花额枋与雀替，右侧深黑棕色方格石砖地面上排列一列黄底红边方形蒲团，远景木墙长条发光壁龛内整齐供奉金身十八罗汉像，左侧为中式木格栅隔扇门，顶部是金碧辉煌的方格贴金藻井天花，古朴庄严，8K建筑渲染
