prompt_zh: 极尽奢华庄严的佛教石材展览大殿室内设计，左侧核心区供奉一尊金光闪耀的释迦牟尼佛坐像，下方为精雕细琢的青黑石多层深浮雕须弥座，佛像背后是一轮光芒四射的圆形放射状火焰金背光，两侧矗立带鎏金盘龙柱础的汉白玉八角柱，右侧前景是一座室内七宝莲花池，盛开着荷花并横跨洁白的汉白玉精雕卷云纹拱桥与石栏杆，背景高墙布满暖金发光万佛小龛与中式木构门楼，黑金花镜面大理石地面，8k超高清效果图。
