prompt_zh: 展览展示工程CAD彩色立面施工图，“A立面图”，新中式佛教石材展位东侧主入口正立面设计，暖米白色木结构门头（CMYK色值C13 M9 Y19 K0），传统中式几何折角叠级线条装饰，右侧设1200mm宽品牌形象柱带“莊嚴寶刹
  寺院装饰石材”背发光书法字与红印章，左侧为6580mm宽大跨度无柱敞开入口，内部透视可见“天然美石·佛國畫卷”奢石背景墙、佛龛供桌与中式茶室洽谈区，四周带有精确的红色尺寸标注线（总高5000mm，总宽10000mm），白底专业工程图纸风格。
