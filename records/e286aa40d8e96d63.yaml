prompt_zh: 近景微距艺术品摄影，一座精美的藏传佛教“和气四瑞图”圆形实木深浮雕彩绘座屏摆件，圆形外框雕刻一圈红、绿、黄三色交替的立体莲瓣宝珠，圆盘内部多层镂空深浮雕一头粉耳象牙白大象，象背骑着金色猕猴，猴肩立白兔，兔顶展翅翠鸟，背景为结满粉红果实的绿叶古树与金色镂空祥云，下方承接描金卷云木雕底座，古朴矿物彩绘包浆质感，8K超高清。
