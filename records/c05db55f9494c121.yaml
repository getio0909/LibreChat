summary_zh: 本图为传统佛教寺院经堂、藏经回廊或万佛殿侧翼的纵深长廊空间竖幅场景。空间将传统宫殿式重木结构（红木巨柱、汉白玉覆盆柱础、贴金镂空雀替）与充满浪漫宗教想象的“星空天窗”及“发光万佛长墙”相结合，营造出步入浩瀚佛国星海般的深邃礼佛长廊体验。
  空间呈现浓郁的“深红棕木作 + 暖金万佛灯光 + 璀璨宝蓝星云 + 墨绿灰高光大理石”四色交响。左侧序列方柱与远端隔扇采用深红棕色菠萝格/老红木，底部承托洁白温润的汉白玉三层叠涩覆莲须弥柱础；右侧万佛墙下部护墙底座采用深色金属/古铜木雕，凸显一排暖光打亮的立体仰莲瓣浮雕带；地面…
