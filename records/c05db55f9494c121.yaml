ai_design_usage: 适用场景：传统寺院经堂/万佛回廊纵深空间设计 / 木格栅银河星空发光天窗植入参考 / 发光万佛墙下部立体仰莲瓣洗墙灯带设计；推荐搭配：深红木方柱配汉白玉覆盆式多层莲瓣柱础 + 贴金镂空木雕大雀替 + 矩阵背光万佛格龛配底部立体莲瓣灯带
  + 木格栅星空软膜天花 + 深灰绿高光大理石地面
prompt_zh: 中国传统佛教寺院经堂室内纵深回廊空间，竖幅单点透视构图，左侧依次排列粗壮的深红木方柱，柱底承托洁白的汉白玉多层覆盆莲花须弥柱础，横梁交接处饰有精美的贴金镂空木雕雀替；右侧整面长墙上部为矩阵式排列的暖黄色发光万佛小格龛，下部为深木色雕花须弥座，并内嵌一整排由暖光打亮的立体仰莲花瓣浮雕灯带；顶部天花镶嵌田字格与多格木框天窗，天窗内呈现深邃璀璨的蓝色银河星云夜空画面；地面铺设高光深灰绿色云纹大理石，倒映出万佛金光与白玉柱础，神秘庄严，高清建筑效果图。
