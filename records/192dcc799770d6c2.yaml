prompt_zh: 微距特写镜头，低角度斜拍一座“敦煌金”天然黄玉石精雕的佛教须弥座供桌正面局部，近距离展示极致精湛的中国传统石雕高浮雕刀工：顶部如意卷草纹，上层肥厚立体的双层仰莲花瓣，中间束腰在回纹边框内深浮雕净瓶（宝瓶）与盛开的缠枝牡丹花，下层立体覆莲花瓣，底部几何回纹基座，天然黄玉石呈现温润通透的蜜蜡油脂光泽与天然红棕色矿物脉络，台面上摆放着鲜花与绿色玻璃矿泉水瓶，浅景深效果，8K超高清文物级细节摄影。
