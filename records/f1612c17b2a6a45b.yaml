prompt_zh: 博物馆收藏的9世纪萨马拉斜削风格（Beveled Style）古老木雕装饰板正视特写，固定在暖米色亚麻布背景上；竖向长方形木板内雕刻中轴对称的抽象流线型卷草与水滴宝瓶纹样，上下两端为饱满圆润的双涡卷如意头并嵌有圆珠，采用平滑过渡的斜面立体刀法，古老棕黄色硬木表面布满真实的纵向木纹管孔与岁月风化裂痕，柔和棚拍光影。
