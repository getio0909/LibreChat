summary_zh: 陈设于现代展厅轨道射灯下的一座殿堂级藏传佛教“十一佛冠顶”三联多宝格大佛龛展柜。整座佛柜以藏传寺院大经堂建筑立面为蓝本，将飞檐斗拱、转经筒排、双鹿法轮、火焰拱门（巴卡拱）与下层储物供柜融为一体，体量宏伟，雕工极尽繁复。
