prompt_zh: 展厅正面实景摄影，一座宏伟的藏传佛教十一佛冠顶三联木雕彩绘大佛龛展柜，顶部一字排开十一尊浮雕佛像，正中门楣饰鎏金八辐法轮与双鹿卧像，下方为多层藏式彩绘斗拱飞檐，中部由中央大型火焰拱门主龛与两侧十四个小型火焰拱形博古龛组成，腰线与底部九门九抽储物柜满雕绿松石青绿与朱红描金卷草瑞兽图案，顶部轨道射灯照明，8K高清。
