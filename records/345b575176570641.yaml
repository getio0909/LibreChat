prompt_zh: 室内广角实景摄影，一座气势恢宏的藏传佛教五开间双层红木贴金大佛龛满堂供奉场景，深紫红色实木柜体满雕璀璨真金斗拱飞檐与火焰拱门，上下两层十个佛龛内供奉黑铜与鎏金佛像，龛内散发出神秘的柔和冰蓝背光，供台台面整齐陈列十六座圆形木雕彩绘八吉祥供牌、金色朵玛塔、绿松石曼扎盘与一排净水供碗，两侧配鲜花与金曼扎，下方十二扇柜门高浮雕金色瑞兽，正前方中轴线设一座独立雕花小供柜与蓝色回纹礼拜毯，8K超高清佛堂实景。
