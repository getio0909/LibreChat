prompt_zh: 博物馆暗场聚光灯下的中国古代石刻文殊菩萨骑狮坐像特写，黄褐色砂岩雕刻材质，微仰视半侧面构图，菩萨头戴繁复精美的花冠，面容丰满圆润、慈悲含笑，身后有舟形石雕头光，右手当胸持物，左手轻按膝上经卷，结跏趺坐于仰莲宝座之上；莲座下方雕刻一尊张口咆哮、怒目圆睁、鬃毛卷曲的威猛雄狮；纯黑深邃背景，一束温暖的聚光灯光束自左上方打亮菩萨面部与上身，明暗对比强烈，质感古朴苍劲，博物馆文物摄影。
