summary_zh: 本图为一件供奉或展陈于博物馆暗场环境中的古代风格石刻（黄褐砂岩/青石）“文殊菩萨骑狮坐像”单体写实摄影。造像兼具唐宋石窟造像的饱满气韵与民间石雕的浑厚刀法，通过右下角威猛咆哮的瑞狮底座明确表征大智文殊师利菩萨身份。 造像采用质地古朴粗砺的暖黄褐色红砂岩（或风化青砂石）整料圆雕而成，表面保留天然石材的细微砂粒感与岁月包浆；背景为完全消光的纯黑暗场，一束约
  2700K 的高显指暖黄聚光灯自左上方精准投射于菩萨面庞与胸腹，形成柔美而富有体积感的伦勃朗式雕塑光影。
