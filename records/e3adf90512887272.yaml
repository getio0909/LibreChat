prompt_zh: 传统中国佛教寺院大殿前局部写实场景，中近景特写一尊高大威严的汉白玉雕刻石狮，螺发卷曲、张口含珠、爪抚幼狮，坐落于雕花须弥座上，石狮后方为青白石镂空雕刻卍字纹护栏，背景为传统大殿高大的朱红色与深褐色木圆柱、沥粉贴金彩画额枋以及细密的木质方格隔扇门窗，明媚斜射阳光投下清晰光影，古朴庄严，写实摄影质感。
