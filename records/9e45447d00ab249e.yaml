prompt_zh: 新中式石材展厅奢石背景墙左侧局部特写，米白色墙面上方安装黑色立体书法字“天然美石 ·”及黑色轨道射灯与长臂洗墙灯，核心区域镶嵌镜像对称拼接的“佛国画卷”敦煌金天然奢石大板，浓烈的金黄色、琥珀色与深紫黑色天然纹理交织成对称佛塔图案，高光镜面石材表面清晰反射出远处暖黄色的阶梯折角灯带光影，四周采用100mm宽雕花莲瓣实木线条包边，底部为深胡桃木中式回纹护墙板，8K室内实景摄影。
