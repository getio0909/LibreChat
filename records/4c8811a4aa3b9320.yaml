prompt_zh: 老挝琅勃拉邦传统佛教寺庙大殿门廊室内外过渡场景，从幽暗的大殿内部向外拍摄敞开的双扇金色高浮雕木门，木门上精雕头戴尖冠的东南亚护法天神与卷草瑞兽纹，门框与门外高大的方形廊柱均涂刷黑漆并绘有密集的金色菱形几何与佛塔模板画纹样，上方可见传统红木屋架，阳光照亮门外光滑的灰白色石地面，强烈的明暗光影对比，纪实建筑摄影。
