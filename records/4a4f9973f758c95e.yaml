prompt_zh: 传统佛教寺庙菩萨配殿室内场景，正面中轴对称构图，深灰黑色高光石材地砖地面，前景左右矗立两根深棕色实木大圆柱，柱身上下两端包镶华丽的鎏金镂空如意云纹铜套筒，下承洁白的汉白玉雕花覆莲柱础，柱间正中设深色木雕须弥座佛台与红木供桌，桌前放两个米黄色方形拜垫，佛台供奉一尊头戴宝冠骑乘瑞兽的铜鎏金菩萨坐像，背后是通体发光的金色火焰舟形大背光，左右墙面悬挂传统重彩佛教壁画，后方设中式木格扇门与传统斗拱梁架，庄严古朴，建筑效果图
