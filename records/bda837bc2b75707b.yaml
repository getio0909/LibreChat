prompt_zh: 中国传统汉式寺庙建筑群正面全景效果图，中轴对称布局，中央为重檐歇山顶主殿，檐下挂“妈祖庙”金字牌匾，左右两侧对称耸立重檐钟楼与鼓楼，青灰筒瓦飞檐翘角，殿前设宽阔的青石月台与中轴大台阶，台阶入口设石灯笼，月台前对称蹲坐一对大型汉白玉石雕雄狮，周围环绕金黄色的秋日银杏树与翠绿草坡，蓝天阳光明媚，写实建筑景观渲染，8K。
