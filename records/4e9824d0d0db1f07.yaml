prompt_zh: 传统佛教寺庙大雄宝殿正面中轴对称全景，地面满铺高光暖红棕色方形几何席纹拼花实木地板，前景左右对称耸立两根粗壮的竖向凹槽方形实木巨柱，下承洁白厚重的汉白玉精雕方形莲花须弥座柱础，正前方深色木雕须弥座主坛上并列供奉五尊巨型铜鎏金佛菩萨像（中央三世佛坐像与左右文殊骑狮、普贤骑象像，均带镂空火焰金背光），每尊造像背后均设有一扇洁白的石材雕花海棠框发光背景板，坛前整齐排列五张木雕供桌与五对米黄色方形拜垫，两侧回廊供奉铜鎏金十八罗汉，顶部为九宫格发光木天花与中央八角重檐贴金斗拱大藻井，8K超清渲染
