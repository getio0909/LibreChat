ai_design_usage: 新中式佛教美术馆与书画展厅设计、敦煌金地壁画主景墙植入及对称展厅空间生成
prompt_zh: 新中式佛教书画与壁画艺术展厅室内设计，严谨的中轴对称单点透视构图，正前方主景墙镶嵌巨幅金地重彩敦煌飞天说法壁画，两侧对称矗立粗壮的暖色原木大圆柱，柱脚包镶鎏金回纹铜圈并立于浅灰汉白玉覆盆柱础上，左右两翼展墙内嵌发光宣纸灯箱展示水墨达摩画像、山水画与草书佛经书法，顶部为传统木斗拱藻井与弧形木格栅吊顶，地面满铺深灰黑色仿古青石方砖，两侧对称摆放新中式弧形腿实木长条凳，禅意高雅，8K超高清渲染。
