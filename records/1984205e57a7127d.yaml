summary_zh: 新中式禅意书画与敦煌壁画艺术展厅对称场景，正中嵌巨幅金地飞天说法图壁画，两侧立鎏金铜箍原木大圆柱与汉白玉柱础，两翼设达摩山水与草书佛经发光画框。
