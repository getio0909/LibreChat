prompt_zh: 新中式禅意佛堂茶室局部端景墙软装设计特写，非对称画意构图，背景为温润的暖褐色竖向木饰面墙体，左侧嵌入一个大型圆形月亮门式内凹发光壁龛，内藏3000K暖黄灯带形成柔和满月光晕，右侧摆放一件古朴粗犷的哑光黑陶大花瓮，瓶中斜插一枝金黄色的秋叶枝条伸入圆形光晕前，下方设双层实木展台并叠放素白古籍经书，宋代极简禅意美学，柔和光影，8K超高清室内摄影质感。
