prompt_zh: 中式佛教地藏殿与功德堂室内佛龛展示空间，对称框景构图，前景两根深棕色实木圆柱配精雕汉白玉回纹莲花鼓形柱础，柱间上方设镂空木雕挂落门楣，内室正中央为圆拱形柔白发光佛龛，供奉头戴五佛冠的地藏王菩萨金身坐像，前设木雕供桌与两个黄色圆蒲团，主龛两侧及侧墙镶嵌发光金色万佛功德格，左右两侧墙面对称悬挂两幅巨型工笔重彩立姿菩萨画像，顶部圆形发光藻井，高光深灰褐大理石地面镶嵌白色与红色几何水刀拼花，8K建筑渲染
