prompt_zh: 近景商业家具特写，纯白背景，一套深胡桃木佛教莲花雕刻实木沙发与大茶几，无软垫原木坐面，靠背深浮雕盛开的立体莲花与卷草纹，中央方形茶几台面镶嵌抛光深墨绿色白根纹大理石，石面正中镶嵌一朵精美的鎏金重瓣莲花并嵌满红珊瑚、绿松石、黄蜜蜡与青金石圆珠，角几上摆放墨玉钵与圆形莲花木雕屏风，极佳木纹与石材反光质感，8K超清。
