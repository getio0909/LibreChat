summary_zh: 纯白背景下以近景俯拍视角聚焦展示的中式佛教莲花主题实木沙发与嵌石镶宝茶几组合。镜头重点突出了中央大型方形茶几的台面石材镶嵌工艺与主沙发、单人椅的实木立体深浮雕细节，并省去了软包坐垫，直接展示实木座板的原木美学。
