prompt_zh: 福建厦门南普陀寺“大悲殿”门头外檐正视仰拍场景，正中央高悬一块紫红底色镶嵌金色镂空卷草边框的巨型牌匾，上书苍劲饱满的“大悲殿”三个金色大字；牌匾上方为层层出跳的翠绿色与朱红色相间的闽南传统木构斗拱与琉璃瓦滴水檐，牌匾下方两侧花岗岩石柱柱头处对称安装两件精美的金漆镂空凤凰雀替，左右前景有翠绿树叶自然掩映，色彩明快庄严，高清古建摄影。
