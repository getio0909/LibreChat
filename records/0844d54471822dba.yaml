prompt_zh: 顶级豪华佛教寺庙药师殿内部装饰全景，大广角仰视斜透视构图，浅米灰色高光大理石地面，前景与殿内矗立粗壮的米黄色纹理石材大圆柱，柱身包镶上中下三道精美的鎏金莲瓣宝相花箍带并立于汉白玉雕花柱础上，右侧主佛坛筑有双层洁白的汉白玉高浮雕束腰须弥座，供奉铜鎏金药师佛坐像与日光月光菩萨立像，佛像背后镶嵌整幅天然水墨山水纹奢石大板背景墙，右侧边框竖刻“药师赐福佑人间”金色大字对联，大殿远端墙面为橙金色发光万佛墙与护法天王金像，顶部为满铺的贴金八瓣莲花团花方格发光藻井天花，金碧辉煌，8K超高清渲染
