prompt_zh: 大型沉浸式佛教石窟艺术展览大厅，正向对称构图，顶部是深蓝色璀璨星空天幕，前景左右矗立两根七彩渐变发光的琉璃千佛方柱配石雕须弥座，中央两根敦煌彩绘壁画柱之间是一座白色石窟山体佛像群雕，下方簇拥着绚丽的巨型彩色莲花雕塑，地面铺设高光橙黄色玉石网格地砖并镶嵌圆形曼荼罗图案，倒影斑斓，8k效果图。
