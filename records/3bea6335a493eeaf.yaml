prompt_zh: 高端禅意石材美学馆室内光影特写，斜视角拍摄，金褐色、琥珀色与深墨色交织的天然敦煌金奢石大理石墙面，高光抛光石材表面上通过光学投影仪精准投射出八列竖排白色发光中文禅诗书法（“天成佛缘，石载禅心，石蕴佛塔，纹显真如”），文字在深色石纹上散发圣洁白光，同时石材镜面反射出远处的暖黄色阶梯状轮廓灯带，顶部安装黑色现代轨道射灯，新中式木质雕花边框，极具东方哲学与宗教神圣意境，8K实景摄影。
