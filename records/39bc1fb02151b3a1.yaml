prompt_zh: 2:1超宽画幅现代新中式佛教禅修大殿室内全景，中轴对称广角透视，地面满铺如水墨山水般流淌的灰白色高光天然流纹奢石大理石大板，地面左右对称排列整齐的明黄色圆形禅修蒲团阵列，四根粗壮的深胡桃木竖向凹槽方形巨柱，柱头与柱础均为洁白的汉白玉精雕仰覆莲瓣方形石构件，正中央雕花木栏杆与须弥座上供奉一尊洁白无瑕的大型汉白玉释迦牟尼坐佛，背后是金碧辉煌的立体祥云浮雕背景墙，两侧为中式木格栅门与长条玉石壁灯，顶部为叠级发光木格栅天花，8K宽银幕建筑渲染
