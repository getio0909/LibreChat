prompt_zh: 现代中式佛教藏经阁与转轮藏展示空间室内设计，广角中轴对称构图，正中央矗立一座巨大的八角形红木雕花发光转轮藏经塔，塔身嵌入暖光透光格扇与鎏金小佛像壁龛，外围环绕传统中式雕花木栏杆，顶部为圆形发光藻井与金色盘龙浮雕，左右两侧为圆拱形门洞与发光藏经书架壁龛，地面铺设高光浅米灰色大理石并形成清晰倒影，庄严神圣，8K建筑渲染效果图
