prompt_zh: 汉传佛教极彩描金观世音菩萨立像近景仰拍特写，菩萨面如满月，慈悲庄严，头戴贴金化佛宝冠，胸佩华丽金璎珞，双手于胸腹前结优雅说法手印；肩披浅藕粉描金披肩，身着松石绿底满绘金线祥云水波纹与五彩宝相团花纹的锦绣天衣，内衬朱红织金长裙；身后环绕圆形金色头光与舟形全镂空石绿色卷草紫金莲花大背光，背景为高挑的暖金棕色金镶玉天然大理石大板墙面与透光石莲花藻井天花，色彩典雅瑰丽，8K佛教艺术微距摄影。
