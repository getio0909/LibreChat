ai_design_usage: 适用场景：竖幅构图观音殿/佛殿室内空间设计 / 方形贴金宝相花平棊吊顶参考 / 地面圆形彩色大理石水刀拼花与石柱红玉柱套设计；推荐搭配：汉白玉千手观音立像 + 24K贴金方形宝相莲花平棊天花 + 米白大理石柱配橙红玉石浮雕柱套
  + 多色奢石圆形水刀拼花地面
prompt_zh: 庄严华丽的佛教寺庙观音殿室内竖幅对称场景，顶部为大面积整齐排列的方形贴金宝相莲花平棊格栅吊顶，边缘环绕贴金斗拱；画面中央远端多层实木须弥座与双层汉白玉莲花宝座上，矗立一尊高大的汉白玉千手观音立像，观音头顶内圈为发光千瓣金莲穹顶，后方弧形墙面满布橙黄色发光的方格万佛墙，座前陈设三张中式雕花供桌与蒲团；前景两侧对称矗立米白色大理石圆柱，柱脚包嵌橙红色浮雕玉石柱套与青白石莲花柱础；高光米黄大理石地面正中镶嵌一幅精美的圆形彩色宝相莲花水刀拼花图案，8K超高清室内效果图。
