prompt_zh: 室内装饰工程CAD彩色立面施工图，“C立面图”，展示9780mm长、5000mm高的新中式“天然美石·佛國畫卷”巨幅石材背景墙设计，暖米白色木结构底墙（CMYK色值C13 M9 Y19 K0），上方1200mm留白区居中标注“天然美石·佛國畫卷”PVC雕刻字，中央为8800×2500mm大型对纹玉石背景墙并由100mm宽木纹线条包边，底部为900mm高（150+600+150mm）深胡桃木回型条护墙板，前方透视可见两张白色圆形洽谈桌椅，四周带有详尽精准的红色工程尺寸标注与中文工艺引线，白底专业CAD施工图。
