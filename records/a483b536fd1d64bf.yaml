summary_zh: 本图为展位后方主背景墙前供奉的西方三圣主尊——汉传极细彩绘描金阿弥陀佛接引立像（配青绿镂空卷草莲花大背光）正面半身至全身特写。造像融合了唐代丰满端庄的体态与明清宫廷“极彩泥金/描金漆画”的繁复装饰工艺。
