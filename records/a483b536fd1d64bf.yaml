- 石青
- 石绿
- 描金
style: 现代新中式殿堂奢石展陈
ai_design_usage: 汉传佛教极细彩绘贴金佛像与青绿镂空卷草背光单品设计参考
prompt_zh: 汉传佛教极彩描金阿弥陀佛接引立像正面特写，佛像螺发肉髻，面相丰满慈悲，双目微垂，胸前佩戴精致金璎珞，左手托碧玉莲花台，右手自然下垂结接引印；身披华丽的朱红、石蓝与玄黑拼接百衲格纹福田袈裟，衣面上以纯金线极细勾勒祥云、海水与团花纹样；脑后有金色圆形头光，外围环绕巨大的舟形全镂空石绿色卷草纹与紫蓝描金莲花大背光；背景为竖向黑色金属条分缝的暖金色天然金镶玉大理石奢石墙面，色彩浓郁古雅，敦煌岩彩与宫廷造像质感，8K超高清文物摄影。
