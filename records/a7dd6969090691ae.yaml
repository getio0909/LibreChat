ai_design_usage: 适用场景：暗调戏剧光影药师佛殿/禅修空间设计 / 垂挂式发光佛教经文幡装置参考 / 倒挂山石须弥座与双层壶门发光佛龛设计；推荐搭配：黄褐砂岩雕刻药师三尊造像 + 黑胡桃木千佛格龛配2400K琥珀金背光 + 黑色亚克力/金属蚀刻背光金字经幡
  + 白玉莲花琉璃供灯 + 深灰青石哑光地面
prompt_zh: 暗调禅意佛教药师佛殿堂展示空间，正面中轴对称构图，深邃幽暗的空间中，正中央为双层如意壶门形暖金内发光大壁龛，龛内供奉褐石雕刻的药师琉璃光如来坐像（左手持药钵），底座为覆莲与金色倒挂山石造型；主龛两侧为矩阵式排列的圆拱形暖黄发光千佛小龛；左右两侧自天花垂挂两条黑底发光金字的《药师佛十二大愿》经幡（左为第一大愿，右为第十二大愿），最外侧壁龛供奉日光与月光菩萨；前方深色实木供桌上并列摆放五盏发光的白玉莲花玻璃罩供灯，顶部为方格点状射灯藻井，深灰黑色石材地面，光影神秘庄严，8K超高清效果图。
