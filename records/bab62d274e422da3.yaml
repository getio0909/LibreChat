prompt_zh: 现代新中式佛教寺院建筑与禅意庭院日景效果图，背景是一座庄严的重檐灰瓦木柱大殿，檐下悬挂写有“三宝殿”的黑底金字牌匾，前景开阔的浅灰色花岗岩庭院广场上，左侧建有一座现代极简原木方亭并镶嵌印有“禅”字书法的透明玻璃隔断，周围摆放石凳与罗汉松，庭院右侧矗立一座高大的青石八角经幢、石灯笼以及一面镶嵌深色佛陀打坐剪影浮雕的石材景墙，蓝天白云，阳光明媚。
