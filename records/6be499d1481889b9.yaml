prompt_zh: 中国传统佛教建筑室内重檐木雕贴金装饰构件正面仰视特写，严格对称构图，顶部横梁深浮雕卷草番莲纹，正中嵌入一块方形金色流云纹透光云石发光天窗；下方为人字形博风板与弧形卷棚轩顶，两侧垂挂一对硕大的贴金莲花垂珠柱头；轩顶下方的拱眼壁满雕精湛的贴金镂空缠枝牡丹花纹，其下整齐排列一排金碧辉煌的传统贴金斗拱与高浮雕莲花额枋，木质温润，金箔璀璨，极致的中国传统古建木雕工艺细节，8K超高清。
