prompt_zh: 恢弘壮丽的药师七佛七彩琉璃大殿室内设计，广角对称构图，正中央主龛供奉宝蓝色半透明琉璃药师佛坐像与两尊琥珀色胁侍菩萨，前方摆放六个明黄色方形拜垫，左右两侧八字形展开的红木高墙内对称嵌入六座大型发光佛龛，分别供奉橙红、纯白、明黄、深紫、粉红、翠绿六尊巨型晶莹剔透的古法琉璃坐佛，天花正中是一座巨大的白色飞天祥云圆形浮雕藻井，外围环绕深蓝星空木格，地面为镜面墨绿色奢石大理石并清晰倒映七彩佛光，8k效果图。
