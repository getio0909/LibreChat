version: 1.3.17
interface:
  modelSelect: true
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  memories: false
  multiConvo: false
  sharedLinks: false
  temporaryChat: false
  mcpServers:
    use: true
    create: false
    share: false
  customWelcome: '庄严宝刹 AI 设计助手'

endpoints:
  custom:
    - name: OpenRouter
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default: [anthropic/claude-haiku-5.5]
        fetch: false
      titleConvo: true
      titleModel: anthropic/claude-haiku-5.5
      titleEndpoint: OpenRouterTitles
      modelDisplayLabel: Claude Haiku 5.5
      addParams:
        # 清空标量映射，防止旧会话参数覆盖 OpenRouter 的完整推理配置。
        reasoning_effort: ''
        reasoning:
          effort: high
          enabled: true
        maxTokens: 128000
        maxCompletionTokens: 128000
      dropParams: [stop, temperature, top_p, top_k, include_reasoning]
    - name: OpenRouterMax
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default: [anthropic/claude-haiku-5.5]
        fetch: false
      titleConvo: true
      titleModel: anthropic/claude-haiku-5.5
      titleEndpoint: OpenRouterTitles
      modelDisplayLabel: Claude Haiku 5.5
      addParams:
        reasoning_effort: ''
        reasoning:
          effort: max
          enabled: true
        maxTokens: 128000
        maxCompletionTokens: 128000
      dropParams: [stop, temperature, top_p, top_k, include_reasoning]
    - name: OpenRouterTitles
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default: [anthropic/claude-haiku-5.5]
        fetch: false
      titleConvo: false
      addParams:
        reasoning_effort: ''
        reasoning:
          effort: low
          enabled: false
        maxCompletionTokens: 256
      dropParams: [stop, temperature, top_p, top_k, include_reasoning]
  agents:
    disableBuilder: true
    capabilities:
      - tools
      - context

modelSpecs:
  enforce: true
  list:
    - name: haiku-design
      label: Claude Haiku 5.5 · High
      default: true
      mcpServers: [freecad, blender, design_tools]
      preset: &cad-preset
        endpoint: OpenRouter
        model: anthropic/claude-haiku-5.5
        maxContextTokens: 850000
        promptPrefix: >-
          You are a CAD and 3D design assistant. Use real MCP operations and
          inspect the resulting files. Begin every CAD task with the FreeCAD
          connection and workflow-guidance tools before planning the complete
          model or drawing layout. Use the actual workspace state and tool
          capabilities to work in small saved steps: model, inspect, export,
          draw, and verify. Make tool calls early and refine the files iteratively
          instead of planning the entire deliverable before the first tool call.
          Study the reference's form, proportions,
          layout, and significant details before modeling. Preserve supplied
          dimensions and units; reconstruct orthographic geometry rather than
          copying photographic perspective. Treat specified overall dimensions
          as the complete envelope, including handles, feet, and trim, unless the
          user defines a different datum. When details are missing, calculate
          consistent dimensions and select suitable materials, joints, hardware,
          and clearances for the intended use. Proceed with reasonable design
          choices without repeatedly waiting for confirmation, and identify
          those choices separately from facts visible in the reference.
          Use an editable feature tree and constrained sketches where practical.
          Complete the relevant construction and decorative details, instead of
          stopping at a generic arrangement of boxes. Produce coordinated 2D
          views, sections, and indexed connection details from the final model,
          with consistent datums, projection, overall dimensions, locating
          dimensions, and clear-opening dimensions. Use readable text, suitable
          lineweights, compact title blocks, and real drawing scales. Keep chat,
          prompts, generation commentary, and inspection reports off the drawing
          sheets; put design assumptions, maker checks, and unfinished validation
          in a short separate note.
          For CAD requests, deliver FCStd, STEP, AutoCAD-compatible 2D drawings,
          and PDF sheets. Export genuine DWG only when supported; otherwise
          provide DXF and say why. Never rename another format to DWG. Prepare
          complete SVG sheets with explicit physical dimensions, then call
          export_drawing_pdf with matching page_width_mm and page_height_mm so
          paper size and drawing scale are preserved. Export each sheet when
          several views or details need multiple pages. Inspect every rendered
          page using the returned sheet preview and fix unreadable text,
          overlap, or cropping before delivery. On large sheets, call
          inspect_drawing for regions containing small annotations or detail
          views; a reduced overview alone is not a complete text inspection.
          Reopen exported models and compatible drawings, check units, complete
          envelope dimensions, solid validity, unintended intersections,
          assembly clearances, and cut-list quantities. Count instances once and
          distinguish their quantities from unique part types. Correct detected
          defects before declaring completion. If a check cannot run, say so.
          A rendered preview is not a manufacturing drawing. Claim factory
          readiness only after construction, hardware, materials, tolerances,
          and the complete drawing set have been specified and checked.
          For 3D scenes, export the editable scene and an inspected rendered
          preview. Each account has its own private workspace. Finish by calling
          workspace_files and returning clickable Markdown links using its exact
          download_url values for the drawings, models, and cut list. Signed
          links expire at expires_at; issue fresh links on request. Explain a
          large file's download_requires_login flag. Do not invent files or URLs
          or tell users to find /tmp/cad on their own computer.
    - name: haiku-design-max
      label: Claude Haiku 5.5 · Max
      default: false
      mcpServers: [freecad, blender, design_tools]
      preset:
        <<: *cad-preset
        endpoint: OpenRouterMax

fileConfig:
  endpoints:
    OpenRouter: &cad-files
      supportedMimeTypes:
        - '^(text/(x-c|x-csharp|tab-separated-values|x-c\+\+|x-h|x-java|html|markdown|x-php|x-python|x-script\.python|x-ruby|x-tex|plain|css|vtt|javascript|csv|xml|calendar))$'
        - '^application/(vnd\.ms-excel|msexcel|x-msexcel|x-ms-excel|x-excel|x-dos_ms_excel|xls|x-xls|vnd\.openxmlformats-officedocument\.spreadsheetml\.sheet)$'
        - '^(application/(epub\+zip|csv|json|msword|pdf|x-tar|x-sh|x-zip-compressed|typescript|sql|yaml|x-parquet|vnd\.apache\.parquet|vnd\.coffeescript|vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|presentationml\.(presentation|template)|spreadsheetml\.sheet)|vnd\.oasis\.opendocument\.(text|spreadsheet|presentation|graphics)|xml|zip))$'
        - '^image/(jpeg|gif|png|webp|heic|heif|svg|svg\+xml)$'
        - '^video/(mp4|avi|mov|wmv|flv|webm|mkv|m4v|3gp|ogv)$'
        - '^audio/(mp3|mpeg|mpeg3|wav|wave|x-wav|ogg|vorbis|mp4|m4a|x-m4a|flac|x-flac|webm|aac|wma|opus)$'
        - '^message/rfc822$'
        - '^model/(step|stl|obj|gltf-binary|gltf\+json|iges)$'
        - '^application/(octet-stream|x-blender|x-freecad|dxf|iges|step|stl|sla|vnd\.blender)$'
      defaultLLMDeliveryPath:
        overrides:
          '^model/(step|stl|obj|gltf-binary|gltf\+json|iges)$': none
          '^application/(octet-stream|x-blender|x-freecad|dxf|iges|step|stl|sla|vnd\.blender)$': none
    OpenRouterMax: *cad-files

mcpSettings:
  allowedAddresses: []

mcpServers:
  freecad:
    startup: false
    type: sse
    url: http://freecad-{{LIBRECHAT_USER_ID}}:8000/sse
    requiresOAuth: false
    timeout: 180000
    initTimeout: 120000
    serverInstructions: >-
      Use FreeCAD for precise CAD models in this private user workspace. Save
      exports under /tmp/cad. Reopen exported models and check dimensions, solid
      validity, clashes, assembly clearances, and cut-list quantities. Prefer
      constrained sketches and editable construction features; Part::Feature
      boxes alone are not a completed parametric design. Preserve reference
      details and the specified complete envelope. Infer missing details as
      explicit design choices. Create coordinated views, sections, and indexed
      joint details. Export genuine DXF when DWG is unavailable. Prepare clean
      SVG sheets with physical dimensions and matching PDF page dimensions;
      inspect every rendered page and keep inspection notes separate. Convert
      them with design_tools export_drawing_pdf, then call
      workspace_files. Finish with clickable Markdown links to the exact returned
      download_url for the PDF, FCStd/STEP, and CSV cut list. Clearly mark inferred
      dimensions and any unfinished manufacturing checks. Attached chat images
      are visual references; do not confuse perspective with measured geometry.
  blender:
    startup: false
    type: streamable-http
    url: http://blender-{{LIBRECHAT_USER_ID}}:10101/
    requiresOAuth: false
    timeout: 180000
    initTimeout: 120000
    serverInstructions: >-
      Use Blender for 3D scenes, materials, and CPU rendering in this private user
      workspace. Use media_io to import, export, and render into /tmp/cad. Stage
      scratch thumbnails with media_io stage. Export the editable scene, render a
      preview, and use export_drawing_pdf when a PDF is requested. Call design_tools
      workspace_files and return its exact download_url values as clickable
      Markdown links. Label a rendered PDF as a preview; it is not a dimensioned
      manufacturing drawing. Inspect exported geometry and report unresolved issues.
  design_tools:
    startup: false
    type: streamable-http
    url: http://design-{{LIBRECHAT_USER_ID}}:8000/mcp
    requiresOAuth: false
    timeout: 180000
    serverInstructions: >-
      Use Seedream for image generation unless the user asks for Gemini. CAD
      imports and exports use the private workspace. CAD drawing requests must
      include real PDFs created by export_drawing_pdf before completion. For
      scaled CAD sheets, use SVG with physical page dimensions and pass matching
      page_width_mm and page_height_mm. Omit page dimensions only for fit-to-page
      previews, which must not claim a drawing scale. Inspect every sheet and
      keep design assumptions and check reports separate from the drawings. Call
      workspace_files after exports and put exact download_url values in Markdown
      links in the chat. Signed links need no separate file-manager login and
      expire at expires_at; issue new links on request. Large exports remain
      listed with authenticated links and download_requires_login; explain this
      explicitly. Uploads and ZIP archives
      still use the authenticated file manager for manual transfer into LibreChat
      Files. Do not claim automatic library synchronization or factory readiness.
    headers:
      X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
