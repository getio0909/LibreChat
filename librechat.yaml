version: 1.3.17
interface:
  modelSelect: false
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  memories: false
  multiConvo: false
  sharedLinks: false
  temporaryChat: false
  mcpServers:
    use: true
    create: false
    share: false
  customWelcome: '庄严宝刹 AI 设计助手'

endpoints:
  custom:
    - name: OpenRouter
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default: [anthropic/claude-haiku-5.5]
        fetch: false
      titleConvo: true
      titleModel: anthropic/claude-haiku-5.5
      modelDisplayLabel: Claude Haiku 5.5
      dropParams: [stop]
  agents:
    disableBuilder: true
    capabilities:
      - tools
      - context

modelSpecs:
  enforce: true
  list:
    - name: haiku-design
      label: Claude Haiku 5.5
      default: true
      mcpServers: [freecad, blender, design_tools]
      preset:
        endpoint: OpenRouter
        model: anthropic/claude-haiku-5.5

fileConfig:
  endpoints:
    OpenRouter:
      supportedMimeTypes:
        - '^(text/(x-c|x-csharp|tab-separated-values|x-c\+\+|x-h|x-java|html|markdown|x-php|x-python|x-script\.python|x-ruby|x-tex|plain|css|vtt|javascript|csv|xml|calendar))$'
        - '^application/(vnd\.ms-excel|msexcel|x-msexcel|x-ms-excel|x-excel|x-dos_ms_excel|xls|x-xls|vnd\.openxmlformats-officedocument\.spreadsheetml\.sheet)$'
        - '^(application/(epub\+zip|csv|json|msword|pdf|x-tar|x-sh|x-zip-compressed|typescript|sql|yaml|x-parquet|vnd\.apache\.parquet|vnd\.coffeescript|vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|presentationml\.(presentation|template)|spreadsheetml\.sheet)|vnd\.oasis\.opendocument\.(text|spreadsheet|presentation|graphics)|xml|zip))$'
        - '^image/(jpeg|gif|png|webp|heic|heif|svg|svg\+xml)$'
        - '^video/(mp4|avi|mov|wmv|flv|webm|mkv|m4v|3gp|ogv)$'
        - '^audio/(mp3|mpeg|mpeg3|wav|wave|x-wav|ogg|vorbis|mp4|m4a|x-m4a|flac|x-flac|webm|aac|wma|opus)$'
        - '^message/rfc822$'
        - '^model/(step|stl|obj|gltf-binary|gltf\+json|iges)$'
        - '^application/(octet-stream|x-blender|x-freecad|dxf|iges|step|stl|sla|vnd\.blender)$'
      defaultLLMDeliveryPath:
        overrides:
          '^model/(step|stl|obj|gltf-binary|gltf\+json|iges)$': none
          '^application/(octet-stream|x-blender|x-freecad|dxf|iges|step|stl|sla|vnd\.blender)$': none

mcpSettings:
  allowedAddresses: []

mcpServers:
  freecad:
    startup: false
    type: sse
    url: http://freecad-{{LIBRECHAT_USER_ID}}:8000/sse
    requiresOAuth: false
    timeout: 180000
    initTimeout: 120000
    serverInstructions: Use FreeCAD for precise parametric CAD models. This is a private user workspace. Save exports under /tmp/cad. Use design_tools workspace_files to find uploaded sources and download links. Use attached chat images as visual references; ask for missing dimensions when precision matters.
  blender:
    startup: false
    type: streamable-http
    url: http://blender-{{LIBRECHAT_USER_ID}}:10101/
    requiresOAuth: false
    timeout: 180000
    initTimeout: 120000
    serverInstructions: Use Blender for 3D scenes, materials, and CPU rendering. This is a private user workspace. Use media_io to import, export, and render into /tmp/cad. If a thumbnail tool returns a scratch path, use media_io stage to copy it into the workspace. Use design_tools workspace_files for source paths and download links. Render a PNG or SVG view before using export_drawing_pdf to create a PDF.
  design_tools:
    startup: false
    type: streamable-http
    url: http://design-{{LIBRECHAT_USER_ID}}:8000/mcp
    requiresOAuth: false
    timeout: 180000
    serverInstructions: Use Seedream for image generation unless the user asks for Gemini. CAD imports and exports use the private workspace. Return the download links from workspace_files or export_drawing_pdf. Use the workspace ZIP archive for manual storage in LibreChat Files when native CAD types are not recognized by the browser. Users extract archives locally before uploading models into the CAD workspace. Do not claim automatic library synchronization.
    headers:
      X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
