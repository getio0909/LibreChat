# 庄严宝刹 AI 概念设计助手配置文件
version: 1.3.17

# 界面展示与权限控制配置
interface:
  modelSelect: false
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  memories: false
  multiConvo: false
  sharedLinks: false
  temporaryChat: false
  mcpServers:
    use: true
    create: false
    share: false
  customWelcome: '庄严宝刹 AI 设计助手'

# 聊天附件上传配置，允许两个模型端点上传参考图片
fileConfig:
  endpoints:
    google: &image-files
      disabled: false
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - '^image/(jpeg|jpg|png|webp|gif)$'
    OpenRouter: *image-files
    agents: *image-files
    default: *image-files

# 模型端点配置：原生 Google 端点与 OpenRouter 自定义端点
endpoints:
  google:
    titleConvo: true
    titleModel: gemini-4-argon
  custom:
    - name: OpenRouter
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - anthropic/claude-haiku-5.5
        fetch: false
      titleConvo: true
      titleModel: anthropic/claude-haiku-5.5
      titleEndpoint: OpenRouterTitles
      addParams:
        reasoning_effort: ''
        reasoning:
          effort: high
          enabled: true
        maxTokens: 128000
        maxCompletionTokens: 128000
      dropParams:
        - stop
        - temperature
        - top_p
        - top_k
        - include_reasoning
    - name: OpenRouterTitles
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - anthropic/claude-haiku-5.5
        fetch: false
      titleConvo: false
      addParams:
        reasoning_effort: ''
        reasoning:
          effort: low
          enabled: false
        maxCompletionTokens: 256
      dropParams:
        - stop
        - temperature
        - top_p
        - top_k
        - include_reasoning
  agents:
    disableBuilder: true
    capabilities:
      - tools
      - context

# 模型预设规范：对外隐藏底层模型与厂商名称，仅挂载概念设计 MCP 服务
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: zyb-design
      label: 庄严设计助手
      description: 寺院装饰、石材大板、家具与展位概念设计主力助手
      default: true
      mcpServers:
        - zyb_studio
      preset:
        endpoint: google
        model: gemini-4-argon
        thinking: true
        thinkingLevel: high
        promptPrefix: &designPromptPrefix |-
          你是庄严宝刹概念设计助手，专注寺院佛堂、石材大板、禅意家具与展位设计。凡需图片或资料请立即调用工具：查资料库参考图用 search_library（返回的 kb_ 前缀 id 可传入 base_id、references 或 reference_ids）；多方向构思用 design_concepts（参考图传 reference_ids）；单张出图用 generate_image；改图用 edit_image（取 base_id，不确定先调 list_images）；同底图对比石材用 compare_materials（传 base_id、target、materials）；传 references 须含 id 与 use。请保留客户石材原名。概念图仅供参考，非施工下料图；CAD 施工图功能升级中暂不提供。严禁提及任何底层模型、平台或厂商名称。
    - name: zyb-design-fast
      label: 庄严设计助手 · 快速
      description: 快速响应的概念设计与图像改图助手
      default: false
      mcpServers:
        - zyb_studio
      preset:
        endpoint: OpenRouter
        model: anthropic/claude-haiku-5.5
        promptPrefix: *designPromptPrefix

# 允许访问内部 Docker 网络中的概念设计 MCP 服务地址
mcpSettings:
  allowedAddresses:
    - studio:8000

# 庄严宝刹概念设计 MCP 服务连接配置
mcpServers:
  zyb_studio:
    type: streamable-http
    url: http://studio:8000/mcp
    timeout: 600000
    headers:
      X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
      X-LibreChat-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      X-Studio-Token: '${STUDIO_SHARED_TOKEN}'
