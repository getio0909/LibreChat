ai_design_usage: 适用场景：现代新中式素雅佛堂立面设计 / 白色大理石万佛墙与壶门主佛龛比例参考 / 佛教艺术馆山水浮雕背景墙生成；推荐搭配：米白汉白玉/白砂岩浮雕墙面 + 灰白水墨云纹大理石背景板 + 泥金彩绘佛像 + 3000K-3500K暖白暗藏洗墙灯带
prompt_zh: 现代新中式素雅白石佛教展厅室内设计，三面围合构图，正中为三曲壶门形内凹大佛龛，龛内供奉泥金彩绘释迦牟尼坐佛与金色火焰背光，背景为水墨意境的灰白石雕云海山峦，龛前设汉白玉小护栏；左侧整面墙为暖白色大理石雕刻的矩阵式背光千佛小龛与几何花格浮雕；右侧石雕台基上伫立合十礼拜的阿难尊者雕像，背后为发光经文镂空光幕与远山浮雕；顶部环绕白色中式直棂格栅与垂莲柱，光影圣洁柔和，现代禅意建筑效果图。
