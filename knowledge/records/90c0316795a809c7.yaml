summary_zh: 本图为整套施工图册的扉页总纲——01 材质图。采用东北角 45° 斜俯视 3D 等轴测渲染视角，将 75m² 两面开口展位的建筑体块、空间围合、灯光矩阵与八大核心材质工艺直观地整合在一张图面上。
