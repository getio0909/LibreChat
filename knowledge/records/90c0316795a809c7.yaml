ai_design_usage: 商业展位3D轴测全要素材质与灯光工程标注汇报图模板参考
prompt_zh: 展览工程设计汇报总图“01 材质图”，3D等轴测45度鸟瞰渲染图配中文工程材质引线标注，展示10m×7.5m两面开口的新中式“莊嚴寶刹”佛教石材展位：顶部标注“整体木结构贴纸饰面 C:13 M:9 Y:19 K:0”，地面满铺大理石带不锈钢条收边，右侧为“天然美石·佛國畫卷”巨幅石材背景墙配9盏长臂金卤灯，左侧为侧面内凹藏黄色灯带的折角佛龛背景墙与石雕供桌，中央设两张白色洽谈圆桌与右上角中式实木茶桌、接待台，四周带有“轨道灯、发光字（背发光）、PVC雕刻字、大理石产品”等清晰引线标签，白底专业设计图。
