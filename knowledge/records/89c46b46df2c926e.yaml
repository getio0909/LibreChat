ai_design_usage: 药师琉璃光如来主殿中轴全景设计、多层立体发光莲花穹顶藻井与蓝金万佛墙配色参考
prompt_zh: 药师琉璃光如来主殿室内全景设计，宏伟的中轴对称广角构图，正中央须弥座上供奉东方三圣，主尊为通体澄澈宝蓝色半透明琉璃质感的药师佛坐像，左右两侧为金身立姿日光菩萨与月光菩萨，后方为祥云仙山与飞鹤巨幅壁画，主尊正上方天花高悬一座巨大的五层立体绽放白色发光莲花圆形穹顶藻井，大殿两侧墙面对称嵌入八组通高万佛龛，每格小龛均散发宝蓝色与金色双色琉璃光芒，四根深胡桃木方形大柱立于汉白玉雕花柱础上，高光抛光深灰褐色大理石地面将蓝色大佛与彩色佛龛清晰倒映，殿前摆放六个黄色方形拜垫，净琉璃世界庄严景象，8K超高清渲染。
