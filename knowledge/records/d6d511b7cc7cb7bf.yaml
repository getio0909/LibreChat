prompt_zh: 佛教寺庙东方净琉璃世界药师大殿正面中轴对称超宽全景，地面满铺高光镜面深灰褐色水墨云纹大理石大板，倒影清晰，大殿由多列深棕色实木方柱（下承高大的青白石多层莲花须弥座柱础）与半开启的万字纹镂空木格栅折门分隔为中央主殿与两侧外廊，中轴远端主坛供奉一尊晶莹剔透的宝蓝色古法琉璃药师佛坐像，背后是洁白的圆形发光圆光背板，两侧分立金色日光月光菩萨立像，主殿隔墙与两侧外廊镶嵌多幅发光重彩四大天王护法壁画，顶部为蓝天白云星象图案结合木构井字格与小宫灯吊顶，8K超清渲染
