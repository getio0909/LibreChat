prompt_zh: 现代东方禅意石材展览大厅室内设计，严格的一点透视中轴对称构图，两侧高墙采用暖黄色天然洞石大板竖向拼接并内嵌竖条暖光灯带，顶部为四坡面木质格栅吊顶，中央矩形天井垂落大型长方体飞鸟水晶吊灯装置，下方黑色石材水景台座上陈设一尊发光的青玉大宝瓶，正后方为金色弧形前台与整面发光矩阵千佛龛背景墙，左右对称布置新中式沙发休息区，辉煌温暖的灯光氛围，8K建筑效果图
