prompt_zh: 以所附实物照片作形态参考，深褐色小柜前盖翻下，内侧排列多格抽屉与中央小门，浅色花卉嵌饰在深底上重复，侧面有提环。重点保留可辨识的轮廓、纹样疏密与表面色差，用于传统家具比例、木作雕饰与构件连接参考；此提示词为设计演绎，不作为年代、材质鉴定或工程尺寸依据。
