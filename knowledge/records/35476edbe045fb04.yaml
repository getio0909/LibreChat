prompt_zh: 高角度斜向俯拍新中式禅意石材展厅地面与佛台空间，大面积满铺“禅境灰蓝”（金镶玉大理石系列）高档天然大理石地面，烟岚灰蓝色与冰川白底色上流淌着华丽的金黄色与古铜色天然闪电状脉络，无缝镜面抛光地面反射出柔和的金色佛龛灯带倒影与射灯光斑，画面远端摆放一座敦煌金黄玉石高浮雕须弥座供桌、明黄色团莲坐垫的实木拜凳以及白色花盆绿植，尽显东方奢华与禅意静谧，8K室内实景摄影。
