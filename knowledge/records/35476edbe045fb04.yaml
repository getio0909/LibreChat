summary_zh: 本图为 2026年春季佛事展（C5 T026）内部空间的高角度斜向俯视地面铺装专题实景照。将超过三分之二的画幅留给 75m² 满铺的“禅境灰蓝”（金镶玉大理石系列，2800元/M²）大板地面，直观展示了该品种在大面积地面工装应用中的整体气场与纹理延展性。
