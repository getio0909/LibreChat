summary_zh: 本图为2025年秋季佛事展“庄严宝刹”展位的三面开口全局透视实景照。展位整体呈大尺度U型半围合殿堂式格局，巧妙利用传统古建“歇山/卷棚轩顶+中堂藻井”的木构语汇进行现代化转译，在挑高展馆中构建出一座独立、醒目且具有强烈宗教建筑仪式感的石材美学殿堂。
