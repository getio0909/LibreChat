prompt_zh: 大型国际佛事用品展“莊嚴寶刹”佛教石材主题展位45度广角全景实拍，U型三面开放式新中式殿堂架构，中央顶部为三层退台式深木色井字梁嵌金镶玉透光石莲花藻井，两侧延伸弧形白色格栅卷棚轩顶，转角木柱悬挂古典六角宫灯；后方高墙为暖金色金镶玉大理石竖板拼接并陈列三尊彩绘佛像，左右两翼内墙为背光发光的三十六尊橙黄琉璃坐佛陈列格，外围由敦煌金高浮雕石材须弥座与汉白玉微缩栏杆半围合，中央矗立巨型石雕莲花供坛与伽蓝菩萨金身坐像，地面铺设高光黑白金几何拼花大理石，左侧配有寺院宣传大屏与大鼓茶桌，右侧设有白色商务洽谈圆桌，展馆环境真实，8K商业空间摄影。
