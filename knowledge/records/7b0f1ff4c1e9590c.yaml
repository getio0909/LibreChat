summary_zh: 现代奢石博物馆风暗调佛像展厅效果图，前景与两侧门洞采用斜向纹理灰褐天然木纹奢石包柱，深炭灰背景墙嵌圆形竖条金属格栅，聚光灯精准打亮中央黑石底座上的汉白玉水月观音坐像。
