ai_design_usage: 庄严宝刹奢石展厅/佛事展核心造像展区设计、斜纹奢石门套与暗调背景墙搭配、汉白玉水月观音博物馆级重点照明构图
prompt_zh: 现代博物馆风格暗调奢石佛教雕像展厅室内设计，一点透视中轴对称构图，前景与两侧门洞采用灰褐色斜向流动纹理的天然木纹奢石大板包柱，柱底内嵌向上洗墙射灯，深炭灰色肌理背景墙正中央嵌入一个圆形中式竖条金属格栅月洞造型，前方黑色大理石方底座上供奉一尊洁白细腻的汉白玉水月观音（自在观音）坐像，顶部纯黑吊顶正中设计一个大型圆形内凹原木宽板条吊顶，窄角聚光灯精准打亮白玉观音，墙角暗藏纤细暖光灯带，静谧高雅的东方现代展陈美学，8K室内效果图
