summary_zh: 【图中可见】银色双门上段为花瓣形拱券与竖栅，下段两面骑象人物相对，周缘有卷叶与花朵，整体固定于黑色展示框。【来源著录】Shrine Doors with Indra, Divine Regent of the East；文化或地点依据：馆方明确著录印度古吉拉特；因陀罗神名与银片包木构造采用来源著录。
