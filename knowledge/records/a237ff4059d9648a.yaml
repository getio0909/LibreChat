prompt_zh: 以所附实物照片作形态参考，银色双门上段为花瓣形拱券与竖栅，下段两面骑象人物相对，周缘有卷叶与花朵，整体固定于黑色展示框。重点保留可辨识的轮廓、纹样疏密与表面色差，用于传统家具比例、木作雕饰与构件连接参考；此提示词为设计演绎，不作为年代、材质鉴定或工程尺寸依据。
prompt_en: Design reference study based on the source photograph of Shrine Doors with Indra, Divine Regent of the East. Preserve
