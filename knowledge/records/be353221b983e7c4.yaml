prompt_zh: 中式大雄宝殿室内设计正面对称效果图，正中整面鱼肚白大理石背景墙前供奉三尊金身三世佛坐像与阿难迦叶二弟子立像，左右两侧白色大理石拱龛内分别供奉金身文殊菩萨骑狮像与普贤菩萨骑象像，两侧侧墙为发光金色万佛墙且中央嵌有白色汉白玉观音小像，两根红木大柱包镶鎏金雕花柱箍与汉白玉柱础，前方整齐排列红木供桌与米白色方蒲团，顶部为传统雕花木梁架与发光方格天花，深色抛光石砖地面，庄严大气，8K渲染
