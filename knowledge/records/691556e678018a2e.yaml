ai_design_usage: 适用场景：寺院大殿侧翼回廊空间设计 / 藏经楼与佛教书画展柜立面参考 / 传统木柱与青白石莲瓣柱础及竖向壁灯细部生成(ControlNet Depth)；推荐搭配：深色老榆木或酸枝木饰面 + 房山汉白玉/青白石浮雕柱础与栏板
  + 仿古青石哑光地砖 + 2700K暖黄透光云石柱灯
prompt_zh: 中国传统佛教寺庙大殿室内外过渡回廊空间，单点透视纵深构图，左侧为粗壮的深红木方柱与青白石多层仰覆莲瓣柱础，柱身安装如意云头铜饰竖长条暖光壁灯，后方可见汉白玉雕花栏杆与贴金佛坛底座及橙色莲花灯；右侧整面墙为通顶红木雕花玻璃藏经展柜，内部陈列佛教古画并带暖色内打光；顶部为斜坡密排木椽屋顶，远端为带发光轮廓的如意壶门形拱门，地面铺设灰褐色青石板与浅浮雕团花地砖，光影静谧庄严，建筑效果图质感，8K超高清。
