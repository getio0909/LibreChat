prompt_zh: 对称庄严的新中式佛教主题高端石材展厅室内设计，一点透视构图，左右两侧如列柱般整齐排列着高大的深木色竖向展架，内部展示天然金棕色与青绿色山水纹理奢石大板，展厅中央通道地面铺设长条白色大理石地毯，四周镶嵌精致的黑白传统回纹水刀拼花边框，两侧为深绿色高光大理石地面，走廊尽头端景墙中央设有一座圆形发光月洞门壁龛，内设假山奇石与罗汉松盆景，顶部为中式十字木格栅发光吊顶，8k效果图。
