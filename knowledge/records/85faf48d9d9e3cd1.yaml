ai_design_usage: 藏汉融合皇家风佛龛设计 / 盘龙抱柱与大鹏鸟冠顶构件提取 / 兰札体藏文门楣细节参考
prompt_zh: 正面展厅实景摄影，一座融合汉藏皇家宫廷工艺的大型木雕贴金三联佛龛大展柜，冠顶正中精雕金翅大鹏鸟、八辐法轮与双鹿，两侧雕刻四条腾云金龙，门楣额枋雕刻鎏金藏文真言，中央主佛龛两侧立柱为立体高浮雕盘龙抱柱，神龙手托宝珠，龛内为明黄色背板，腰线雕刻护法力士、十字金刚杵与八吉祥，下层凸出式底柜包镶金色莲珠边并雕刻瑞兽海棠开光，香槟金与胡桃木配色，8K超高清。
