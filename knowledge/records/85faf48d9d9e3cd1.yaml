summary_zh: 展厅正面实拍的一座藏汉宫廷技艺巅峰融合的“大鹏双龙冠顶 + 盘龙抱柱”三联多宝格大佛龛展柜。与第 19 项纯藏式十一佛冠不同，本座大柜将汉传皇家建筑的镂空游龙冠顶、高浮雕盘龙抱柱与藏传佛教的金翅大鹏鸟（迦楼罗）、双鹿法轮、兰札体梵藏铭文、护法力士金刚杵完美熔铸于一体。
