prompt_zh: 金碧辉煌的双层挑空佛教寺庙千手观音大殿（圆通宝殿）正面中轴对称全景，地面满铺高光深灰黑色镜面大理石，倒映出璀璨金光与红灯笼，大殿内矗立四根顶天立地的通体贴金浮雕大圆柱（柱身雕刻缠枝莲与如意云纹，配深色石雕莲花柱础），正中央双层须弥座与雕花护栏主坛上供奉高大的铜鎏金千手千眼观音立像（带巨型镂空火焰背光），上方悬挑圆形蓝底星空贴金藻井，主坛前设三张供桌与两排共八个黄色方形拜垫，一二层挑空回廊（配白色汉白玉雕花栏杆）四壁满布发光万佛墙与佛教壁画，一层廊下悬挂一排橘红色传统宫灯，8K超清渲染
