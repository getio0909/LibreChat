ai_design_usage: 适用场景：寺院现代藏经阁/佛学图书馆空间设计 / 奢石大理石底座独立文物玻璃展柜参考 / 中式回纹木格栅吊顶生成；推荐搭配：大花绿/雨林绿与啡网纹大理石展柜底座 + 胡桃木通顶藏经书架 + 超白无框玻璃罩 +
  回纹木格栅吊顶 + 底部匀光照明
prompt_zh: 新中式寺院藏经阁与佛教法器文物展陈空间，竖幅对称构图，前景并列三座高规格独立超白玻璃展柜，左侧展柜底座为深绿色云纹大理石，中右展柜底座为褐棕色纹理大理石，底座底部环绕黑色砾石槽，玻璃柜内发光底板上白色展托分别陈列彩绘净瓶、高足供器与白瓷佛钵；空间左中右三面墙均为通顶胡桃木方格书架，整齐排满线装古籍佛经，远端正中挂山水画；天花为中式几何回纹交错木格栅吊顶配嵌入式筒灯，高光深绿色大理石地面带莲花暗纹，儒雅庄重，高清建筑效果图。
