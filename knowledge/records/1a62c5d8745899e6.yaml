summary_zh: 本图为新中式寺院藏经阁（大藏经楼）兼佛教传世法器、瓷器文物珍宝馆室内场景。空间将浩瀚的古典经籍书墙与博物馆级独立文物展柜相结合，营造出书香氤氲、古雅深邃的佛学研修与文物鉴赏空间。 空间以温润的胡桃木本色、深绿与褐棕色奢石/大理石、素白古籍纸本色构成醇厚色调。前景三座并列独立展柜的底座采用天然大理石整石包覆：左侧底座为墨绿/森林绿云纹大理石（如大花绿/雨林绿），中间与右侧底座为深褐棕色乱纹大理石（如咖啡网纹/古木纹石）；地面外圈及前景铺设高光深绿色云纹大理石（右下角带浅浮雕莲花暗纹），展柜底座四周地面设一圈米白石…
