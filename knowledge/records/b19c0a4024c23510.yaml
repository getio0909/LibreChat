prompt_zh: 室内家具摄影，一座老挝大红酸枝镶嵌绿松石与青玉的三层阶梯式佛教装饰柜，殷红色纹理清晰的红酸枝实木柜体，转角配黄铜嵌松石包角，中层上沿镶嵌一圈绿松石、红珊瑚与青金石圆珠，束腰红木浮雕镶嵌绿松石，下层双开门内嵌浅绿青玉底板与海棠形木雕花芯，木框四周点缀绿松石梅花珠饰，8K写实渲染。
