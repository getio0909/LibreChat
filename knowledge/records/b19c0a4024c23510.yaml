summary_zh: 三层阶梯式坛城装饰柜的“红酸枝主体 + 绿松石满嵌 + 局部青玉开光”折中平衡版设计方案。相比第 13 项大面积使用青玉束腰的高昂造价，本方案将玉石集中在下层柜门的核心视觉区，同时强化了红木本身的醇厚木纹与绿松石珠串的点缀感，更具工程落地可行性。
