summary_zh: 【图中可见】林荫步道通向五层石塔，两侧石狮与树木围合前景，树冠遮挡塔身下部，步道上可见携三脚架的人。【来源著录】Renshou pagoda of Quanzhou Kaiyuan Temple 20170727.jpg；文化或地点依据：来源明确福建泉州开元寺仁寿塔（西塔）；与同寺镇国塔为两座不同实物，本图以其上层石构件组织作为纹样及构件参考。
