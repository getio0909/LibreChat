prompt_zh: 现代极简主义层叠木质框架佛龛展示装置单品特写，纯黑色背景，佛龛由九层温暖的浅色原木矩形画框由外向内逐层缩小叠套而成，顶部与底部呈非对称几何阶梯状斜向内收，形成深邃的石窟透视感，顶部阶梯内暗藏温暖柔和的隐藏灯光，龛内正中供奉一尊极简留白风格的羊脂白玉禅定坐佛与方形玉底座，龛背左侧留有一道黑色竖缝，下方连接同材质原木方柱底座，现代东方禅意工业设计，工作室产品摄影，8K
