prompt_zh: 中国传统重檐歇山顶寺院大殿建筑正立面全景效果图，严格的对称构图，青瓦飞檐翘角配鸱吻瑞兽，赭红色木构梁柱与繁复斗拱，檐下悬挂黑底金字“天后宫”牌匾，殿内金光闪烁可见大型金身造像，大殿坐落于高耸的米白色汉白玉石雕台基之上，台基正中镶嵌巨幅“福”字圆形浮雕照壁，左右两侧设对称折线形雕花石栏杆踏道，晴朗蓝天，8K建筑表现图。
