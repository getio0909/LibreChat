prompt_zh: 印度莫卧儿帝国时期红砂岩镂空透雕花窗（Jali）文物正面写实，深色背景，外框环绕一圈十字花形透孔边饰，内部为尖拱形窗框，拱顶饰有莲蕾浮雕，窗格内满布双层立体几何透雕图案，由粗细两级线条交织出繁复的六边形、六角星与五角星放射网格，天然铁锈红色砂岩材质带有细微的浅黄色矿点肌理，正视高保真文物摄影。
