prompt_zh: 中国佛教文化博物馆展厅室内设计，前景是洁白的汉白玉卷云纹雕花栏杆与望柱，左侧陈列一朵巨大的橙黄色透光玉石发光莲花雕件，正面主墙是通顶深色实木藏经书柜，正中央镶嵌巨幅仿古佛陀说法壁画并由顶部射灯照亮，左侧设有发光轮廓的传统壶门拱门与坡屋顶木椽结构，古朴典雅，8k效果图。
