prompt_zh: 近景微距实拍，一座华丽的藏传佛教八吉祥之“双鱼拱法轮”圆形木雕贴金彩绘座屏，外圈围绕红绿金三色立体莲珠框，圆心雕刻一枚镶嵌红绿宝石的金色八辐法轮，左右两条鳞片分明的金色鲤鱼呈弧形跃起对视拱护法轮，上方悬青红莲花宝盖，下方托金色吉祥结与红蓝双层莲花座，底部为镂空描金祥云底座，后方背景隐现释迦牟尼佛木雕圆屏，8K超清。
