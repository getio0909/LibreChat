summary_zh: 陈设于藏式展厅阶梯展台前排的一座藏传八吉祥之“金鱼（Golden Fish / Gaur-Matsya）拱护法轮”圆形实木深浮雕贴金彩绘座屏。在藏传佛教中，双鱼象征着众生超越世间无明苦海、获得解脱自在与坚固活泼的智慧（亦代表恒河与阎摩那河两大圣河）。
