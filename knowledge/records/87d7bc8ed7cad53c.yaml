ai_design_usage: 10m×7.5m展位地面石材铺装边界、入口开间与家具定位尺寸参考
prompt_zh: 建筑室内工程CAD平面尺寸施工图，“03 平面尺寸图”，展示10000mm×7500mm新中式佛教石材展厅的平面布局与精确尺寸标注：地面采用45度斜网格线示意满铺大理石并标注“铺大理石 注意：不锈钢条收边”，中央带有A、B、C、D四个立面方向索引符号，底部D立面标注3310mm长佛台与两侧绿植，右侧A立面标注6580mm主入口、2200mm形象柱（内设服务台）及1000mm次入口，中央布置两张圆形洽谈桌（各4把椅）与右上角长方形中式茶桌（4把椅），红色尺寸线清晰完整，白底专业CAD图纸。
