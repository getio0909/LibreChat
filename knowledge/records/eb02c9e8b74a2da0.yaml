summary_zh: 纯黑背景下展示的铜鎏金五佛宝冠毗卢遮那佛坐像，配精雕放射光芒与双龙戏珠火焰纹镂空黄金大背光，顶悬圆形鎏金莲花华盖与对称金属雕花垂幡。
