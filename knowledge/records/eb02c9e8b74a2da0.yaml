ai_design_usage: 密宗/大乘佛殿宝冠佛主尊造像与繁复金属镂空背光华盖设计、高反差黑底鎏金质感参考
prompt_zh: 铜鎏金五佛宝冠毗卢遮那佛坐像与繁复镂空背光华盖正面特写，高分竖幅构图，纯黑深邃背景，大佛头戴精美五佛高宝冠，胸前佩戴华丽珠串璎珞，面相慈悲威严，结跏趺坐于多层鎏金仰莲宝座上；身后矗立巨大的尖拱形镂空透雕黄金大背光，精细雕刻放射光芒、盘龙戏珠、卷草宝相花与火焰纹；正上方悬挂圆形鎏金莲花华盖并对称垂挂金属雕花幡幢，亚光金与高光金层次分明，极致金铜佛像工艺，8K超高清写实摄影
