ai_design_usage: 极致中轴对称佛龛构图与高光大理石地面完整金色光环倒影参考
prompt_zh: 极致中轴对称构图的现代新中式佛教佛堂实景摄影，竖画幅，正面平视双层内凹亚字形倒圆角折角佛龛背景墙，凹槽隐藏暖黄色LED灯带形成两圈璀璨的金色佛光光环，龛内镶嵌对称V形金纹的“禅境灰蓝”天然大理石，中央摆放敦煌金天然黄玉石高浮雕须弥座大供桌、鎏金伽蓝菩萨坐像与两侧对称鲜花花篮，正前方为明黄色莲花织锦坐垫的实木拜凳，高光抛光的灰蓝色金纹大理石地面如琉璃镜面般清晰完整地倒映出上方金色的折角佛龛光环，天地镜像，庄严神圣，8K超高清建筑室内摄影。
