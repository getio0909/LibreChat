summary_zh: 这是中国建筑史上极具盛名的福建泉州开元寺大雄宝殿（紫云大殿，“百柱殿”）室内顶部八角藻井、悬空仙鹤宝盖与“迦陵频伽”飞天乐伎斗拱的仰视空间场景。
