prompt_zh: 福建泉州开元寺大雄宝殿室内殿顶仰视宏伟场景，朱红色传统木构梁架与层层叠涩的八角盘龙大藻井，斗拱前端精雕出展翅欲飞的“迦陵频伽”妙音鸟飞天乐伎圆雕木像（人身鸟翼，手持宝剑或琵琶法器）；藻井正下方由一根彩绘斜梁悬空挑起一座华丽的八角形木雕鎏金宝盖，宝盖内雕刻多只展翅金鹤与祥云，正下方可见金色大佛头顶肉髻与宝冠，天窗透入神圣光束，超高清古建摄影。
