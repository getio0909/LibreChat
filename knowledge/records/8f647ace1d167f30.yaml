prompt_zh: 新中式药师琉璃光佛殿前厅与壁画展厅室内设计，内外双空间透视构图，右侧透过中式镂空木格扇敞门可见内殿供奉的宝蓝色琉璃药师佛坐像与金身胁侍菩萨，外厅左侧及正面深胡桃木墙面上嵌设多幅竖向发光工笔重彩十二药叉大将与菩萨壁画，方形木柱立于双层雕花石柱础上，顶部为立体木构井字藻井天花，格栅内嵌深邃的宝蓝色琉璃星空背景并悬垂小宫灯，地面满铺高光泽度灰绿色天然纹理奢石大理石大板，镜面倒影清晰，净土琉璃境界，8K渲染。
