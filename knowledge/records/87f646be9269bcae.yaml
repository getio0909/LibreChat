ai_design_usage: 适用场景：传统佛殿/中式佛堂顶部木作垂花罩与挂落细部设计 / 贴金平棊天花材质与构件参考 / 古建木雕构件局部特写生成；推荐搭配：金丝楠木/缅甸柚木本色木作 + 局部24K真金箔贴金 + 2700K超薄暗藏线性灯带
prompt_zh: 中国传统佛教寺庙大殿顶部木构雕刻装饰细节特写，仰视视角，最上方为井字梁分隔的方形贴金盘龙团花平棊藻井天花，四角饰贴金如意角花；中部横贯一道镂空雕刻卷草如意云纹的木质花牙子挂落；下部为三层阶梯式向下悬挑的矩形木框垂花罩，每个竖向节点底部垂挂精致的贴金莲花宝珠垂柱头，深胡桃木色与璀璨金箔结合，内置温暖黄色暗藏灯带，传统苏作木雕工艺，高清细节写实。
