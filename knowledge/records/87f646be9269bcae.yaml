summary_zh: 本图为传统汉传佛教殿堂内部梁架与天花交界处的木雕贴金垂花落挂及平棊藻井局部构件写实特写。该构件通常悬设于主佛龛上方或大殿明间、次间梁枋之下，起到限定神圣空间边界、丰富顶部视觉层次的作用。 构件主体采用纹理细腻温润的深胡桃木/老楠木制作，保留半哑光清漆木质肌理；在平棊井芯、套角雕花、镂空卷草花牙子内缘及垂莲柱头圆珠部位施以24K赤金贴箔工艺，并在叠涩木框内侧暗藏2700K暖黄LED灯带，使木作暖棕与璀璨金箔相互辉映。
