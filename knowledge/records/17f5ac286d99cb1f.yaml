summary_zh: 本图为 2026年春季佛事展南侧核心礼佛区——D 立面图 与 d 剖面图 施工深化详图。完整揭示了现场极具视觉冲击力的“双层亚字形折角倒圆角暗藏灯带佛龛”的精确木作尺寸与隐藏式灯光槽剖面构造。
