ai_design_usage: 双层内凹折角藏光佛龛正立面尺寸链与220mm厚墙体剖面构造参考
prompt_zh: 室内装饰工程CAD立面与剖面施工图，“D立面图”与“d剖面图”，展示新中式佛教展厅双层内凹亚字形折角佛龛背景墙设计，外框为暖米白色木结构贴纸饰面（C13 M9 Y19 K0），双层折角框做倒圆角处理（外圈R:200，内圈R:100）并在侧面凹槽内暗藏黄色灯带，中央镶嵌3600×3100mm天然玉石大板，前方放置石雕须弥座供桌、坐佛与两侧绿植，右下角附220mm厚墙体双层100mm退台藏光d剖面节点详图，带有完整精准的红色尺寸标注（总宽7500mm，总高5000mm）。
