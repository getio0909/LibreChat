summary_zh: 本图专项展示展位顶部“莊嚴寶刹”品牌门头标识与天然玉石金镶玉透光石藻井天花系统。设计将中国传统皇家与大寺大殿的“平綦藻井”构造，创新升级为“实木井字梁+超薄复合透光玉石+金色佛教宝相莲花丝印/蚀刻纹+内藏LED均光灯箱”的现代装配式吊顶案例。
