prompt_zh: 佛教殿堂与展厅顶部透光石藻井吊顶仰拍特写，深胡桃木色阶梯式井字格栅梁架，每个方格内嵌天然金镶玉透光云石薄板，背光点亮后呈现出温暖通透的琥珀金色天然石材纹理，每块石板正中饰有精致的金色八瓣宝相莲花曼荼罗图案；顶部上方安装“莊嚴寶刹”冰蓝色发光书法大字与红色篆书印章，下方衔接金镶玉大理石竖向拼接墙面，右侧延伸深木色挑檐梁与白色格栅吊顶，光影温暖神圣，8K室内建筑摄影。
