prompt_zh: 超高清现代极简禅宗佛教展览空间与茶道冥想室设计，广角中轴对称透视，正面胡桃木背景墙中央设有一轮巨大的禅宗“一圆相”圆形内凹造型，圆环内壁暗藏温暖柔和的环形光带，宛如满月；圆相正下方设一张低矮厚重的实木禅修茶台，摆放极简白瓷茶具，台前与台后对称布置深褐色方形打坐蒲团；背景墙左右两侧对称陈列一对大型黑色粗陶花器，插有苍劲禅意枯枝；两侧墙面为竖向原木格栅与透光障子门，顶部木格栅吊顶嵌两条线性灯带，空灵纯粹，8K大师级建筑渲染
