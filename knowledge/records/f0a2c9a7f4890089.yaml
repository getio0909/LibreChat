ai_design_usage: 适用场景：佛堂/展厅背景墙连续几何石材浮雕贴图生成 / 鱼鳞叠瓦纹与如意宝相花结合的CNC雕刻路径参考 / 暖金色奢石浮雕肌理迁移；推荐搭配：米黄大理石/黄砂岩CNC三维浮雕拼板 + 局部古铜金/香槟金擦色处理
  + 侧向或顶部2700K洗墙灯光凸显凹凸肌理
prompt_zh: 佛教空间装饰用暖金色大理石浮雕花纹图案特写，满幅无缝连续肌理构图，采用斜向交错层叠的鱼鳞叠瓦状方形模数拼贴设计，每个弧角方形石材单元内部均以浅浮雕雕刻一朵圆润的如意云头宝相团花与四瓣花蕊，单元交接处点缀四角小花瓣；石材呈现温润华贵的暖金米黄色泽，在暖光照射下展现细腻的凹凸立体光影与秩序美感，高清材质贴图特写。
