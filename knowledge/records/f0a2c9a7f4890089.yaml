summary_zh: 本图为一款应用于佛教殿堂主背景墙、佛龛背板或穹顶内壁的“鱼鳞叠瓦状如意宝相花”连续几何石材浮雕肌理板写实特写。设计将中国传统古建筑及铠甲中的“叠胜纹/鱼鳞纹”与佛教“如意云头、宝相团花”巧妙结合，形成极具律动感与华贵金石质感的装饰面层。
  材质采用暖金米黄色大理石（如金碧辉煌、埃及米黄、黄洞石）或表面施以仿金箔古法擦色工艺的浮雕砂岩板，在暖黄色侧光照射下，凸起的阳纹受光面泛出柔和璀璨的琥珀金光，凹陷的阴纹暗部则呈现温润的焦糖棕色调，立体浮雕质感极强。
