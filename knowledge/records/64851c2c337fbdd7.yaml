prompt_zh: 传统佛教寺庙全木作大殿内部左侧通道纵深透视场景，深红棕色实木宽板地面，画面右侧为气势恢宏的五开间重檐红木透雕大佛龛与镶嵌鎏金荷花浮雕的木护栏，龛前整齐一字排开五张红木雕花供桌（摆放红烛与供果）及五对米色方形拜垫，画面中央一列粗壮的红木大圆柱，柱脚包镶精美的鎏金莲瓣束腰铜箍并立于青石双层莲花柱础上，左侧墙面下层为万字纹木格栅隔扇，上层为精湛的深浮雕木雕佛教故事壁画，远端山墙内嵌发光千佛龛，顶部为密集的传统方格木藻井，古朴庄严，8K建筑渲染
