prompt_zh: 传统佛教寺庙孔雀明王殿内部供桌与佛龛近景，正面中轴对称构图，暖红棕色几何拼花实木地板上并列摆放三个蓝黄红彩绘莲花圆形蒲团，中间两根粗壮的深色方形木柱正面镶嵌古铜鎏金盘龙浮雕长板，下承精雕汉白玉方形莲花须弥座柱础，柱间设中式红木雕花大供桌，摆放鲜果、白瓷插花与香炉，后方为金碧辉煌的唐破风弧形顶多层贴金斗拱佛龛，龛内供奉骑乘开屏孔雀的四臂孔雀明王彩绘金身坐像，两侧竖条木格栅前对称摆放汉白玉圆璧摆件，华丽庄严，8K建筑渲染
