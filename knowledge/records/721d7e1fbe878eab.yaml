prompt_zh: 安藤忠雄风格现代极简清水混凝土大佛殿室内场景，低角度中轴对称框景构图，前景为幽暗深邃的多边形折板清水混凝土拱形隧道，透过拱门框景望向内部明亮的圆形大厅，一尊巨大的浅灰白色花岗岩石雕坐佛端坐于石雕莲花宝座之上，拱门恰好遮挡佛像头部仅露出宽厚胸膛、流畅衣纹与禅定手印，顶部露天圆洞倾泻神圣的自然天光，下方为八级石材台阶与圆形石质礼拜台，极致纯粹的光影与几何建筑美学，8K建筑摄影
