summary_zh: 安藤忠雄“头大佛殿”低视角框景实景，从幽暗的折板清水混凝土拱形隧道望向圆形大厅，拱门裁切遮挡佛首仅露出沐浴在顶部自然天光中的浅灰花岗岩大佛胸腹、禅定手印与石莲座。
