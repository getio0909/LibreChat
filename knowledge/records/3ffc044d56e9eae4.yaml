summary_zh: 本图为新中式素白石材佛教展厅内核心“千佛三圣浮雕展示墙”的立面场景（对应第 09 张左侧长墙）。设计将传统石窟的“千佛龛”概念转化为高度秩序化、模数化的现代建筑表皮，兼具大型功德认捐佛龛墙与佛教雕塑艺术背景墙双重属性。
  整面展示墙通体采用暖白色细粒汉白玉或高品质白砂岩/人造透光石通过数控CNC精雕而成，表面呈柔和细腻的哑光石材肌理；每个大小圆拱龛底部或内壁暗藏3000K暖黄洗墙灯带，将纯白石雕造像烘托得圣洁温润；下部墙裙采用浅灰米色大理石并雕刻一圈连续宝相莲花浮雕带，地面为灰绿色系大理石。
materials:
- 汉白玉
- 白砂岩CNC雕刻
- 背光灯带
