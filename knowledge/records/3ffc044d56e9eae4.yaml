ai_design_usage: 适用场景：现代素白石材千佛墙/功德墙立面设计 / 大小拱龛模数化嵌套构图参考 / 汉白玉CNC雕刻背景墙生成；推荐搭配：米白汉白玉/白砂岩整墙CNC雕刻 + 汉白玉三圣立像与千佛小坐像 + 龛底嵌入式3000K微型防眩洗墙灯条
  + 浅灰石材浮雕墙裙
prompt_zh: 现代新中式佛教展厅素白石材千佛雕像展示墙场景，整面高墙由暖白色汉白玉石材精雕而成，密布横竖整齐排列的圆拱形内发光小佛龛，每个小龛内供奉一尊白玉小坐佛；墙面中央并列嵌入三个跨越多格的大型圆拱形壁龛，三座大龛内分别供奉三尊姿态优雅、脚踏祥云莲花座的汉白玉立姿佛与菩萨雕像，内置柔和温暖的黄色洗墙背光；墙面底部设有连续莲花浮雕纹带与浅灰色大理石高踢脚线，纯净圣洁，现代极简禅意建筑设计。
