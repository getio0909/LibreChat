prompt_zh: 正面立面摄影，一座恢弘华丽的藏式三联多宝格木雕佛龛大展柜，深紫红色红木柜体配明黄色佛龛内衬，顶冠为五连拱龛与瑞兽浮雕，正中主佛龛雕刻繁复的六拏具雪狮白象背光，两侧立柱浮雕彩绘天女与宝瓶柱，腰线横列立体彩绘八吉祥徽章，下层抽屉镶嵌青绿色玉石拉手底板，底部柜门精雕金翅大鹏鸟、开屏孔雀与白象，极致传统藏式木雕彩绘工艺，8K高清。
