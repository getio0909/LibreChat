summary_zh: 正面实景拍摄的一座大型藏式三联一体多宝格佛龛博古展柜（Tibetan Buddhist Multi-Niche Shrine & Display Cabinet）。整座大柜集成了上部五连拱冠顶、中部三段式多层亮格佛龛、中部八吉祥腰线以及下部多抽屉储物底柜，是藏传佛堂中用于供奉主尊与圣物、收纳经书唐卡与法器的核心定制大家具。
