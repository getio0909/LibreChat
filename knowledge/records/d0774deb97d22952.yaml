ai_design_usage: 日式寺院本堂/高端日式佛堂空间设计参考、原木门框与金箔内殿冷暖材质对比构图、栏间高浮雕金漆木雕提取
prompt_zh: 日本净土真宗寺院本堂内阵供奉区实景，一点透视框景构图，前景为温润的浅黄色日本桧木梁柱框架与榻榻米地面，门楣正中悬挂“歸命山”竖向牌匾，两侧栏间镶嵌极其繁复的纯金高浮雕云纹透雕木花板，黑漆镶金折叠门向内敞开，露出内部金碧辉煌的内阵空间，中央为纯金箔打造的宫殿式重檐佛龛，供奉阿弥陀佛立像，下方为黑漆描金须弥坛、华丽供具与松枝插花，前景正中摆放一只黑色铜钵磬，庄严辉煌，日本建筑摄影，8K
