prompt_zh: 博物馆展陈的中国潮州金漆木雕多层镂空通雕花板特写，安装在黑色木底座上；整块樟木采用极致繁复的三层立体透雕技法，雕刻出生动的螃蟹、弯曲交错的芦苇水草、垂挂饱满的颗粒谷穗、翻滚的螺旋海浪以及隐藏在深层水草后的游鱼，表面满贴纯正赤金箔，在顶光照射下呈现丰富的明暗金色金属层次与深邃立体镂空感，超高清非遗文物微距摄影。
