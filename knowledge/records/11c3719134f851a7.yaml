summary_zh: 本图为施工图册第 2 页——02 平面位置图，由“展馆宏观区位落位图（左）”与“展位微观 3D 垂直鸟瞰效果图（右）”两部分构成，全面阐明了 C5 T026 展位（75m²） 在展馆中的人流朝向与内部功能分区逻辑。
