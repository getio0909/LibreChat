prompt_zh: 展览工程设计汇报展板“02 平面位置图”，左侧为展馆CAD平面导览图并用红框高亮标注C5 T026展位（75平方米，10m×7.5m，毗邻佛堂供具区），右上角标注中文“整体木结构贴纸饰面 两面开口展台 面积：10m*7.5m
  展位号：C5 T026”，右下角为高清3D顶视垂直鸟瞰渲染图，展示满铺大理石地面的展厅内部布局：底部为佛龛供桌与绿植，左侧为带9盏洗墙射灯的巨幅石材背景墙，中央摆放两张白色现代圆形洽谈桌（各配4把白椅），右上角为中式实木茶桌椅与迎宾接待台，专业展览设计排版。
