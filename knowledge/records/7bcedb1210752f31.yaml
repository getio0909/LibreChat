ai_design_usage: 壁画与透光千佛格交替排布的禅修大殿斜视图、高处二十诸天悬塑廊带与贴金方格藻井群设计参考
prompt_zh: 大型佛教寺庙禅修礼佛大殿内部斜向广角场景，暖灰褐色哑光大理石地面上整齐排列多排米黄色方形禅修蒲团，中景矗立深棕色实木大圆柱配浅灰石雕鼓形柱础，四周墙面采用独特的设计：大幅中国传统工笔重彩菩萨罗汉壁画与金色背光方格窗（每个小方格内供奉一尊洁白的汉白玉小坐佛）交替排列，墙面高处靠近天花处环绕一圈立体彩绘佛教诸天人物悬塑廊带，顶部满布金碧辉煌的方形贴金雕花发光藻井，中央设一座多层圆形彩绘斗拱大藻井，庄严绚丽，8K建筑渲染
