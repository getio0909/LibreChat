summary_zh: 本图为 2026年春季佛事展（C5 T026）北侧副迎宾面——B立面图 施工深化图。完整定义了展位 7.5 米宽北向敞开门头的造型比例，并提供了从北侧副入口向南平视展厅内部（正对 D立面叠级佛龛与石雕供桌）的标准正立面透视关系。
