ai_design_usage: 7.5米跨度北侧敞开副入口门头CAD立面与内部佛龛正视轴线参考
prompt_zh: 展览工程CAD彩色立面施工图，“B立面图”，展示7500mm宽、5000mm高的新中式佛教石材展位北侧副入口敞开门头正立面：暖米白色木结构门架（CMYK色值C13 M9 Y19 K0）配传统中式几何折角装饰框，顶部横梁居中安装“莊嚴寶刹”PVC雕刻书法字与红印章，下方为7150mm宽无柱大跨度敞开入口（左柱宽150mm，右墙厚200mm），透过门洞正面平视展厅内部的双层折角藏黄光佛龛背景墙、石雕须弥座佛台、左侧迎宾接待台与右侧白色圆形洽谈桌椅，带有精确的红色工程尺寸标注线，白底专业CAD图纸。
