ai_design_usage: 适用场景：摩崖石窟风粗犷自然面石材背景墙设计 / 自然劈裂灰麻石嵌发光金佛龛反差美学参考 / 现代高端佛教艺术馆与石材展厅空间生成；推荐搭配：深灰自然劈裂面（蘑菇石）花岗岩背景墙 + 白色圆拱内发光壁龛配锻铜贴金坐佛
  + 爱马仕灰高光镜面大理石地面 + 透光大悲咒经文玻璃屏风
prompt_zh: 极具艺术感的现代佛教石材佛像墙展厅室内全景，正面中轴构图，主背景墙采用深灰色粗犷自然劈裂面（蘑菇石）花岗岩砌筑，模拟摩崖石窟肌理；粗糙灰石墙面上错落开凿出数十个圆拱形暖白内发光小佛龛及四个大型圆拱主佛龛，每个龛内均供奉一尊璀璨的纯金结跏趺坐佛像，粗砺灰石与耀眼金佛形成强烈对比；石墙下部为墨绿色大理石台基，两侧对称摆放白色镂空石墩与金色圆柱网罩落地灯；地面铺设光洁如镜的深灰褐色云纹大理石，清晰倒映整面发光佛龛墙；左侧门洞通往白色莲花宝座厅，右侧门洞可见发光的《大悲咒》汉字经文光幕与黄色蒲团，8K超高清建筑渲染图。
