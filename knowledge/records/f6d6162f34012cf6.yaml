prompt_zh: 佛教寺庙万佛护法大殿内部右侧斜向广角透视，深青灰色石板地面，画面左前方主坛上供奉铜鎏金坐佛，背后是璀璨的双圈圆形金色太阳放射状佛光背板与胁侍菩萨，最左侧墙面镶嵌大幅发光重彩佛教壁画，画面右侧整面高墙密布红底发光小佛龛（万佛墙），墙面底部筑有通长的洁白汉白玉精雕莲花须弥座台基，台基上等距开启五个大型金色火焰背光神龛，供奉五尊威武高大的铜鎏金护法天王立像，顶部为弧形木椽吊顶、多层贴金斗拱与双层圆形红金宫灯，8K超清建筑渲染
