prompt_zh: 超高清现代中式观音殿室内供奉空间设计效果图，广角中轴对称透视，正中央供奉一尊洁白的汉白玉观音菩萨坐像，背后为海棠花轮廓内嵌暖金色背光的《般若波罗蜜多心经》全文立体汉字浮雕背景墙；佛像前方摆放深色红木雕花供桌与三个明黄色圆形拜垫，供台左右两侧对称矗立一对汉白玉底座铜鎏金六角重檐宝塔落地宫灯与中式博古架；大殿两侧墙面对称悬挂八幅工笔重彩佛教菩萨立轴挂画，顶部为红木方格吊顶并在中心镶嵌圆形金色莲花发光藻井，高光灰褐色大理石地面倒影清晰，庄严殊胜，8K建筑渲染
