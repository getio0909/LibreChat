prompt_zh: 8k超高清佛教金身财宝天王祈福大殿室内效果图，广角斜向透视，大殿正中央是一座温润剔透的巨型青白玉仰莲宝座，宝座上供奉金光璀璨的金身财宝天王坐像，怀抱聚宝盆、四周堆满金元宝，背后立有挂满元宝铜钱的金色摇钱树与巨型莲瓣背光，主尊两侧对称开设鎏金八吉祥雕花拱门，环抱式的弧形高墙密布暖金发光万佛小龛并镶嵌圆形汉白玉浮雕圆盘，顶部为圆角叠级金色藻井，深褐色镜面大理石地面带水波纹拼花，极致奢华庄严。
