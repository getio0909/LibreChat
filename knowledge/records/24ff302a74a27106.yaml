prompt_zh: 中式佛教寺庙入口广场与天王殿建筑景观效果图，中轴对称构图，前景宽阔的花岗岩铺装广场中央镶嵌巨大的圆形吉祥几何浮雕地景石雕圆盘，两侧栽种造型迎客松并设石凳，中景正中是一座青瓦重檐歇山顶传统大殿，匾额书写“天王殿”，敞开的大门内可见金身弥勒佛坐像，殿门前左右对称伫立一对威武的大型汉白玉石狮子与雕花须弥座，大殿两侧对称延伸出现代新中式弧形木格栅游廊，右后方耸立一座多层佛塔，晴朗蓝天，8K建筑景观渲染
