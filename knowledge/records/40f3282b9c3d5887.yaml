prompt_zh: 超高清横幅文物摄影，一件古老的中东伊斯兰风格木质嵌骨与乌木微缩镶嵌装饰横板（Marquetry Frieze），粗糙风化的深褐色古木板上，正中央镶嵌一个精密的同心圆曼陀罗放射圆盘，四周环绕四个菱形与对角网格方框；左右两侧对称排列各五个由白色骨雕小立柱支撑的圆拱形盲券，拱券内部填满极致微小的象牙白与深褐色菱形马赛克点阵纹样，工艺精湛绝伦，历史包浆浓郁。
