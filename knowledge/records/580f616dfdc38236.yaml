summary_zh: 药师佛十二大愿主题暗调沉浸式祈福佛堂场景，两侧高墙密布琥珀暖光圆拱形祈福小龛，远端莲花尖拱主龛供奉立佛，倾斜巨柱上镌刻发光《药师经》第四、六、九、十大愿经文。
