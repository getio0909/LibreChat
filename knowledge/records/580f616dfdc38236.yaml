ai_design_usage: 暗调沉浸式药师佛祈福空间设计、药师经十二大愿发光经文斜柱创意与千佛光明灯墙参考
prompt_zh: 现代暗调沉浸式药师佛主题祈福佛堂室内设计，深邃的一点透视构图，全空间采用深胡桃木打造，左右两侧高墙满布成百上千个散发琥珀色暖光的圆拱形祈福小佛龛，远端正中设双层莲花尖拱发光大佛龛，内供奉一尊庄严立佛，空间内设有向内倾斜的深色巨型斜柱，柱面上竖向镌刻并发出金色光芒的《药师经》十二大愿汉字经文，顶部为深色井字格栅吊顶配金色回形暗藏灯带，深褐色哑光石材地面映出温暖金光倒影，神秘庄严禅意氛围，8K超高清渲染。
