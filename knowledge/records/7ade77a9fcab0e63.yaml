ai_design_usage: 高端寺院上客堂、禅修酒店居士套房、新中式别墅禅意卧房室内软硬装一体化参考
prompt_zh: 超高清现代新中式禅意卧室与茶室套房室内设计效果图，侧向广角透视，右侧为暖胡桃木框架双人床，米色软包床头背景配两侧竖向木格栅与暖光床头灯；左侧及前景为禅意茶席区，摆放新中式实木罗汉床沙发、方形实木茶几与白瓷茶具，后方留白墙面悬挂一幅圆形水墨山水禅画，画下设中式条案与绿植；左侧为半通透木格栅推拉门，顶部为极简无主灯暗藏暖光灯带吊顶，地面铺设哑光浅灰色石材地砖，静谧雅致，8K室内设计渲染
