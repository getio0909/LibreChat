prompt_zh: 老挝传统佛教寺庙室内壁画墙面场景，下半部为涂刷深邃黑漆的古老墙面，上面用纯金箔绘满精致的东南亚佛教本生经故事图卷，包含多层尖顶佛殿、盘腿说法的佛陀、众多身穿传统服饰的朝拜人物、热带棕榈树与多头那伽神蛇；上半部建筑横梁为深朱红色漆底，饰有连续的金色吉祥盘长结与莲花圆盘图案，底部露出黑色古木门局部，质感斑驳古朴，博物馆级高清文化摄影。
