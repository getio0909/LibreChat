ai_design_usage: 适用场景：大型寺院圆通宝殿/观音殿空间设计 / 千瓣金莲穹顶藻井与汉白玉立像构图参考 / 佛殿大理石水刀拼花地面设计；推荐搭配：四川宝兴汉白玉大型观音造像 + 贴金千瓣莲花GRG/木雕穹顶 + 莎安娜米黄配多色玉石水刀拼花地面
  + 暖橙色背光万佛墙
prompt_zh: 宏伟的中国佛教寺庙观音殿室内场景，低角度仰视对称构图，大殿中央多层木质台基与汉白玉莲花宝座上矗立一尊高大的汉白玉多臂千手观音立像；正上方为震撼的圆形千瓣贴金莲花层叠穹顶藻井，每片莲瓣散发温暖金光；后方弧形墙面满布橙黄色发光的方格万佛墙；前景两侧矗立粗壮的米白大理石圆柱，柱底包嵌红棕色浮雕铜套与汉白玉莲瓣柱础；高光米黄大理石地面镶嵌精美的八角莲花曼荼罗水刀拼花与彩色莲花波打线，金碧辉煌，圣洁庄严，8K超高清渲染。
