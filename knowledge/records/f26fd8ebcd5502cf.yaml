summary_zh: 本图以极具创意的柜底垂直90度仰视视角，拍摄展位两侧“透明亚克力格栅千佛发光墙”的局部阵列。由于高透水晶亚克力隔板在纯白漫射背光下几乎隐形，一尊尊橙黄琥珀色的琉璃/树脂佛像宛如凌空悬浮于无垠白光净土之中，展现出极高的现代佛教装置艺术美感。
