summary_zh: 【图中可见】深色木梁架下，正中长案与前方小供桌沿中轴布置，两侧成排木扶手椅，案前挂红色龙纹织物，白墙上悬画像和书法。【来源著录】The Wu Family Reception Hall, early 17th century.jpg；文化或地点依据：来源说明为原处苏州东洞庭、今东山附近的吴氏厅堂，馆内复原。来源题名为early
  17th century，正文却记early 1700s，断代有冲突，本条不作确定年代。
