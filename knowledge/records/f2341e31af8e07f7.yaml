prompt_zh: 以所附实物照片作形态参考，竖长屏风残板以朱红为底，人物与车舆分层排列，并有黄色文字栏；中部纵向接缝、上缘残缺和局部漆层脱落清楚可见。重点保留可辨识的轮廓、纹样疏密与表面色差，用于传统家具比例、木作雕饰与构件连接参考；此提示词为设计演绎，不作为年代、材质鉴定或工程尺寸依据。
