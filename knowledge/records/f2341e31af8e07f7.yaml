summary_zh: 【图中可见】竖长屏风残板以朱红为底，人物与车舆分层排列，并有黄色文字栏；中部纵向接缝、上缘残缺和局部漆层脱落清楚可见。【来源著录】彩绘人物故事漆屏, 2024-01-06.jpg；文化或地点依据：Commons 说明明确为司马金龙墓出土漆屏，分类为北魏漆器；大同市政府的名城保护规划说明将石家寨司马金龙墓列入本市御东墓葬保护区，故按山西大同归入中国北方。
