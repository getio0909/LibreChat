summary_zh: 本图是一幅严格遵循中轴对称礼制的寺院五开间大型木雕贴金祭坛（祖师堂、往生堂或功德牌位堂）正面全景。空间通过连续五个规整开间的重檐木构神龛与五组一字排开的供桌礼器，构建出极其肃穆、井然有序的宗祠与佛教追思祭祀空间。 整体采用“深棕红木
  + 赤金贴箔 + 暖黄原木 + 朱红点缀”的庄重配色。后方高大神龛与六根立柱采用深胡桃木/老红木材质，在柱头、柱中箍带、横披额枋及下碱纹饰处大量施以高光24K贴金箔工艺；前方五张供桌采用色泽略浅的暖棕胡桃木，桌裙浮雕卷云如意纹；供桌上是温润的白瓷高足果盘、鲜红苹果、朱红蜡烛与古朴的…
materials:
- 雕花红木
- 金箔
