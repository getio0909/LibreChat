ai_design_usage: 适用场景：寺院功德堂/祖师堂/往生堂正面立面设计 / 传统五开间木雕贴金神龛与五供陈设参考 / 中轴对称礼拜空间构图控制；推荐搭配：深色缅甸花梨/酸枝木贴金大龛 + 浅胡桃木雕花供桌 + 青铜香炉与高足白瓷供盘
  + 深棕实木地板
prompt_zh: 中国传统佛教寺庙五开间木雕贴金功德堂祭坛正面全景，严格中轴对称构图，后方由六根深红木贴金圆柱分隔出五个神龛开间，每间顶部饰有贴金双龙戏珠透雕花板与金色垂珠帘，龛内供奉牌位，两侧背景墙为密集排列的三角形暖光小佛龛；祭坛前方一字排开五张中式雕花实木供桌，每张供桌上对称摆放青铜三足香炉、一对红烛和两盘红苹果，每桌前各置一对米黄色方形拜垫，深棕色木地板，庄严肃穆，8K超高清室内效果图。
