prompt_zh: 大型山地佛教文化园与生态人文纪念陵园高空鸟瞰全景效果图，画面左中景矗立一尊巨型露天金身释迦牟尼坐佛，端坐于多层白色石雕莲花宝座上，左下角为阶梯式金字塔地宫与白色覆钵塔，大佛后方整座翠绿山坡采用扇形生态梯田设计，整齐排列无数祈福纪念碑林与苍翠松柏，粉色樱花步道蜿蜒其间，山腰设有摩崖石窟造像与中式重檐亭阁，山巅环列五座洁白的覆钵佛塔，山谷云雾缭绕、白鸽飞翔，人间净土仙境氛围，8K景观鸟瞰图。
