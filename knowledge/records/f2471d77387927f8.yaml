ai_design_usage: 石雕须弥座肥厚双层仰莲瓣刀工肌理与景深特写生图参考
prompt_zh: 天然五彩玉石雕刻莲花须弥供坛侧面微距特写，浅景深摄影，前景聚焦一排饱满肥厚的双层仰莲花瓣高浮雕，莲瓣弧度浑圆立体，瓣尖微翘，石材表面高光水磨抛光，展现出青灰、蜜蜡黄、铁锈红交织的天然玉石肌理与温润油脂光泽；下层束腰与底座雕刻卷云纹与覆莲瓣，左侧边缘可见贴金宝座与蓝宝石镶嵌细节，背景柔和虚化出彩绘佛像、青绿背光与敦煌金石雕基座，地面为镜面黑白金大理石拼花，光影细腻，8K大师级微距摄影。
