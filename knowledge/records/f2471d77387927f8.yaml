summary_zh: 本图为展位中央大型玉石须弥供坛（佛台）侧面双层仰莲瓣的高浮雕/立体圆雕工艺微距特写。通过纵向浅景深顺光/侧逆光拍摄，重点展现庄严宝刹（Alitan Stone）在厚重整石雕刻上的精湛刀工与天然玉石丰富的色彩变幻。
