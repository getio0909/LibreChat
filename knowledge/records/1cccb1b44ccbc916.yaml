summary_zh: 【图中可见】岩壁浮雕以中央高冠长须坐像为轴，周围人物分上下层排列，红白蓝色残留涂层强调衣褶与边框；下缘另有人物半身、圆形花状开孔和卷云。【来源著录】Dazu Rock Carvings (54068196906).jpg；文化或地点依据：来源明确重庆大足宝顶山石刻；本条按整幅崖壁浮雕及边饰编入石刻纹样，未将来源对整个石刻群的笼统年代套用为本龛年代。
