prompt_zh: 以所附实物照片作形态参考，岩壁浮雕以中央高冠长须坐像为轴，周围人物分上下层排列，红白蓝色残留涂层强调衣褶与边框；下缘另有人物半身、圆形花状开孔和卷云。重点保留可辨识的轮廓、纹样疏密与表面色差，用于石雕纹样单元、边缘与层次构成参考；此提示词为设计演绎，不作为年代、材质鉴定或工程尺寸依据。
