ai_design_usage: 寺院卧佛殿/涅槃堂室内空间设计、大型石雕卧佛展陈照明与光纤星空顶搭配参考
prompt_zh: 大型室内佛教涅槃堂与汉白玉石雕卧佛展示空间，横幅广角构图，正中央长条形黄色锦缎须弥佛坛上安奉一尊巨大的白色大理石/汉白玉释迦牟尼佛右胁吉祥卧像，右手支头，神态慈祥安宁，足踏石雕莲花；背后为暖金黄色肌理浮雕背景墙，并设有弧形阶梯状暗藏暖光背光带；天花板为深邃的黑色夜空光纤满天星吊顶，数束精准暖光射灯照亮洁白的卧佛，佛坛前摆放百合鲜花与供果，静谧神圣，8K超清空间摄影
