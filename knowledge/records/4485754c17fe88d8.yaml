prompt_zh: 室内全景实景摄影，一座庄严华丽的藏传佛教佛堂展柜陈设空间，天花板为实木梁架与金色圆形曼陀罗藻井吊顶，正面整墙为十一佛冠顶三联木雕大佛龛，明黄色内龛正中供奉释迦牟尼金佛，两侧分龛供奉度母与护法像，双层阶梯供台上整齐排列十六枚黑底彩绘八吉祥圆牌、绿松石高足供杯与一排黄铜净水碗，下部八扇柜门内嵌浅金色几何万字纹织锦底板与圆形五欲妙供木雕徽章，浅色人字拼木地板，8K超清。
