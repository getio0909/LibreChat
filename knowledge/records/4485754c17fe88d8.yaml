summary_zh: 一座顶面带彩绘曼陀罗藻井、立面设“十一佛冠顶三联大佛龛”且满配密宗仪轨供品的藏传佛教标准佛堂展厅空间场景。如果说第 19 项展示了空置状态下的十一佛冠大佛柜，那么本图则完美展示了同类十一佛冠大佛柜在装入主尊佛像、点亮龛内灯光、摆满全套铜供水碗与八宝圆牌、并配合顶面坛城藻井后的完整空间落成效果。
