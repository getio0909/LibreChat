summary_zh: 基于第 12 项三层阶梯展台母本，通过 AI 材质重构生成的“紫檀红木攒框 + 豆青玉底板 + 满嵌绿松石红珊瑚”宫廷级三层坛城装饰柜。该设计将原本纯木雕的飞天与八吉祥转化为极具乾隆宫廷“百宝嵌（玉石镶嵌）”风格的木玉复合工艺品。
