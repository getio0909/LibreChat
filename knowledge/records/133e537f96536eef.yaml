prompt_zh: 室内实景渲染，一座奢华的紫檀红木嵌青玉三层阶梯式佛教坛城装饰柜，深紫红色红木框架配古铜包角，三层台面与柜门背板全部镶嵌温润的豆青色和田青玉，青玉底板上叠加红木镂空雕花，顶层与中层镶嵌成排的绿松石、红珊瑚与青金石圆珠，底层柜门为青玉套雕海棠形宝相花开光，置于藏式地毯上，极致百宝嵌工艺质感，8K超清。
