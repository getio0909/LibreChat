prompt_zh: 现代禅意原木风佛堂兼茶室一体化室内空间，主区正中供奉一尊洁白的汉白玉观音菩萨坐像，背后是海棠框发光木雕《般若波罗蜜多心经》背景墙，观音像上方悬挂华丽的金色镂空雕花华盖与垂幢，前方摆放浅木色雕花供桌、草编地席与两个莲花纹黄色圆蒲团，两侧立木质落地灯，左侧临窗设抬高木地台茶室区域，摆放实木长茶桌、木凳与迎客松盆景，浅灰色大理石地面，原木格栅天花，温暖阳光洒入，8K效果图
