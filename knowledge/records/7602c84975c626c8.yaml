ai_design_usage: 适用场景：单尊石雕/玉雕自在观音坐像造型生成 / 镂空火焰纹大背光与山石海浪座设计参考 / 中式佛堂壶门背光佛龛单品植入；推荐搭配：米黄玉/汉白玉/黄砂岩整料精雕菩萨像 + 深胡桃木壶门形贴金角花壁龛 + 龛内水墨淡彩背板配3000K隐藏背光灯带
prompt_zh: 供奉于中式红木雕花壶门壁龛内的米黄色石雕自在观音菩萨坐像正面特写，菩萨头戴宝冠，面相慈悲温润，身披天衣璎珞，呈右腿曲起、左腿下垂踏莲台的半跏趺自在坐姿，左手当胸结说法印；身后为精雕细琢的双层镂空火焰纹与卷草纹舟形大背光，身下为翻涌的海浪山石与仰莲宝座；壁龛外框为深棕色红木配贴金角花，龛内水墨背景板边缘散发温暖柔和的白色背光，前方实木供桌上摆放红烛与青瓷三足香炉，细节精湛，高清写实。
