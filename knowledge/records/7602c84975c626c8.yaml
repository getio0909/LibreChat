summary_zh: 本图为供奉于中式红木壶门壁龛内的单尊米黄色石雕（或黄玉/米黄砂岩）“水月观音/自在观音（或大势至菩萨）”半跏趺坐像写实特写。造像融合了宋代木石造像的潇洒写意与明清宫廷造像的繁复背光工艺，法相慈悲柔美、体态安详自在。 造像主体、背光及海浪山石底座均采用色泽温润细腻的暖米黄色玉石/细砂岩一体精雕，呈现柔和的油脂光泽；外围壁龛框架采用深棕色胡桃木/红木制作，四角镶嵌贴金镂空角花；龛内背板为浅米灰色水墨云水纹画板，并沿壶门内缘暗藏暖白洗墙灯带；前方供桌上点缀朱红蜡烛与青白釉三足瓷香炉。
