summary_zh: 本图为上述奢华佛教主殿中央“七宝莲池须弥坛城”的中近景正面特写场景。镜头越过外围巨柱，直接聚焦于汉白玉须弥坛城、护法金刚力士、立体荷花造景与上方垂悬的巨型贴金宝盖，完整展现了主佛坛的石雕、木雕与贴金工艺细节。 近景地面清晰展现出深咖色与黑色交织、带有白色闪电纹理的顶级高光镜面大理石质感；坛城外围矮墙采用暖棕红玉/玛瑙纹大理石砌筑池岸，池内铺设翠绿色石雕荷叶与粉红莲花瓣；中央踏步、望柱与栏板采用纯净无瑕的一级汉白玉；两侧护法神将、中央覆斗形宝座及顶部垂悬华盖均采用辉煌的24K贴金工艺。
