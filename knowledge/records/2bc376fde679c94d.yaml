ai_design_usage: 适用场景：大殿中央汉白玉须弥座坛城细部设计 / 佛坛前立体荷花池与护法金刚立像陈设参考 / 贴金覆斗形佛座与垂悬宝盖组合生成；推荐搭配：一级汉白玉精雕台阶与栏板 + 翠绿玉石/彩石立体荷叶莲花池 + 锻铜贴金护法神将与覆斗佛座
  + 深啡网镜面大理石地面
prompt_zh: 佛教寺院大殿中央汉白玉须弥座佛坛近景正面特写，严格对称构图，前景为高光深咖色带白纹的镜面大理石地面；中央为五级汉白玉雕花踏步与栏杆，台阶左右两侧设有立体翠绿荷叶与粉色莲花装饰的莲池台基，其上对称伫立两尊威武的贴金护法金刚神将雕像；坛城中央为金碧辉煌的覆斗形高台，下层壶门龛内供奉金色千手观音，上层供奉金身坐佛与蓝金彩绘背光；正上方自八角金碧藻井垂下一座巨大的多层圆锥形贴金华盖，四壁环绕暖黄发光万佛墙，雕工精湛，富丽庄严。
