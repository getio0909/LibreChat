summary_zh: 现代原木风万佛墙祈福千佛殿室内场景，采用温润浅色桧木梁柱与回纹护墙板，四周高墙密布模块化发光小佛龛并嵌设两座大型主佛龛，地面铺设深灰黑带白筋高光大理石。
