ai_design_usage: 现代寺院万佛殿与千佛堂室内设计、高密度模块化发光佛龛墙及深色大理石地面搭配参考
prompt_zh: 现代原木风格佛教寺院万佛殿千佛堂室内设计，广角对角线透视构图，空间梁柱与护墙板采用温润的浅黄色桧木打造，粗壮木柱上下两端雕刻贴金莲花纹，四周高墙密布成千上万个整齐排列的发光小佛龛，每个小龛内供奉一尊金色小坐佛，右侧墙面万佛阵列中嵌入两个大型方形主佛龛供奉彩绘金身释迦牟尼佛，顶部为原木井字梁配中式花格发光灯盘，地面铺设深灰黑色带白筋纹理的高光抛光大理石，倒影清晰，金碧辉煌而禅意井然，8K渲染。
