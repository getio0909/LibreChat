ai_design_usage: 殿堂级私人佛堂室内设计全景参考（ControlNet Depth/Lineart） / 坛城藻井+华盖吊灯+蓝底佛龛色彩搭配模板
prompt_zh: 室内建筑设计摄影，1:1正方形中轴对称一点透视构图，一座奢华庄严的藏传佛教室内佛堂供奉空间，天花板为深色实木雕花井字梁与中央巨型圆形彩绘曼陀罗坛城藻井，四周带暖黄暗藏灯槽，正中垂挂一盏华丽的三层金铜宝伞华盖大吊灯，正面整墙为五开间深胡桃木贴金雕花大佛龛，佛龛内部采用深邃的宝石蓝色背板，主龛供奉披黄色哈达的佛像与圆形木雕屏，正前方居中摆放一张长方形五格雕花实木主供桌，金蓝棕三色辉映，8K超清室内效果图。
