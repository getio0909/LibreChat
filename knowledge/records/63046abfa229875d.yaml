summary_zh: 本图为一座极具现代声光电沉浸感的多边形/圆形万佛宝殿内部场景。空间以中心环绕式礼佛（右绕佛塔/佛像）为动线逻辑，中央供奉双身（或多面）高大金佛立像，四周墙柱以绚丽多彩的琉璃背光万佛龛环抱，完美诠释了佛经中“东方净琉璃世界”与“极乐七宝池、八功德水、五色毫光”的奇幻宗教视觉意象。
  色彩极其绚烂大胆：中央双佛立像及底层高浮雕覆莲须弥座采用高光鎏金青铜材质；中间层仰莲座采用暖橙黄色透光琉璃/树脂锻造，内部自发光如盛开金莲；四周弧形墙面与四根承重圆柱表面密布白色亚克力/透光云石小佛龛，内设RGBW多彩分区LED背光，呈…
