ai_design_usage: 适用场景：现代沉浸式琉璃光影万佛殿空间设计 / 中心绕佛式双身/四面金佛坛城参考 / 发光琉璃莲花座与多彩LED万佛柱生成；推荐搭配：锻铜鎏金大型立佛 + 暖橙透光琉璃发光莲花座 + 透光云石/琉璃RGB背光万佛墙面与圆柱
  + 高光镜面红褐大理石地面
prompt_zh: 现代沉浸式圆形佛教万佛宝殿室内场景，低角度广角仰视，殿堂正中央铜雕须弥座与橙黄色透光琉璃盛开莲花宝座上，矗立两尊背靠背的高大鎏金立佛雕像；正上方为同心圆层叠贴金与发光云石穹顶藻井；四周环绕弧形万佛墙与四根粗壮的万佛圆柱，墙面与柱身密布方格小佛龛，并发出青蓝、紫红、品红、金黄与纯白交织的绚丽琉璃背光；高光浅褐红色镜面大理石地面清晰倒映出五彩万佛墙与金色佛像，宛如东方琉璃世界，8K超高清渲染。
