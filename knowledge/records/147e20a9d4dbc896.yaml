prompt_zh: 传统佛教寺庙菩萨配殿室内供奉右斜视场景，深灰黑色高光石材地砖地面，画面左右矗立粗壮的深棕色实木大圆柱，柱身上下两端包镶精美的鎏金镂空如意云纹铜套筒，下承洁白的汉白玉雕花覆莲鼓形柱础，正中深色木雕须弥座佛台与红木供桌后供奉一尊头戴五佛冠骑乘瑞兽的铜鎏金菩萨坐像，背后是通体发光的金色火焰舟形大背光，桌前摆放两个米黄色方形拜垫，右侧墙面大幅镶嵌色彩绚丽的中国传统工笔重彩佛教经变图壁画，上方为白墙与传统木构梁架斗拱，8K建筑渲染
