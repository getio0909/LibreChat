prompt_zh: 顶级佛教寺庙内部舍利圣物展示大厅，正面中轴对称广角构图，地面满铺高光镜面黑底金纹奢石大理石大板，完美倒映出中央圣坛，中景为洁白的汉白玉雕花栏杆须弥座月台与台阶，四角矗立四根米白色大理石方形巨柱（配深灰石雕多层莲花柱础），中央矗立一座三层复合通天圣坛：下层为梯形纯金浮雕宝座，中心龛内九龙金莲托举白色舍利塔；中层为宝蓝色山水云纹摩尼宝瓶，火焰龛内供奉金身坐佛；上层为向上发散的十层倒锥形发光千佛宝塔柱，直抵顶部八角形金色莲花藻井，四周环绕金色发光万佛墙，恢弘震撼，8K超高清建筑渲染
