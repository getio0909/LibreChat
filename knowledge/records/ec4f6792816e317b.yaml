ai_design_usage: 四联镜像对拼奢石背景墙正面双塔对称构图与双排灯梁照明参考
prompt_zh: 正面平视广角全景摄影，新中式高端石材展厅“天然美石·佛國畫卷”主题背景墙实景，四块巨幅“佛国画卷”敦煌金天然奢石大板镜像对称拼接成8.8米长、2.5米高的壮丽画卷，天然金黄色、琥珀色与深紫黑色纹理形成左右对称的两座佛塔与中央金色祥云光柱图案，右侧石材表面有八列白色发光中文禅诗投影，外围镶嵌100mm实木雕花莲瓣边框与底部900mm深胡桃木回纹护墙板，顶部两道米白色横梁下安装密集的黑色轨道射灯与长臂洗墙灯，前方灰蓝金纹大理石地面上对称摆放两套现代白色圆形洽谈桌椅，灯光璀璨，8K建筑室内实景摄影。
