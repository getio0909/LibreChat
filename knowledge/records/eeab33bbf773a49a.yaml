prompt_zh: 佛教寺庙室内金色佛塔展示大殿（现代中式平顶天花方案），正面中轴对称仰视构图，前景为洁白的汉白玉三路石材台阶与卷云栏杆，中央汉白玉丹陛御道雕刻圆形麒麟瑞兽浮雕，顶端盛开一朵橙红色发光琉璃莲花灯，前景左右立有两根镶嵌竖向发光经文灯箱的深色木柱，中景八角形红棕色石雕须弥座高台上矗立巨大的藏式铜鎏金尊胜舍利宝塔（塔身开龛供奉金佛），塔刹直通顶部八角发光藻井中心的蓝色星空天池与月牙吊灯，两侧天花采用现代中式深色木框白底九宫格发光平顶吊顶，后方环绕发光千佛经架与两座白色发光拱门，8K超清渲染
