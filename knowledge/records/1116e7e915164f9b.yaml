summary_zh: 本图为新中式与传统融合风格的寺院天王殿（布袋弥勒佛殿）室内供奉场景（空间场景设计）。
materials:
- 铜鎏金大肚弥勒佛坐像配双圈白色发光圆光
- 木雕须弥座与缠枝莲供桌
- 青白石须弥座柱础凹槽木方柱
- 右侧木雕护法壁画与花窗
