- 暖木棕
- 辉煌金
style: 传统汉传寺院宫殿式风格
ai_design_usage: 寺院天王殿/弥勒佛殿室内空间设计、大肚弥勒金像配极简白色圆形发光背板方案、凹槽木方柱配高石础节点参考
prompt_zh: 新中式佛教寺庙天王殿（弥勒殿）室内供奉场景，广角斜向透视构图，浅灰褐色高光大理石地面，画面左侧为暖棕色竖向凹槽实木方柱，下承高大的青白石精雕仰覆莲方形须弥座柱础，正面木框白墙中央的深色木雕须弥座上供奉一尊笑口常开、坦胸露腹的大型铜鎏金大肚布袋弥勒佛坐像，佛像背后是一轮洁白柔和的双圈圆形发光满月背光，佛座前设一张精雕缠枝莲纹的中式实木供桌（摆放香炉、红烛与鲜果）及两个米黄色方形拜垫，右侧木墙镶嵌深浮雕护法神像木雕壁画与中式海棠木花窗，顶部为叠级发光木藻井，温馨庄严，8K建筑渲染
