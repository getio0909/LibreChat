prompt_zh: 传统佛教寺庙大雄宝殿室内右前斜向广角场景，地面满铺高光暖红棕色方形几何席纹拼花实木地板，正左方深色木雕须弥座主坛上并列供奉五尊巨型铜鎏金佛菩萨像（三世佛与文殊普贤，带镂空火焰大背光），每尊造像背后均设有洁白的石材雕花海棠框发光背景板，佛坛前整齐摆放五张雕花供桌与五对米黄色方形拜垫，右侧耸立粗壮的竖向凹槽方形木柱并承以洁白的汉白玉精雕方形须弥座柱础，后方为铜鎏金十八罗汉壁龛长廊，顶部为九宫格发光木天花与中央八角重檐贴金斗拱大藻井，温暖庄严，8K建筑渲染
