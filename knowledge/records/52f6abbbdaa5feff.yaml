summary_zh: 本图呈现的是传统中式寺院内院的建筑檐下与园林植物小品交融场景。通过一株姿态苍劲的造型罗汉松（或迎客松）将主体大殿与侧翼游廊串联起来，体现了汉传佛教寺院“古刹青松、曲径回廊”的东方禅林意境。 色调以温厚沉稳的赭红/深柚木色古建木作、苍翠欲滴的松针绿以及灰白花岗岩/汉白玉为主。左侧大殿外墙下部为灰白条石台基，上部为原木色直棂方格花窗与圆柱；右侧游廊檐口瓦当滴水整齐，额枋处施以传统青绿金线旋子彩绘与贴金雀替；前景右下角隐现汉白玉雕花莲花望柱栏杆。
