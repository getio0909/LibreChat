ai_design_usage: 适用场景：传统中式寺院庭院景观节点设计 / 古建红木格栅花窗与造型罗汉松构图参考 / 禅意园林局部氛围渲染；推荐搭配：红棕柚木/菠萝格古建木作 + 造型云片罗汉松/黑松 + 芝麻白花岗岩条石台基 + 汉白玉莲花望柱栏杆
prompt_zh: 中国传统佛教寺庙庭院景观局部特写，前景为一株枝干苍劲、修剪成水平层云状的翠绿罗汉松，右下角有汉白玉莲花柱头栏杆；背景左侧为传统红木古建筑立面，带有精细的方格木棂花窗、粗壮红木圆柱、深挑檐斗拱与青石条石台基；右侧为相连的传统游廊，檐下饰有青绿描金彩绘额枋与雀替，阳光洒在松枝与木窗上，光影层次分明，宁静古朴的禅意庭院实景感。
