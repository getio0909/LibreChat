prompt_zh: 现代新中式佛教寺庙大型禅修大殿室内场景，正面中轴对称广角构图，地面满铺如水墨画般流淌的灰白色天然流纹奢石大理石大板，地面左右对称排列整齐的明黄色圆形禅修蒲团阵列，四根粗壮的深胡桃木竖向凹槽方形巨柱，柱头与柱础均为洁白的汉白玉精雕仰覆莲瓣石构件，正前方雕花木围栏与须弥座上供奉一尊洁白温润的大型汉白玉释迦牟尼坐佛，佛像背后是整幅金碧辉煌的立体祥云浮雕背景墙，两侧为中式木格栅门与玉石壁灯，顶部为多层叠级发光木条格栅藻井吊顶，禅意空灵，8K超高清渲染
