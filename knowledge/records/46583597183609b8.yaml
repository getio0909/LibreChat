prompt_zh: 室内展品特写摄影，左前45度微仰视角，一座威严华丽的藏式大型双龙耳斗式木雕彩绘香炉供器，右侧前景为立体盘曲的黑金游龙耳柄，左侧为立体瑞凤耳饰，顶部树立弧形雕花背板并交叉插立两支宝瓶如意杵，方斗侧壁深浮雕双狮护法轮与八吉祥，底座满雕彩色宝石莲瓣与金色护法兽面，上方天花板为带线性灯带的实木雕花九宫格藻井，8K超清实拍。
