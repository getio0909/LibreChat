summary_zh: 与第 23、25 项为同一件展品的左前 45° 斜角仰视特写——大型藏传佛教双龙双凤耳斗式木雕彩绘香炉/供器。从这一角度观察，器物右侧的游龙耳柄处于前景视觉焦点，同时将顶部交叉的宝瓶如意杵与展厅天花的九宫格立体木雕藻井形成了绝佳的上下空间呼应。
