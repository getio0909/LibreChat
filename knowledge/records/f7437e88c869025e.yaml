prompt_zh: 浙江东阳卢宅传统古建筑“穿堂”室内走廊空间，一点透视纵深对称构图，天花板下密集悬挂着数十盏华丽的中国传统朱红木框六角红纱宫灯，宫灯底部垂挂金色流苏；走廊左右两侧为高大通透的深红棕色木质方格花格窗与红底金字抱柱长联，自然光从左侧花窗透入，两侧地面对称摆放明式红木圈椅与方茶几，尽头正中设中堂条案、瓷瓶与挂画，极具中式古典礼仪氛围。
