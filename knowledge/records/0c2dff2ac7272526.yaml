prompt_zh: 室内天花板仰视特写摄影，一座精美绝伦的藏传佛教曼陀罗藻井实木跌级吊顶，外框为深胡桃木藏式立体方椽头与金色几何彩绘边带，内圈为温暖的柚木平顶并带有隐藏式暖黄灯带，四个角落对称镶嵌绿叶卷草摩尼宝三角形浮雕角花，正中央镶嵌一座大型圆形立体木雕彩绘坛城（曼陀罗），包含五彩火焰圈、四方坛城宫殿城门与中心红金十六瓣莲花日轮，天圆地方，8K超高清建筑构件细节。
