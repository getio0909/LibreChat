prompt_zh: 佛教铜鎏金双龙耳三足香炉法器微距特写，安放在深色雕花红木供桌上，炉身浑圆饱满，表面精雕高浮雕仰莲瓣纹与缠枝宝相花纹，左右两侧对称装饰立体盘龙双耳，顶部为镂空祥云纹炉盖并立有一尊威严的鎏金瑞狮钮，下承三只兽首吞足，纯正黄金光泽，雕工极致繁复，暗调虚化背景，博物馆级器物摄影，8K超高清细节
