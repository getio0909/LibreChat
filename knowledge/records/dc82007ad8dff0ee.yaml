prompt_zh: 新中式佛教文化展馆入口门厅室内设计，正面中轴对称构图，高耸的暖胡桃木四扇传统雕花隔扇大门，上部通透万字格玻璃窗，下部团寿纹浮雕裙板，两侧粗壮木圆柱立于浅灰汉白玉鼓形柱础上，门楣四组斗拱悬挂精致八角宫灯，顶部深灰吊顶安装三盏现代中式折扇百叶发光大吊灯，地面铺设浅灰褐色高光抛光大理石大板，倒影清晰，庄严禅意氛围，8K超高清建筑渲染。
