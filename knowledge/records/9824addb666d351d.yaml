summary_zh: 陈设于展厅实木方柜顶部的大型藏传佛教“双龙双凤耳、双狮捧法轮”斗式木雕彩绘供器/聚宝盆法器（右前 45° 斜角视图）。该器型源于中国古代量器“方斗（聚宝斗）”与藏传佛教大型曼扎供盘、护法供斗的结合，气势磅礴，集圆雕、透雕、深浮雕与彩绘贴金工艺于一身。
