ai_design_usage: 大型藏式木雕供器/聚宝盆法器3D建模参考（右前视角） / 龙耳与雪狮护法轮雕刻细节生成
prompt_zh: 室内展品特写摄影，右斜45度视角，一件极具视觉冲击力的大型藏传佛教斗式木雕彩绘供器，深枣红色实木方斗造型，左侧盘曲一条威猛的立体圆雕黑金游龙耳柄手握火珠，右侧雕瑞凤耳柄，顶部交叉斜插两支镂空雕刻宝瓶如意长杵，倒梯形斗腹高浮雕两尊白身绿鬃雪狮拱护金色法轮与双鱼，须弥底座雕彩色莲瓣与金色怒目瑞兽饕餮面，背景为藏式雕花天花板展厅，8K超清。
