prompt_zh: 寺院室内卧佛殿展示空间，中央是一尊洁白温润的大型汉白玉释迦牟尼右胁涅槃卧佛雕像，安卧于双层内藏暖光的透光汉白玉心形莲花瓣须弥座上，下方深灰褐色高光大理石地面镶嵌巨大的圆形盛开莲花水刀拼花，两侧对称立两根深棕色实木大圆柱配汉白玉雕花柱础，卧佛正上方为圆形木构斗拱发光藻井吊顶，右侧墙面设金色三世佛龛与白色发光经文方格墙，庄严神圣，8K超清建筑渲染
