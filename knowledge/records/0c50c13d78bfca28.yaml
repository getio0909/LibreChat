summary_zh: 本图为新中式寺院天王殿迎门主龛、佛教文化展厅或高端中式佛堂内的“大肚弥勒佛（布袋和尚/笑佛）”独立供奉龛正面场景。弥勒佛象征“大肚能容天下难容之事，开口便笑世间可笑之人”的欢喜、宽容与招财纳福寓意，空间设计简练大气、圆融喜庆。
  空间以温润醇厚的深胡桃木色、纯净素白墙面、暖金色佛身与耀眼纯白月轮光带构成鲜明层次。主尊弥勒佛及下方双层祥云莲花座采用暖金色木雕（金丝楠木/黄杨木雕或鎏金铜雕）工艺，质感温润细腻；外框与前方供桌采用深棕色胡桃木精雕；供桌上的三足香炉与高脚烛台采用哑光纯银/白铜材质，两侧铜花瓶内插自然风干…
