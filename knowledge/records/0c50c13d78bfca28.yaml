ai_design_usage: 适用场景：新中式佛堂/天王殿大肚弥勒佛供奉龛立面设计 / 正圆形内发光月轮背光佛龛参考 / 标准中式供桌五供（香炉、红烛、莲蓬瓶）与拜垫陈设生成；推荐搭配：金丝楠木/黄铜鎏金大肚弥勒佛坐像 + 纯白微水泥正圆形暗藏灯带月轮背光龛
  + 深胡桃木壶门外框与雕花供桌 + 纯银香炉烛台与干莲蓬插花
prompt_zh: 新中式佛教展厅大肚弥勒佛（笑佛）供奉龛正面竖幅场景，严格中轴对称构图，外围为深胡桃木雕花壶门形木框，内部素白墙面正中设有一个正圆形内凹白色发光月轮背光龛；龛内祥云仰覆莲花宝座上端坐一尊笑容可掬、袒胸露腹的暖金色大肚弥勒佛雕像，右手扶布袋，左手托金元宝；佛龛前方陈设一张精雕细琢的中式深木色供桌，桌上对称摆放三足银香炉、一对银座红烛和插有干莲蓬的铜花瓶，供桌下方地面并列放置两个米黄色带红边的方形拜垫，庄重喜庆，禅意雅致，高清室内效果图。
