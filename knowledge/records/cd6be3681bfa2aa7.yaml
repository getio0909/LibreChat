prompt_zh: 佛教寺庙药师殿内雕像与汉白玉石材基座近景特写展示，画面右前方为一座极其精美的双层汉白玉高浮雕束腰须弥座佛坛，细腻雕刻仰覆莲瓣、缠枝宝相花、卷草纹与回纹边框，台座上方供奉巨大的铜鎏金药师佛坐像与手持莲花的日光菩萨鎏金立像，佛像背景左侧竖刻“慧日照天”金色书法大字，画面左侧木雕基座上并列站立两尊披甲威武的铜鎏金护法天王雕像，背后是整面橙红色发光方格万佛墙，石雕工艺精湛，金碧辉煌，8K超清细节
