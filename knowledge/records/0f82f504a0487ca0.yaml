ai_design_usage: 适用场景：现代极简禅修抄经室/茶室/冥想空间设计 / 圆形满月发光背景墙与插花造景参考 / 内发光水墨山水玻璃灯箱屏风生成；推荐搭配：天然白橡木/胡桃木护墙板与地板 + 米白肌理艺术涂料留白墙 + 夹绢透光水墨山水玻璃灯箱
  + 圆形满月暗藏灯带背景龛 + 原木抄经矮几
prompt_zh: 现代极简东方禅意抄经室与冥想空间正面全景，温润的原木色与米白留白格调，正中背景墙大片米白留白，左右对称嵌入两扇竖长条暖黄色内发光水墨群山与飞鸟玻璃屏风；右侧原木护墙板中心设有一个巨大的正圆形内凹发光“满月”背景龛，圆周散发柔和暖光，右下角点缀一枝斜出的黄色腊梅花枝；左侧为中式木格栅移门与深棕窗帘；实木地板上整齐摆放两排共七张极简原木矮几，桌上放置白色禅修软垫；顶部为木肋条跌级暗藏暖光吊顶，宁静空灵，8K超高清室内设计效果图。
