summary_zh: 本图为一座极致简约、充满宋氏美学与现代东方禅意的“抄经室 / 茶修冥想室 / 禅意雅集空间”正面全景。空间完全隐去了具象的宗教神像，转而以“留白、远山、飞鸟、满月、寒梅、原木矮几”等禅宗自然意象，传达出“万法归宗、明心见性、圆满无碍”的深远禅境。
  全室以温暖质朴的浅胡桃木/橡木本色、素雅的米白硅藻泥/宣纸肌理墙面、以及明亮温暖的2700K-3000K琥珀黄背光为主色调。地面满铺自然结疤肌理的浅棕实木地板；正面背景墙采用米白艺术肌理漆留白，嵌入两扇夹丝透光山水画玻璃灯箱；右侧护墙板与天花木肋均采用同色系哑光原木饰面。
materials:
- 原木护墙与地板
- 透光山水玻璃
- 矮几软垫
colors:
