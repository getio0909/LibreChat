prompt_zh: 传统佛教寺庙多进式内部空间设计，斜向纵深透视构图，地面满铺高光深灰褐色水墨纹理大理石大板，倒影清晰，两排深棕色实木方柱下承高大的青白石多层莲花须弥座柱础，左侧木墙镶嵌多幅发光的中国传统工笔重彩四大天王护法壁画，走廊尽端为弧形排列的金色发光千佛墙，右侧通过半开的万字纹镂空木格栅屏风门透视出分殿内供奉的金身菩萨立像与壁画，顶部为蓝底星空金色井字格藻井天花，层次丰富，8K建筑渲染
