prompt_zh: 中国传统佛教寺院大殿八角斗拱彩绘藻井垂直仰视特写，严格中心对称的正方形构图，外方内八角再收束为中心圆顶的“天圆地方”木构榫卯结构，外圈为青绿冷色调传统彩绘梁枋与十字斗拱，中间八角形结构由十六道放射状橘红与翠绿相间的斗拱层层向内悬挑叠涩，四角镶嵌展翅飞翔的金黄色与翠绿色木雕凤凰角花，正中央为温暖发光的圆形千叶莲花曼荼罗浮雕顶心，极其繁复华丽的东方古建木作工艺，8K超高清
