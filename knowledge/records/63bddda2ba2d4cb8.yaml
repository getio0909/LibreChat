summary_zh: 纯白背景（Studio White Background）下的中式宫廷风结合佛教瑞兽花卉题材的重型实木嵌石会客家具组合。整套家具由一张三屏风式高靠背三人座主沙发、左二右一对称围合的单人位扶手太师椅、三张方形角几以及中央一张巨型双层底座四方茶几组成，器型敦厚威严，兼具清代宫廷宝座规制与现代奢石镶嵌工艺。
