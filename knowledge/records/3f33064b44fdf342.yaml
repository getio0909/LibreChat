prompt_zh: 暗调佛教主题展览空间过渡门厅正立面设计，上方是两排发着幽蓝冷光的万佛拱龛，下方由四根镶嵌宝蓝色发光琉璃方砖的竖向灯柱划分为三个开间：左侧开间为通往上层的石材楼梯并挂有三幅水墨禅画，中央开间为深邃的黑色镜面玻璃龛并倒映出两排温暖的金色莲花灯，右侧开间是一幅精美的工笔重彩立佛壁画，深灰色石材地面，冷暖光影交织，8k效果图。
