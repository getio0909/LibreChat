ai_design_usage: 适用场景：现代大型禅修堂斜向对角线空间构图参考 / 印莲花纹明黄色圆形禅修蒲团单品与矩阵生成 / 圆柱鎏金浮雕铜柱套与石材柱础细部设计；推荐搭配：帕斯高灰/云多拉灰大理石地面 + 定制明黄色印莲花圆形禅修蒲团
  + 24K鎏金铜浮雕柱套配青石覆莲柱础 + 白色GRG层叠莲花发光佛龛
prompt_zh: 现代大型佛教禅修厅室内斜向广角透视场景，浅灰色高光云纹大理石地面上，成百上千个明黄色圆柱形禅修蒲团按严谨矩阵排列，近景蒲团顶面清晰印有精致的莲花团花图案；画面右侧前景与中景矗立粗壮的圆柱，柱身下部包嵌精雕细琢的鎏金缠枝莲花纹铜柱套，下承青石高浮雕覆莲柱础；右远方主佛坛设有一座巨大的多层盛开白玉莲花瓣形内发光佛龛，内部端坐纯白汉白玉释迦牟尼佛像，前设实木雕花供桌；顶部为现代斜向折板式白色条形发光天幕吊顶，空间宏大澄明，8K超高清建筑渲染。
