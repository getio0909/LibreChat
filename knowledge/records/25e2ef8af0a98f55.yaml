ai_design_usage: 佛教图书馆/藏经阁主视觉墙设计、汉白玉南传坐佛与朱红火焰龛撞色搭配、博物馆级佛像主展台构图
prompt_zh: 东南亚泰式佛教藏经阁与白玉佛像展览空间设计，竖幅低角度中轴对称构图，正中央白色多层须弥台基上供奉一尊通体洁白温润的汉白玉南传偏袒右肩禅定坐佛，佛像背后为泰式传统火焰尖拱形朱红色内凹大佛龛，佛龛后方与左右两侧是顶天立地的五跨深红木大藏经书架墙，密集陈列数千册红色、黄色与蓝色烫金精装佛经，前景为黑色石材供桌与高光浅灰大理石地面，顶部重点射灯照亮纯白佛身，庄严神圣，8K室内实景摄影
