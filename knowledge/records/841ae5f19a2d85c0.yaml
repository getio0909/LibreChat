ai_design_usage: 适用场景：传统寺院青石影壁/门楼深浮雕花板设计 / 极乐天宫楼阁与缠枝卷草纹石雕图案生成 / 古建青石雕刻材质细节参考；推荐搭配：嘉祥青石/茶园青石五轴深浮雕 + 边框原木或青石线脚收口 + 顶部暗藏2700K洗墙微光灯条
prompt_zh: 中国传统佛教寺院青石深浮雕装饰花板细节特写，冷调蓝灰色青石材质，画面正中央深浮雕一座精致的重檐歇山顶天宫楼阁古建筑，飞檐翘角与瓦垄清晰立体；天宫四周被层层叠叠、繁复交织的缠枝卷草纹、西番莲纹与如意祥云纹紧密环绕，底部由盛开的仰莲花瓣托起；雕刻刀法深峻细腻，立体感极强，石板顶部边缘有一抹温暖的黄色洗墙灯光，传统古建青石雕工艺写实。
