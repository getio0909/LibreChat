summary_zh: 本图为一件镶嵌于寺院影壁、牌坊须弥座或大殿门楼槛墙上的传统“青石深浮雕天宫楼阁与缠枝宝相花”石刻装饰花板局部写实。图案以佛教净土经变中的“极乐天宫宝阁”为核心母题，四周辅以生生不息的缠枝卷草与宝相莲花，寓意佛国净土、庄严妙好。
  采用质地坚硬密实的传统青石（蓝灰调石灰岩/青砂岩）雕刻，表面呈冷峻古朴的蓝灰哑光石质；画框最上方内嵌一道隐藏式暖黄洗墙灯带，暖金光线轻轻掠过顶部石雕边缘，与下部冷调蓝灰青石形成微妙的冷暖光影过渡。
