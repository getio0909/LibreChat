ai_design_usage: 黑金宫殿风大佛供奉展厅设计、佛像背光弧形奢石屏风生成与多跨木构藻井空间参考
prompt_zh: 传统黑金宫殿风格大型佛教文化艺术展厅室内全景，广角透视构图，成排高耸的乌木黑漆大圆柱，上下两端饰有华丽的鎏金卷草莲花纹柱套，立于汉白玉莲花柱础上，顶部为黑金斗拱与井字格栅藻井天花，右侧白色石雕须弥座上供奉一尊大型金身释迦牟尼坐佛，带有火焰形雕花金背光，佛像背后竖立三扇高耸的圆弧顶青白玉山水纹发光奢石屏风，远端展墙悬挂罗汉水墨立轴，深墨绿色高光大理石地面倒影清晰，恢宏庄严，8K建筑渲染。
