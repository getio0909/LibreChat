summary_zh: 黑金宫殿式佛教文化展厅主厅视角，成排乌木描金大圆柱立于汉白玉莲花柱础上，右侧汉白玉须弥座供奉大型金身坐佛，背后竖立三扇高耸的圆弧顶青白玉山水纹发光奢石屏风。
