prompt_zh: 现代新中式佛教寺院石材展厅实景，中央为双层内凹亚字形折角圆弧（R200/R100）传统佛龛背景墙，凹槽内隐藏暖黄色LED灯带散发两圈神圣金色光晕，佛龛内部镶嵌“禅境灰蓝”金镶玉天然大理石（烟灰蓝色底配金色斜纹），龛前摆放敦煌金天然黄玉石五层高浮雕须弥座大供桌，桌上供奉精美的鎏金伽蓝菩萨坐像与鲜花水果，前方同款灰蓝金纹大理石高光地面上摆放一张明黄色团莲坐垫的实木拜凳，左侧米白色墙面镶嵌黑色立体字“莊嚴寶刹
  寺院装饰石材”及绿植盆栽，庄严静谧，8K商业空间摄影。
