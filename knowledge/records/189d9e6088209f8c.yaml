summary_zh: 本图完整展示了 2026年春季佛事展（C5 T026）南侧 D立面庄严佛龛核心陈列区与东侧 A立面入口品牌形象柱内侧的空间组合。设计将传统寺院大殿的“背光佛龛+须弥座佛台+礼佛拜垫”进行现代极简新中式转译，打造出既可作为高端家宅佛堂样板间、又可展现寺院大型石雕工艺的沉浸式场景。
