prompt_zh: 博物馆展出的古代泰国素可泰风格建筑灰塑石雕神兽卡拉（Kala）浮雕残件，安装在黑色现代金属底座上，浅米色麻布背景；雕件呈现并列的正面与侧面两个神兽头像，圆目凸出，阔鼻大口，口中吐出对称向下延展的火焰状卷草纹叶片，古朴的米灰色石灰岩与灰塑风化多孔肌理，顶部投射柔和博物馆聚光灯，立体阴影分明。
