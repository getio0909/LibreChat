ai_design_usage: 专业石材展厅“洗墙铲灯+重点轨道射灯”配光矩阵与顶梁网格参考
prompt_zh: 展览工程CAD天花灯位布局施工图，“04灯位图”，展示10000mm×7500mm石材展厅的顶部300mm宽井字形横梁结构与专业照明灯具定位：包含“铲灯”（长臂金卤洗墙灯图例，共11盏，其中9盏沿左侧奢石大墙均匀排列）与“轨道灯”（三头导轨射灯图例，共11组33盏分布于井字横梁与底部佛龛供桌区）两种图例符号，四周带有精确的红色网格间距尺寸标注（纵向三跨各2800mm，横向1950/2000/1950mm，梁宽300mm），白底专业电气照明CAD施工图纸。
