summary_zh: 本图为施工图册第 4 页——04灯位图（天花过梁结构与照明电气定位平面图）。详细定义了如何通过“井”字形顶部结构梁架与双类型专业展陈灯具（共 44 个发光点位），将 75m² 展厅的墙面奢石、地面大理石与核心佛像照得璀璨通透。
materials:
