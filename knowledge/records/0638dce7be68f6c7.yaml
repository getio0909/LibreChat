summary_zh: 与第 23、24 项同款展品的正面标准对称视角全景照——藏传佛教大型双龙耳斗式木雕彩绘供器。通过正视图可以最准确地把握该法器的宽窄比例、斗腹斜度（约 60° 外倾角）、双耳S形曲率以及底座兽面与斗腹法轮的垂直中轴对齐关系。
