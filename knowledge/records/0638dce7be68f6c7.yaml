prompt_zh: 正面水平特写摄影，一座庄严对称的藏传佛教大型双龙耳斗式木雕彩绘供器，深枣红色倒梯形木斗，左右两侧对称盘曲威猛的黑金游龙耳柄手握红珠，顶部中央交叉竖立两支雕花宝瓶杵，斗腹正中深浮雕两尊白身绿鬃雪狮对称拱护金色八辐法轮与双鱼，下方须弥座雕刻红黄彩色莲瓣与金色怒目饕餮兽面，背景为藏式佛堂木饰面展厅，8K超清。
