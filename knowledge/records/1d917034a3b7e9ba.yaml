summary_zh: 本图完整展示了展位后方“金镶玉奢石高大背景墙 + 西方三圣（阿弥陀佛、观世音菩萨、大势至菩萨）彩绘立像 + 敦煌金须弥座汉白玉护栏”的标准寺院佛殿后壁展陈系统。
