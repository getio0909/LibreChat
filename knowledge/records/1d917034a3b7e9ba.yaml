prompt_zh: 庄严的佛教展厅西方三圣石材背景墙全景，高挑墙面采用十二块天然金镶玉大理石大板竖向拼接，中间嵌入黑色金属竖条分缝，石材呈现暖金琥珀与灰褐色天然闪电纹；墙前通长布置敦煌金高浮雕石雕须弥座，台沿安装一排纯白汉白玉微缩雕花栏杆；须弥座上等距供奉西方三圣（阿弥陀佛、观音菩萨、大势至菩萨）三尊贴金彩绘立像，每尊佛像背后均有石绿色全镂空卷草莲花大背光，佛像之间点缀盛开的鲜花；顶部衔接金镶玉透光石莲花藻井天花与白色轩顶格栅，空间气势恢宏，8K建筑室内摄影。
