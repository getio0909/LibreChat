prompt_zh: 现代禅意坡屋顶双层挑空佛教寺庙佛像展览空间，顶部是高耸的人字形现代露明木椽坡屋顶，中央双层挑空中庭四周设透明玻璃护栏，一尊大型青铜鎏金坐佛配镂空火焰背光安坐于从下层升起的多层石雕莲花底座上，左右两侧高墙采用温暖的竖向竹木格栅装饰，并点缀错落分布的菱形暖光星点壁灯，远景后墙下层为发光万佛长廊，上层悬挂一幅巨型黑底金彩山水画，浅灰色石材地面，空灵庄严，8K建筑渲染
