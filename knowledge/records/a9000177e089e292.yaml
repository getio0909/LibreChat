prompt_zh: 大雄宝殿室内低角度广角对称仰视效果图，正前方通长主佛坛上并列供奉五尊金色巨像（中央三尊三世佛坐像配二弟子立像，左侧金身文殊菩萨骑狮像，右侧金身普贤菩萨骑象像），背后为白色浮雕发光海棠形石材背景板，两端角落陈列金色罗汉群像，前景两根粗壮的方形深木色大柱立于白色汉白玉莲瓣方形柱础上，地面为几何图案拼花木地板并排列一排十个米色方蒲团，屋顶中央是巨大的八角形发光莲花瓣藻井，藻井中心为深蓝色星空圆顶，庄严震撼，8K渲染
