prompt_zh: 广东潮州己略黄公祠传统建筑檐廊梁架仰视实景，前景与中景为坚实的浅灰白色花岗岩方形石柱，石柱上方托起极其华丽繁复的清代潮州金漆木雕多层梁架结构；朱红色的圆木屋面椽子下方，层层叠叠的金色镂空木雕驼峰、瑞兽斗拱、凤凰托木、黑漆描金山水画横梁以及满雕数十个戏曲人物故事的通雕随梁花板交相辉映，右侧可见庭院绿植与传统灰瓦屋檐，超高清建筑人文摄影。
