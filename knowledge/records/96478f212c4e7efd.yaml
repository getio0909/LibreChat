summary_zh: 本图聚焦展位中轴线核心展品——巨型全石雕双层仰覆莲瓣须弥供坛（佛台）与贴金彩绘伽蓝菩萨（关公）坐像，同时右后方完整呈现右翼3×12格透光千佛墙与门廊宫灯。该场景直观展示了寺院大殿主供坛、石雕须弥座护栏、地面石材拼花与背景千佛龛的成套工程交付效果。
