prompt_zh: 佛教展厅中央核心供奉区实景，前景为一座宏伟的天然五彩敦煌金玉石雕刻双层莲花瓣大型供坛，石材表面高光抛光，带有天然青绿、暖黄与紫红玉石纹理，上层雕刻饱满肥厚的仰莲瓣，下层为覆莲瓣底座；供坛正中供奉一尊贴金彩绘伽蓝菩萨坐像，头戴金冠、身披明黄龙纹锦袍、端坐金龙宝座，台面摆放鎏金高脚果盘与鲜花；左后方为金镶玉大理石高墙、彩绘佛像与带有“天然玉石敦煌金须弥座”红牌的浮雕基座，右后方为内嵌36尊橙黄琉璃佛像的发光背光墙，地面为镜面金镶玉与黑色大理石棋盘格拼花，光影庄重华丽，8K实景摄影。
