summary_zh: 【图中可见】石塔以多重仿瓦屋檐逐层收分，顶端叠置圆鼓状与莲苞状构件；底部宽莲瓣托住有立像的塔身，外围石栏采用直角折线透空纹。【来源著录】Sarira Pagoda in Qixia Temple 2018.jpg；文化或地点依据：来源明确南京栖霞寺舍利塔；按江苏所在地归中国南方。图中塔体、台基与围栏合为一组，不另分角度计数。
