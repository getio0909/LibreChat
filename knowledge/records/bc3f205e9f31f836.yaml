prompt_zh: 超高清现代中式禅意长廊与下沉式枯山水内庭院景观设计，横幅一点透视对称构图，中央为一方精致的下沉式矩形枯山水庭院，铺满洁白砂石并耙出细腻水波纹，中间点缀翠绿青苔微地形、黑色泰山景石、挺拔翠竹与右侧的迎客松盆景；庭院四周环绕温暖的原木方柱回廊与通高竖向木格栅隔断，地面铺设木纹砖并以深灰青石条收边，顶部为木梁格栅采光天棚，自然天光倾泻而下，静谧空灵，8K园林建筑渲染
