ai_design_usage: 当代黑金新中式佛殿先锋空间设计、三联式半透明奢石玉石屏风背板应用、黑漆描金木构与汉白玉佛台冷暖对比
prompt_zh: 极具东方先锋美学的黑金新中式佛教大殿室内场景，正面中轴对称构图，大殿梁架、层叠斗拱、井字藻井与高大圆柱均采用深邃的乌木黑漆配精致金色描金花纹，圆柱柱身包镶三道黑金缠枝莲铜箍并立于深灰石雕莲花柱础上，大殿正中央设一座洁白无瑕的汉白玉精雕须弥座佛坛，供奉一尊古铜鎏金释迦牟尼坐佛（带镂空火焰背光），佛像背后竖立一座中扇高两侧低的三联式半透明青白山水纹冰花玉奢石透光屏风（配金色金属边框），后方为中式黑色木格栅门窗，深灰镜面石材地面，冷峻神秘，禅意高雅，8K超高清渲染
