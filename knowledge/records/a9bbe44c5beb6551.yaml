summary_zh: 【图中可见】青绿色炉有外撇口、束颈及圆腹，下承三短足，釉面有细裂，足底露褐色胎色。【来源著录】Cylindrical Tripod Censer (Incense Burner) with Cloud-Scroll Feet；文化或地点依据：来源明确著录龙泉窑；按龙泉窑传统归入中国南方，不补写具体出土地。【著录疑点】AIC
  原英文标题 Cylindrical Tripod Censer with Cloud-Scroll Feet（圆筒形、云卷足）及 underglaze molded decoration 的材质描述，与照片可见的鼓腹鬲式三足炉和锥形露胎足不一致。来源原文保留供追溯；本条中文形态描述仅据照片，不据该英文标题补绘云卷足或模印纹。
