prompt_zh: 纯白背景家具摄影，一套极具宗教威严感的佛教主题高靠背实木雕花沙发茶几套装，红酸枝与琥珀色柚木材质，沙发靠背设计成高耸的多层火焰拱形背光，正中精雕金色毗卢遮那佛坐像，两侧雕刻八辐法轮并镶嵌绿松石与红珊瑚宝珠，坐垫与方形下沉式茶几台面采用碧绿蛇纹大理石，茶几底座满雕描金卷草纹，8K超高清细节。
