summary_zh: 纯白背景下的藏汉融合皇家寺院级“五佛宝座式”实木嵌石沙发茶几全套家具。与常规平顶沙发不同，本套家具将主沙发与单人位扶手椅的靠背急剧拔高，直接转化为带有多层莲瓣火焰光背的佛陀法座背光形式，使日常会客家具呈现出极强的殿堂神圣感与宗教仪式感。
