ai_design_usage: ControlNet材质替换与背景重绘的标准实景母本（对比图01-06及图28） / 佛教艺术家具展厅与禅茶会客厅整体软装设计参考
prompt_zh: 室内展厅实景摄影，一个温馨典雅的藏汉融合佛教实木雕花家具会客展示空间，浅色人字拼木地板，暖驼色肌理背景墙，中央围合摆放一套琥珀金棕色核桃木深浮雕莲花靠背沙发与大型方形实木茶几，搭配天青色织锦坐垫、青花瓷茶具与鲜花花瓶，背景墙上悬挂布达拉宫全景木雕画与两幅度母木雕唐卡挂屏，左后方矗立一座高大的四角飞檐亭阁式木雕佛龛，自然柔和的展厅照明，8K实景照片。
