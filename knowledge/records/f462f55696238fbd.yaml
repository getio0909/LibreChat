prompt_zh: 庄严对称的新中式佛教壁画展览大厅，正中央巨型壁龛内是一幅通体柔和发光的巨幅工笔重彩《佛陀说法图》壁画，壁画下方是一座通长的纯白汉白玉精雕束腰莲花须弥座台基，左右两侧墙面下部为精致的深红木万字纹雕花隔扇门并镶嵌圆形鎏金浮雕，门扇上方各内嵌四幅发光的传统佛教绘画，顶部是镶嵌金色圆形浮雕的井字木格吊顶，深灰色哑光石板地面，8k效果图。
