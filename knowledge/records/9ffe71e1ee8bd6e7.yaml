prompt_zh: 博物馆级佛教石雕艺术品全身特写，一座采用“敦煌金”天然黄玉石整料精雕的大型传统五层须弥座供桌（佛台），45度斜向全身视角，顶部檐口浮雕如意卷草纹，上层为肥厚饱满的立体仰莲花瓣，中间束腰部分在回纹边框内高浮雕宝瓶、盛开的牡丹花与缠枝莲纹，下层为立体覆莲花瓣，底部基座雕刻中式几何回纹，天然黄玉石质地如蜜蜡琥珀般温润通透并带有天然红棕色矿物脉络，摆放在高光灰蓝色金纹大理石地面上，右侧有一张明黄色莲花锦缎坐垫的实木拜凳，8K超高清写实摄影。
