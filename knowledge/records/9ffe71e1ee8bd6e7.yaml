summary_zh: 本图为 2026年春季佛事展 D立面佛龛前陈设的镇馆石雕重器——“天然玉石 · 敦煌金”五层传统规制高浮雕须弥座大供桌（佛台，总长 3310mm）的 45° 斜向全身写实照。该作品代表了当代寺院大型礼佛供具将“顶级天然黄玉石原料”与“传统皇家官式须弥座深浮雕工艺”相结合的最高水准。
