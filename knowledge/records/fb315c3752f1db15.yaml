prompt_zh: 现代极简侘寂风室内佛堂与冥想禅修空间设计，顶部为八角形五层阶梯式内收折板吊顶，每一层阶梯均暗藏暖白线性LED灯带，汇聚至中心明亮的八角形天窗，墙面为暖米白色微水泥艺术肌理漆，正中背景墙设计三层叠级莲花尖拱形内凹发光壁龛，龛内并排摆放两座原木雕花佛龛并供奉两尊白玉坐佛，前方置原木供桌与灰色圆蒲团，两侧对称摆放高脚木花架与迎客松盆景，左侧百叶窗透入绿树光影，纯净空灵，8K室内效果图
