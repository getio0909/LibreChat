prompt_zh: 东南亚高棉风格圆形红砖穹顶佛殿内部场景，竖幅对称仰拍构图，正中央为多层折角白色大理石雕刻的须弥座台基，上方供奉一尊黑色青铜七头那伽蛇神护法禅定坐佛，环绕四周的是高耸向内收分的古旧红砖弧形墙面，向上连接八根白底金边结构肋梁，穹顶正中悬挂白色圆形透光华盖伞并垂落金色流苏，浅色大理石拼花地面与金色浮雕踢脚线，神圣静谧的自然顶光，超高清建筑摄影，8K
