prompt_zh: 超高清现代禅修室与居士打坐堂室内设计效果图，横幅广角透视，地面中央铺设浅米黄色天然榻榻米席面，整齐排列三列三排米白色圆形禅修打坐蒲团；正前方设一张低矮的原木导师讲经案几，背后为竖向原木格栅与极简留白墙面；画面左侧为整面通顶的原木藏经书架，摆满佛学典籍；画面右侧为抬高的实木茶席地台、背光紫砂壶展示格与透景木格栅玻璃窗，窗外可见翠绿庭院，自然光充沛，宁静祥和，8K室内表现渲染
