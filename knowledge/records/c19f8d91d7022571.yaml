prompt_zh: 新中式佛教室内供奉空间设计案例，正中央一体式实木佛坛柜，中央佛龛顶部冠以精美的金色镂空雕花天宫华盖，龛内金色心经背景板前并列供奉三尊带火焰背光的三世佛与左右文殊普贤菩萨共五尊金像，佛龛两侧连接开放式木作博古架陈列经函与小佛塔，前方设红木雕花供桌、浅色地垫与三个黄色圆蒲团，两侧立六角落地宫灯，左右白墙各对称悬挂三幅框装工笔重彩菩萨挂画，胡桃木地板，木格栅加矩形透光灯膜天花，8K效果图
