prompt_zh: 大型佛教寺庙大殿内部装饰正面中轴对称超宽全景，暖灰褐色哑光大理石地面，左右两侧对称排列整齐的米黄色方形共修蒲团矩阵，中间留出宽阔通道并立有两根配浅灰石雕柱础的深棕色实木大圆柱，正中央木雕须弥座主坛上供奉一尊巨大的铜鎏金坐佛（带镂空雕花火焰大背光），主佛正上方天花镶嵌一座双层圆形贴金斗拱彩绘大藻井，四周天花满布金色雕花方格发光藻井，大殿三面环墙采用大幅工笔重彩佛教群像壁画与金色发光方格龛（内供白玉小佛）交替排布，墙面高处环绕一圈立体彩绘诸天人物悬塑廊带，8K超清全景渲染
