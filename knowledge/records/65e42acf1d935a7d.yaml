prompt_zh: 恢弘的佛教主题展览大厅广角室内设计，顶部是深蓝色璀璨星空吊顶，中景矗立三根高大的米白色汉白玉方柱，柱身精雕细琢佛教八吉祥宝伞与吉祥结浅浮雕图案，前景右侧是一根青白紫红渐变发光的琉璃千佛方柱，左侧背景为米白色石材千佛龛墙与镂空石雕隔断，地面铺设高光橙黄色玉石并镶嵌大型圆形彩色曼荼罗水刀拼花，倒影清晰，8k效果图。
