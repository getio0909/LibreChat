summary_zh: 【图中可见】五层八角石塔以层层挑檐形成竖向轮廓，前景绿树与院落围合塔身，属于建筑外观与庭院关系参考。【来源著录】Zhenguo Pagoda of Kaiyuan Temple (Quanzhou) 20170727.jpg；文化或地点依据：来源明确福建泉州开元寺镇国塔。来源将“淳熙十年”与“1250年”并列，纪年自相矛盾，故不据此确定本塔建造年代；照片日期为2017年7月27日。
