prompt_zh: 以所附实物照片作形态参考，五层八角石塔以层层挑檐形成竖向轮廓，前景绿树与院落围合塔身，属于建筑外观与庭院关系参考。重点保留可辨识的轮廓、纹样疏密与表面色差，用于宗教建筑屋面、立面与院落构图参考；此提示词为设计演绎，不作为年代、材质鉴定或工程尺寸依据。
