ai_design_usage: 高端寺院功德堂与祖师堂室内设计、雕花嵌板方木柱与汉白玉方形须弥柱础及玉璧供案植入参考
prompt_zh: 新中式高端寺院功德堂与佛堂室内场景设计，斜向广角透视构图，空间中央矗立两根粗壮的红棕胡桃木方形大柱，柱身四面镶嵌深浮雕金色卷草龙纹花板，柱头饰有镂空鎏金雀替，柱脚承接洁白的汉白玉高浮雕莲花方形须弥座柱础，左侧竖向木格栅窗前摆放一张两端呈漩涡卷轴造型的创意实木供案，案上立放一枚温润的汉白玉雕花平安扣玉璧，后方为黑金彩绘须弥座托起的金漆万字格雕花大佛龛与红木供桌，桌前排列三个黄蓝刺绣圆形拜垫，右侧立有一座金色八角经幢，红棕色拼花地板，华贵庄严，8K超高清渲染。
