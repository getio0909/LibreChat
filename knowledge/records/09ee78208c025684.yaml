prompt_zh: 室内发光木框壁龛中供奉的天然暖米黄玉石精雕大肚弥勒笑佛坐像特写，竖构图，弥勒佛面容慈祥喜悦，开口大笑，双耳垂肩，袒胸露腹，左手托举一枚硕大的石雕元宝，右手持乾坤布袋，端坐于精致的双层石雕仰覆莲花宝座上，石质温润细腻如暖玉，背后为柔和的暖白色发光背板，两侧为深胡桃木装饰框，前景点缀粉荷花苞，喜庆庄严，8K石雕写实摄影
