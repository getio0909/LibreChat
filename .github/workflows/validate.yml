name: Validate Knowledge Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyyaml jsonschema pytest

      - name: Run unit tests
        run: python -m pytest -v

      - name: Validate knowledge base records and derivatives
        run: python tools/validate.py

      - name: Build index and markdown views
        run: python tools/build.py --skip-archive
