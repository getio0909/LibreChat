name: Development CI/CD

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/development.yml'
      - 'deploy/**'
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'getio0909/LibreChat'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - name: Check changed code
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run static-checks -- --full --against "$CI_BASE"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:client-build
      - name: Validate deployment files
        run: |
          bash -n deploy/deploy.sh
          shellcheck deploy/deploy.sh
          mkdir -p /tmp/compose-check
          cp deploy/compose.yml /tmp/compose-check/compose.yml
          cp librechat.yaml /tmp/compose-check/librechat.yaml
          printf 'MEILI_MASTER_KEY=ci-config-validation\nRAG_DB_PASSWORD=ci-config-validation\n' > /tmp/compose-check/.env
          LIBRECHAT_IMAGE=librechat:ci docker compose -f /tmp/compose-check/compose.yml --env-file /tmp/compose-check/.env config --quiet

  image:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/getio0909/librechat-dev@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build date
        run: printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build and publish development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/getio0909/librechat-dev:sha-${{ github.sha }}
            ghcr.io/getio0909/librechat-dev:develop
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=develop
            BUILD_DATE=${{ env.BUILD_DATE }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: development
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Deploy the published image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LIBRECHAT_ENV: ${{ secrets.LIBRECHAT_ENV }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRECHAT_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH DEPLOY_URL DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY LIBRECHAT_ENV; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing development environment setting: $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/bundle"
          cleanup() {
            rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/deploy.tgz"
          }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          cp deploy/compose.yml "$RUNNER_TEMP/bundle/compose.yml"
          cp librechat.yaml "$RUNNER_TEMP/bundle/librechat.yaml"
          printf '%s\n' "$LIBRECHAT_ENV" > "$RUNNER_TEMP/bundle/.env"
          printf 'LIBRECHAT_IMAGE=%s\n' "$LIBRECHAT_IMAGE" > "$RUNNER_TEMP/bundle/image.env"
          printf '%s' "$REGISTRY_TOKEN" > "$RUNNER_TEMP/bundle/registry.token"
          tar -czf "$RUNNER_TEMP/deploy.tgz" -C "$RUNNER_TEMP/bundle" .
          ssh -i "$RUNNER_TEMP/ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_PATH" < "$RUNNER_TEMP/deploy.tgz"
          curl --fail --silent --show-error --retry 5 --retry-delay 10 "$DEPLOY_URL/health"
          printf 'Deployed commit %s to %s\n' "$GITHUB_SHA" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
