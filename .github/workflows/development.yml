name: Development CI/CD

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/development.yml'
      - 'deploy/**'
      - 'librechat.yaml'
      - 'packages/**'
      - 'api/**'
      - 'client/**'
      - 'package*.json'
      - 'Dockerfile*'
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'getio0909/LibreChat'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - name: Verify standalone design MCP
        run: |
          node --test deploy/config.test.cjs deploy/bundle.test.cjs
          npm ci --prefix deploy/design --no-audit --no-fund
          npm --prefix deploy/design run check
          npm --prefix deploy/design test
      - name: Check changed code
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run static-checks -- --full --against "$CI_BASE"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:client-build
      - name: Check startup performance
        env:
          E2E_CHROMIUM_CHANNEL: chrome
          LIGHTHOUSE_CHROME_FLAGS: --no-sandbox
        run: npm run lighthouse
      - name: Validate deployment files
        run: |
          bash -n deploy/deploy.sh deploy/bootstrap.sh deploy/deploy.test.sh deploy/bootstrap.test.sh deploy/freecad.sh deploy/runtime.test.sh
          shellcheck -x deploy/deploy.sh deploy/bootstrap.sh deploy/deploy.test.sh deploy/bootstrap.test.sh deploy/freecad.sh deploy/runtime.test.sh
          bash deploy/deploy.test.sh
          bash deploy/bootstrap.test.sh
          mkdir -p /tmp/compose-check
          cp deploy/compose.yml /tmp/compose-check/compose.yml
          cp librechat.yaml /tmp/compose-check/librechat.yaml
          printf 'MEILI_MASTER_KEY=ci-config-validation\nRAG_DB_PASSWORD=ci-config-validation\n' > /tmp/compose-check/.env
          LIBRECHAT_IMAGE=librechat:ci FREECAD_IMAGE=freecad:ci DESIGN_IMAGE=design:ci docker compose -f /tmp/compose-check/compose.yml --env-file /tmp/compose-check/.env config --quiet

  image:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/getio0909/librechat-dev@${{ steps.build.outputs.digest }}
      freecad: ghcr.io/getio0909/librechat-freecad@${{ steps.cad.outputs.digest }}
      design: ghcr.io/getio0909/librechat-design@${{ steps.design.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build date
        run: printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build and publish development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/getio0909/librechat-dev:sha-${{ github.sha }}
            ghcr.io/getio0909/librechat-dev:develop
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=develop
            BUILD_DATE=${{ env.BUILD_DATE }}
      - name: Build and publish FreeCAD gateway
        id: cad
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/freecad.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/getio0909/librechat-freecad:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/getio0909/LibreChat
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=freecad
          cache-to: type=gha,mode=max,scope=freecad
      - name: Build and publish standalone design MCP
        id: design
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/design.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/getio0909/librechat-design:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/getio0909/LibreChat
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=design
          cache-to: type=gha,mode=max,scope=design
      - name: Verify the complete private CAD stack
        env:
          FREECAD_IMAGE: ghcr.io/getio0909/librechat-freecad@${{ steps.cad.outputs.digest }}
          DESIGN_IMAGE: ghcr.io/getio0909/librechat-design@${{ steps.design.outputs.digest }}
        run: bash deploy/runtime.test.sh

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: development
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Deploy the published image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          CAD_DOWNLOAD_LINK_TTL_SECONDS: ${{ vars.CAD_DOWNLOAD_LINK_TTL_SECONDS }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LIBRECHAT_ENV: ${{ secrets.LIBRECHAT_ENV }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRECHAT_IMAGE: ${{ needs.image.outputs.image }}
          FREECAD_IMAGE: ${{ needs.image.outputs.freecad }}
          DESIGN_IMAGE: ${{ needs.image.outputs.design }}
          ORIGIN_CERT: ${{ secrets.ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.ORIGIN_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          USER_EMAIL: ${{ vars.USER_EMAIL }}
          USER_USERNAME: ${{ vars.USER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH DEPLOY_URL DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY LIBRECHAT_ENV LIBRECHAT_IMAGE FREECAD_IMAGE DESIGN_IMAGE OPENROUTER_API_KEY ARK_API_KEY GEMINI_API_KEY ORIGIN_CERT ORIGIN_KEY ADMIN_EMAIL ADMIN_USERNAME ADMIN_PASSWORD USER_EMAIL USER_USERNAME USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing development environment setting: $name"
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/opt/[a-zA-Z0-9_/-]+$ ]]; then
            echo '::error::DEPLOY_PATH must be a directory under /opt.'
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/bootstrap"
          cleanup() {
            rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/bootstrap"
            rm -f "$RUNNER_TEMP/bootstrap.tgz"
          }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          cp deploy/compose.yml "$RUNNER_TEMP/bundle/compose.yml"
          cp librechat.yaml "$RUNNER_TEMP/bundle/librechat.yaml"
          printf '%s\n' "$LIBRECHAT_ENV" > "$RUNNER_TEMP/bundle/.env"
          for name in OPENROUTER_API_KEY ARK_API_KEY GEMINI_API_KEY; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || "$value" == *"'"* || "$value" == *\\* ]]; then
              echo "::error::$name must be a single-line API key without single quotes or backslashes."
              exit 1
            fi
            printf "\n%s='%s'\n" "$name" "$value" >> "$RUNNER_TEMP/bundle/.env"
          done
          printf 'LIBRECHAT_IMAGE=%s\nFREECAD_IMAGE=%s\nDESIGN_IMAGE=%s\n' "$LIBRECHAT_IMAGE" "$FREECAD_IMAGE" "$DESIGN_IMAGE" > "$RUNNER_TEMP/bundle/image.env"
          printf '%s' "$REGISTRY_TOKEN" > "$RUNNER_TEMP/bundle/registry.token"
          node deploy/bundle.mjs
          tar -czf "$RUNNER_TEMP/bootstrap/deploy.tgz" -C "$RUNNER_TEMP/bundle" .
          cp deploy/bootstrap.sh deploy/deploy.sh deploy/nginx.conf "$RUNNER_TEMP/bootstrap/"
          printf '%s\n' "$ORIGIN_CERT" > "$RUNNER_TEMP/bootstrap/origin.pem"
          printf '%s\n' "$ORIGIN_KEY" > "$RUNNER_TEMP/bootstrap/origin.key"
          tar -czf "$RUNNER_TEMP/bootstrap.tgz" -C "$RUNNER_TEMP/bootstrap" .
          ssh_options=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             umask 077
             install -d -m 700 '$DEPLOY_PATH'
             stage=\$(mktemp -d '$DEPLOY_PATH/.bootstrap.XXXXXX')
             cleanup() { rm -rf -- \"\$stage\"; }
             trap cleanup EXIT
             trap 'exit 1' HUP INT TERM
             tar -xzf - -C \"\$stage\" --no-same-owner --no-same-permissions
             rm -rf -- '$DEPLOY_PATH/.bootstrap'
             bash \"\$stage/bootstrap.sh\" '$DEPLOY_PATH'
             SSH_ORIGINAL_COMMAND='deploy $DEPLOY_PATH' /usr/local/lib/librechat/deploy.sh '$DEPLOY_PATH' < \"\$stage/deploy.tgz\"" < "$RUNNER_TEMP/bootstrap.tgz"
          curl --fail --silent --show-error --retry 5 --retry-delay 10 "$DEPLOY_URL/health"
          printf 'Deployed commit %s to %s\n' "$GITHUB_SHA" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
