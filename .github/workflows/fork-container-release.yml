name: Fork Container Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (for example dev-20261011)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-container-release
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'getio0909/LibreChat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/getio0909/librechat:${{ inputs.tag }}
          provenance: true
